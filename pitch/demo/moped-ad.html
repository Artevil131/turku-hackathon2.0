<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><title>Synthetic moped ad (for the demo)</title>
<!-- A made-up ad for the pitch video, in the shape of a Finnish marketplace listing. No real seller. -->
<style>
  body { margin: 0; font: 16px/1.45 system-ui, "Segoe UI", sans-serif; color: #1b1b1b; background: #fff; width: 390px; }
  .bar { background: #3b2a8f; color: #fff; padding: 14px 16px; font-weight: 700; }
  .photo { height: 230px; background: linear-gradient(135deg, #c9c3e6, #eeecf7); display: grid; place-items: center; color: #4c4580; }
  .wrap { padding: 14px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .price { font-size: 28px; font-weight: 800; margin: 6px 0 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  td { padding: 8px 0; border-bottom: 1px solid #e6e6e6; }
  td:first-child { color: #666; width: 48%; }
  p { margin: 12px 0; }
  .part2 { padding-top: 6px; }
</style></head>
<body>
  <section id="part1">
    <div class="bar">Ajoneuvot · Mopot</div>
    <div class="photo">[kuva]</div>
    <div class="wrap">
      <h1>Myydään mopo Derbi Senda 50 SM</h1>
      <div>Turku</div>
      <div class="price">650 €</div>
    </div>
  </section>
  <section id="part2" class="wrap part2">
    <table>
      <tr><td>Vuosimalli</td><td>2019</td></tr>
      <tr><td>Iskutilavuus</td><td>50 cm³</td></tr>
      <tr><td>Ajettu</td><td>6 200 km</td></tr>
      <tr><td>Ajokortti</td><td>AM-kortti riittää</td></tr>
      <tr><td>Myyjä</td><td>Yksityinen</td></tr>
    </table>
    <p>Hyvä kunto, uudet renkaat keväällä. Pieni naarmu kyljessä. Talvisäilytys lämpimässä tallissa.</p>
  </section>
  <script>
    // ?p=1 or ?p=2 shows one half, so the ad becomes two screenshots, as on a phone.
    const p = new URLSearchParams(location.search).get("p");
    if (p) for (const s of document.querySelectorAll("section")) s.hidden = s.id !== `part${p}`;
  </script>
</body></html>
