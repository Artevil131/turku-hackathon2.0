        <li>The item and the questions that quote the ad: read by an AI model (${d.model}) on our team’s own computer, from ${d.fromScreenshot ? "your screenshot" : "the ad’s text, without phone numbers or email addresses"}.</li>
        <li>The other questions and the what-ifs: general ones for this kind of item. Nothing in this draft carries a figure.</li>
      </ol>
    </section>
  `);
  document.getElementById("backBtn").addEventListener("click", () => home());
  document.getElementById("editShot")?.addEventListener("click", () => home());
  screen.querySelectorAll("[data-quote]").forEach((b) => b.addEventListener("click", () => {
    document.getElementById("quoteNote").textContent = "In the full version this opens If’s quote with these details filled in. This prototype sends nothing.";
  }));
}

/* ---------- Checking ---------- */
function check(c, key) {
  show(`
    <section class="stack-lg">
      <p class="eyebrow">Checking</p>
      <h2>${c.name}</h2>
      <ol class="steps" id="steps">
        ${c.steps.map((s) => `<li><span class="lamp" aria-hidden="true"></span><span>${s}</span></li>`).join("")}
      </ol>
    </section>
  `);
  const items = [...document.querySelectorAll("#steps li")];
  if (reduce) return result(c, key);
  let i = 0;
  const tick = () => {
    if (i > 0) items[i - 1].className = "done";
    if (i === items.length) return setTimeout(() => result(c, key), 250);
    items[i].className = "on";
    i++;
    setTimeout(tick, 420);
  };
  tick();
}

/* ---------- Result ---------- */
const WHO = { you: ["pay", "Not covered · you pay"], covered: ["covered", "Covered by insurance · after your excess"] };
function whoHtml(who, tone) {
  if (!who) return "";
  const [cls, text] = WHO[who] ?? [tone ?? "other", who];
  return `<span class="who ${cls}">${text}</span>`;
}

function barsHtml(bars) {
  const label = "Share of cars that failed their inspection: " + bars.map((b) => `${b.label} ${b.pct.toFixed(1)}%`).join(", ");
  return `
    <div class="bars" role="img" aria-label="${label}">
      ${bars.map((b) => `
        <div class="bar ${b.tone || ""} ${b.me ? "me" : ""}">
          <span class="label">${b.label}</span>
          <span class="pct">${b.pct.toFixed(1)}%</span>
          <span class="track"><span class="fill" style="width:${b.pct}%"></span></span>
        </div>`).join("")}
      <div class="axis" aria-hidden="true"><span>0%</span><span>50%</span><span>100%</span></div>
    </div>`;
}

function asksHtml(c, list = c.asks) {
  return list.map((a) => `
    <li class="ask"><div class="ask-body">
      <span class="q">${a.q}</span>
      <p>${a.why}</p>
      ${a.bars ? barsHtml(a.bars) : ""}
      <div class="whatif">
        <span class="text">${a.whatif}</span>
        ${a.cost ? `<span class="cost">${a.cost}</span>` : "<span></span>"}
        ${whoHtml(a.who, a.tone)}
      </div>
      ${a.tip ? `<p class="tip">${a.tip}</p>` : ""}
      ${a.link ? `<a class="link" href="${a.link.href}" target="_blank" rel="noopener">${a.link.text} ↗</a>` : ""}
      <span class="tag ${a.real ? "real" : ""}">${a.tag}</span>
    </div></li>`).join("");
}

// Asks beyond the three, collapsed under them in the same style, numbered on from 4. Any result may carry `more`.
function moreHtml(c) {
  const n = c.more?.length ?? 0;
  if (!n) return "";
  return `
      <details class="more-asks">
        <summary>${n} more thing${n === 1 ? "" : "s"} to check</summary>
        <ol class="asks" start="${c.asks.length + 1}" style="counter-reset: ask ${c.asks.length}">${asksHtml(c, c.more)}</ol>
      </details>`;
}

function stackHtml(rows, scaleMax, label) {
  const segs = { price: 0, fix: 0, run: 0, ins: 0 };
  rows.forEach((r) => { segs[r.seg] += r.eur ?? 0; });
  const w = (n) => ((n / scaleMax) * 100).toFixed(2);
  return `<div class="stackbar" role="img" aria-label="${label}: about ${eur(sum(rows))}">
    ${["price", "fix", "run", "ins"].map((s) => `<span class="seg-${s}" style="width:${w(segs[s])}%"></span>`).join("")}
  </div>`;
}

function costHtml(c) {
  if (!c.costs || !c.costs.some((r) => r.eur)) return "";
  const keyColor = { price: "var(--ink)", fix: "var(--risk)", run: "var(--run)", ins: "var(--blue)" };
  const open = [...new Set(c.costs.filter((r) => r.eur == null).map((r) => r.open ?? "insurance"))];
  return `
    <section class="sheet">
      <p class="eyebrow">${c.period}</p>
      <h2>What it really costs you</h2>
      ${stackHtml(c.costs, sum(c.costs), c.name)}
      <ul class="costrows">
        ${c.costs.map((r) => `
          <li><span class="key" style="background:${keyColor[r.seg]}"></span>
            <span class="what">${r.what}<small>${r.note}</small></span>
            ${r.eur != null ? `<span class="eur">${eur(r.eur)}</span>`
              : r.link ? `<a class="eur open" href="${r.link.href}" target="_blank" rel="noopener">${r.link.text} ↗</a>` : `<span class="eur open">${r.none ?? "Your price below"}</span>`}</li>`).join("")}
      </ul>
      <div class="total"><span class="kicker">${c.period}${open.length ? `, before ${open.join(" and ")}` : ""}</span><span class="eur">≈ ${eur(Math.round(sum(c.costs) / 100) * 100)}</span></div>
      <p class="fine">${c.costNote}</p>
    </section>`;
}

function compareHtml(c) {
  const k = c.compare;
  if (!k) return "";
  if (!state.compare) {
    return `
      <section class="stack">
        <h2>${k.label}</h2>
        <button class="btn ghost small" type="button" id="compareBtn">${k.button}</button>
      </section>`;
  }
  const max = Math.max(sum(c.costs), sum(k.other.costs));
  const row = (name, rows) => `
    <div class="row"><div class="head"><b>${name}</b><span>≈ ${eur(sum(rows))}</span></div>${stackHtml(rows, max, name)}</div>`;
  return `
    <section class="sheet pop" id="compareSheet">
      <p class="eyebrow">${k.label}</p>
      <p class="verdict">${k.verdict}</p>
      ${k.insureLine ? `<p class="insline">${k.insureLine}</p>` : ""}
      <div class="versus">${row(c.name, c.costs)}${row(k.other.name, k.other.costs)}</div>
      <div class="table-wrap">
        <table class="facts">
          <thead><tr><th scope="col"></th><th scope="col">${k.heads[0]}</th><th scope="col">${k.heads[1]}</th></tr></thead>
          <tbody>${k.rows.map((r) => `<tr><th scope="row">${r[0]}</th><td class="num">${r[1]}</td><td class="num">${r[2]}</td></tr>`).join("")}</tbody>
        </table>
      </div>
      <span class="tag real">${k.tag}</span>
    </section>`;
}

function saferHtml(c) {
  const s = c.safer;
  if (!s) return "";
  return `
    <section class="sheet">
      <p class="eyebrow">${s.label}</p>
      <h2>${s.title}</h2>
      ${s.bars ? barsHtml(s.bars) : ""}
      ${s.points ? `<ul class="reasons">${s.points.map((p) => `<li>${p}</li>`).join("")}</ul>` : ""}
      <p class="fine">${s.note}</p>
      <span class="tag real">${s.tag}</span>
    </section>`;
}

function replyHtml(c) {
  const r = c.reply;
  if (!r) return "";
  if (!state.replied) {
    return `
      <section class="stack">
        <h2>The seller replied?</h2>
        <p>Paste the seller’s message. You get an answer to send back.</p>
        <label class="field" for="sellerMsg">Seller’s message</label>
        <textarea id="sellerMsg" class="short" spellcheck="false">${r.seller}</textarea>
        <button class="btn small" type="button" id="replyBtn">What do I say?</button>
      </section>`;
  }
  return `
    <section class="sheet pop" id="replySheet">
      <p class="eyebrow">Your answer to the seller</p>
      <p class="offer">Offer ${eur(r.offer)}</p>
      <ul class="reasons">${r.reasons.map((x) => `<li>${x}</li>`).join("")}</ul>
      <label class="field" for="yourMsg">Your reply</label>
      <textarea id="yourMsg" class="short" readonly>${r.message}</textarea>
      <div class="copyrow"><button class="btn ghost small" type="button" id="copyBtn" style="width:auto">Copy reply</button><span class="fine" id="copyNote" aria-live="polite"></span></div>
      <div class="saved"><span>You keep</span><b>${eur(r.saved)}</b></div>
      <p class="fine">${r.savedNote}</p>
    </section>`;
}

function coverHtml(c) {
  const v = c.cover;
  if (!v) return "";
  return `
    <section class="sheet">
      <p class="eyebrow">What if something goes wrong</p>
      <h2>Who pays</h2>
      <ul class="cover">
        ${v.items.map((x) => `<li><span class="what">${x.what}</span>${whoHtml(x.who, x.tone)}${x.note ? `<span class="fine">${x.note}</span>` : ""}</li>`).join("")}
      </ul>
      <p class="fine">${v.note}</p>
    </section>`;
}

function laterHtml(c) {
  const l = c.later;
  return `
    <section class="sheet">
      <p class="eyebrow">${l.label} · for If customers</p>
      <h2>It speaks up when it matters</h2>
      ${l.notif ? `
      <div class="phone" aria-label="Example notification">
        <div class="notif">
          <div class="meta"><span>What if…</span><span>${l.notif.meta}</span></div>
          <b>${l.notif.title}</b>
          <p>${l.notif.text}</p>
        </div>
      </div>` : ""}
      <ul class="timeline">
        ${l.list.map((n) => `<li><span class="when">${n.when}</span><span>${n.text}</span></li>`).join("")}
      </ul>
    </section>`;
}

function insureHtml(c) {
  const i = c.insure;
  return `
    <section class="insure">
      <p class="eyebrow">${i.label}</p>
      <h3>${i.title}</h3>
      <p>${i.text}</p>
      ${i.details?.length ? `<dl class="kv">${i.details.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : ""}
      <button class="btn small" type="button" data-quote>Get a quote</button>
      <p class="fine" id="quoteNote" aria-live="polite">The details above are already filled in.</p>
    </section>`;
}

function sourcesHtml(c) {
  const ids = [...new Set([...(c.sources ?? []), ...(c.cover?.sources ?? [])])].filter((id) => SRC[id]);
  return `
    <section class="sources">
      <p class="eyebrow">Sources</p>
      <ol>
        ${ids.map((id) => `<li><a href="${SRC[id].url}" target="_blank" rel="noopener">${SRC[id].text}</a></li>`).join("")}
        ${c.readout ? (c.ai
          ? `<li>Some details were read from the ${c.fromScreenshot ? "screenshot" : "ad"} by an AI model (${c.ai.model}) on our team’s own computer; the rules read the rest. The numbers and who pays come from the rules and the sources above.</li>`
          : "<li>Read from the ad by rules, no AI. Check “What we read from the ad” against the ad itself.</li>") : ""}
        <li>Anything marked estimate is a rough figure for this prototype. With If’s own claims data it would be exact.</li>
      </ol>
    </section>`;
}

function result(c, key, still) {
  if (state.key !== key || state.current !== c) { state.compare = false; state.replied = false; }
  state.current = c;
  state.key = key;
  show(`
    <button class="back" type="button" id="backBtn">← New ad</button>
    <section class="item">
      <span class="stamp">${c.stamp}</span>
      <p class="name">${c.name}</p>
      <p class="specs">${c.specs}</p>
      ${shotHtml(c)}
      <div class="price"><span class="kicker">${c.priceLabel}</span>${c.price != null ? `<span class="amount">${eur(c.price)}</span>` : `<span class="amount none">Not in the ad</span>`}</div>
      ${c.readout ? `<details class="read"><summary>What we read from the ad</summary><dl class="kv">${c.readout.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></details>` : ""}
    </section>
    <section class="sheet">
      <p class="eyebrow">Before you sign</p>
      <h2>Ask these ${c.asks.length} things</h2>
      <ol class="asks">${asksHtml(c)}</ol>
      ${moreHtml(c)}
    </section>
    ${costHtml(c)}
    ${compareHtml(c)}
    ${saferHtml(c)}
    ${replyHtml(c)}
    ${coverHtml(c)}
    ${laterHtml(c)}
    ${insureHtml(c)}
    ${sourcesHtml(c)}
  `, still);
  wire();
}

function reveal(sheetId) {
  result(state.current, state.key, true);
  const el = document.getElementById(sheetId);
  if (el) el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
}

function wire() {
  document.getElementById("backBtn").addEventListener("click", () => home());
  document.getElementById("editShot")?.addEventListener("click", () => home());
  const cmp = document.getElementById("compareBtn");
  if (cmp) cmp.addEventListener("click", () => { state.compare = true; reveal("compareSheet"); });
  const rb = document.getElementById("replyBtn");
  if (rb) rb.addEventListener("click", () => { state.replied = true; reveal("replySheet"); });
  const cb = document.getElementById("copyBtn");
  if (cb) cb.addEventListener("click", () => {
    const box = document.getElementById("yourMsg");
    const note = document.getElementById("copyNote");
    const fallback = () => { box.focus(); box.select(); note.textContent = "Selected. Press copy on your keyboard."; };
    try {
      navigator.clipboard.writeText(box.value).then(() => { note.textContent = "Copied"; }, fallback);
    } catch { fallback(); }
  });
  screen.querySelectorAll("[data-quote]").forEach((b) => b.addEventListener("click", () => {
    document.getElementById("quoteNote").textContent = "In the full version this opens If’s quote with these details filled in. This prototype sends nothing.";
  }));
}

// Opened by the bookmarklet: the ad's text is in "#ad=…". Take it out of the address at once, so it stays out of the
// history, put it in the box and check it as if it had been pasted.
const handed = engine.adFromHash(location.hash);
if (handed) {
  history.replaceState(null, "", location.pathname + location.search);
  state.text = handed;
  home();
  const form = document.getElementById("checkForm");
  if (form.requestSubmit) form.requestSubmit(); else form.dispatchEvent(new Event("submit", { cancelable: true }));
} else home();
</script>
