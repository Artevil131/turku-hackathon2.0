      const extra = near((ra.ad - ra.main.avg) * a * 12, 10);
      R.add(above ? 25 : 70, { q: above ? "“Why is the rent above the area’s average?”" : "“How is the rent raised, and when next?”",
        why: `The rent is ${m2(ra.ad)} per m² a month (${eurc(r.rent)} for ${sq(a)}). ${ra.main.text}: this one is ${vs(d)}.${ra.second ? ` ${ra.second}` : ""}${r.waterFee?.amount ? " Statistics Finland counts a separate water fee as rent; this ad’s water fee comes on top." : ""} A rent increase needs a basis agreed in the lease, such as an index; a term letting the landlord decide alone is void.`,
        whatif: above ? `What if you rent it for a year? That’s about ${eur(extra)} more than the area’s average for ${sq(a)}.` : "What if the rent goes up each year? The lease says on what basis, so read that term before you sign.",
        cost: above ? `≈ ${eur(extra)} a year` : "", who: "Not insurance · it’s the rent you agree", tone: "other",
        tag: `Statistics Finland ${qText(ra.main.period)}${ra.main.obs ? ` · ${grp(ra.main.obs)} rents` : ""} · Residential Leases Act, section 27`, real: true }, [ra.main.src, ra.muniSrc].filter(Boolean));
    }

    // Your own home insurance: the generic question, after everything the ad itself raises.
    R.add(80, { q: "“Do I need my own home insurance?”",
      why: `${r.homeInsuranceRequired ? "The ad says yes: home insurance is required. " : ""}The landlord’s insurance covers the building. It doesn’t cover your things or damage you cause.`,
      whatif: `What if a leak you caused reaches the flat below? An average leak costs about ${eur(near(F.leaks.avg, 100))}.`, cost: `≈ ${eur(near(F.leaks.avg, 100))}`,
      who: "covered", tag: `Finanssiala, leak damages ${F.leaks.year}`, real: true }, ["leaks"]);

    const all = R.done();
    const asks = all.slice(0, 3).map((x) => x.ask), more = all.slice(3).map((x) => x.ask);
    for (const x of all) sources.push(...x.src);

    const costs = [];
    if (r.rent) costs.push({ what: "Rent", note: `${eurc(r.rent)} a month × 12 · from the ad`, eur: r.rent * 12, seg: "price" });
    if (r.waterFee?.amount) costs.push({ what: "Water", note: `${eurc(r.waterFee.amount)} a month${r.waterFee.perPerson ? " per person, for one person" : ""} × 12 · from the ad`, eur: r.waterFee.amount * 12, seg: "run" });
    costs.push({ what: "Home insurance", note: "Depends on the flat and you", eur: null, seg: "ins" });
    const place = [r.city, r.district].filter(Boolean).map(esc).join(" · ");
    const typeText = r.buildingType ?? "building";
    return {
      kind: "rent", stamp: "Rental flat",
      name: a ? `${r.rooms ? `${r.rooms} room${r.rooms > 1 ? "s" : ""}` : "Flat"}, ${sq(a)}` : r.rooms ? `${r.rooms}-room flat` : "Flat to rent",
      specs: [place, y ? `${typeText} from ${y}` : r.buildingType, dep ? `deposit ${eur(dep)}` : r.noDeposit ? "no deposit" : null].filter(Boolean).join(" · "),
      price: r.rent, priceLabel: "Rent a month",
      steps: ["Reading the ad", "Checking the deposit and the lease rules", ra ? "Comparing the rent with the area’s average" : y ? `Looking up buildings from ${y}` : "Looking up the building", "Checking who pays if something goes wrong"],
      asks, more, period: "Over one year", costs: r.rent ? costs : null,
      costNote: dep ? `Plus the deposit of ${eur(dep)}, which you get back if the flat is in good shape.` : "Only numbers from the ad. Insurance depends on you, so get your own price below.",
      cover: COVER.rent,
      later: { label: "After you move in", notif: { meta: "Thu 19:05", title: "Moving in tomorrow?", text: "Photograph every room before you unpack. It’s your proof for the deposit." }, list: [
        { when: "Day one", text: "Photograph every room before you unpack. It’s your proof for the deposit." },
        { when: "Day one", text: "Find the water shut-off. When a hose bursts, the first minutes decide how big the damage gets." },
        { when: "Away a week", text: "Turn off the water to the dishwasher and washing machine." },
        { when: "Moving out", text: "One month’s notice from you. We remind you what to check for the deposit." },
      ] },
      insure: { label: "Before you move in", title: "Get reminders for this flat.", text: "They come with If home insurance. The landlord’s insurance doesn’t cover your things or damage you cause.",
        details: [["Flat", [a ? sq(a) : null, y ? `${typeText} from ${y}` : null].filter(Boolean).join(", ") || "From the ad"], place ? ["Area", place] : null].filter(Boolean) },
      readout: [["Rent", shown(r.rent, (v) => `${eurc(v)} a month`)], ["Deposit", r.noDeposit && !dep ? "none, says the ad" : shown(dep, eurc)], ["Size", shown(a, sq)], ["Built", shown(y)],
        ["Rent per m²", ra ? `${m2(ra.ad)} · area average ${m2(ra.main.avg)} (${qText(ra.main.period)})` : a && r.rent ? m2(r.rent / a) : nf],
        ["Home insurance required", r.homeInsuranceRequired ? "yes, says the ad" : nf], ["Area", place || nf], ["Postcode", shown(r.postcode, esc)]],
      sources: uniq(sources),
    };
  }

  /* ---------- the place: radon and flood risk areas ---------- */
  // STUK's radon by municipality and SYKE's significant flood risk areas (data/radon-municipalities.json,
  // data/flood-risk-areas.json), with houses' facts (data/house-rules.json): sources "r-", "f-" and "h-".
  const RAD = F.radon ?? null, FL = F.flood ?? null, H = F.house ?? {};
  for (const s of [RAD?.sources, FL?.sources, H.sources]) for (const [id, v] of Object.entries(s ?? {})) SRC[id] = v;
  const has = (...ids) => ids.flat(Infinity).filter((id) => id && SRC[id]);
  const FLOOD_WORDS = { river: "river floods", lake: "lake floods", sea: "sea floods", stormwater: "stormwater floods" };
  // What the public data says about a municipality: radon and flood risk areas, as asks ready for a result's list,
  // each with its sources. For flats too: call areaRisks(h.city, { kind: "flat" }) and push the asks into `more`.
  // Only facts about the municipality, never about the address: an area covers part of a municipality at most.
  function areaRisks(municipality, { kind = "house" } = {}) {
    const muni = municipality ? RAD?.alias?.[municipality] ?? municipality : null;
    const out = { radon: null, flood: [], asks: [] };
    if (!muni) return out;
    const r = RAD?.m?.[muni];
    const ground = kind === "flat" ? "In a flat, radon matters mostly on the ground floor, where the floor is in contact with the soil. " : "";
    const m = H.radon ?? {};
    if (r) {
      out.radon = { municipality: muni, avg: r[0], over300: r[1], measured: r[2] };
      const share = r[1] != null ? `, and ${r[1]}% of them were above the reference level of ${RAD.ref} Bq/m³` : "";
      out.asks.push({ rank: r[1] != null && r[1] >= 15 ? 73 : 50, sources: has(RAD.src, RAD.refSrc, m.src), ask: {
        q: `“Has radon been measured in the ${kind === "flat" ? "flat" : kind === "cottage" ? "cottage" : "house"}?”`,
        why: `${ground}In ${esc(muni)}, STUK’s register has ${grp(r[2])} measured small houses. Their average is ${r[0]} Bq/m³${share}. Those are houses people chose to measure, not a sample, and a single home’s radon is known only by measuring it.`
          + (m.season ? ` A measurement takes at least ${m.months ?? 2} months, ${m.season}.` : ""),
        whatif: `What if it is above ${RAD.ref} Bq/m³? Lowering radon is work on the building, and it is the owner’s cost.`, cost: m.price ? `≈ ${eur(m.price)} to measure` : "",
        who: "you", tag: `STUK, radon by municipality · reference level ${RAD.ref} Bq/m³`, real: true } });
    }
    const areas = (FL?.m?.[muni] ?? []).map((i) => FL.a[i]);
    if (areas.length) {
      out.flood = areas.map(([name, types, year]) => ({ name, types, year }));
      const ins = H.ins?.flood;
      out.asks.push({ rank: 48, sources: has(FL.src, FL.mapSrc, FL.lawSrc, ins?.src), ask: {
        q: kind === "flat" ? "“Has the building ever flooded?”" : `“Has the ${kind === "cottage" ? "cottage" : "house"} or plot ever flooded?”`,
        why: `Part of ${esc(muni)} is in a significant flood risk area named in ${areas[0][2]} under the Act on Flood Risk Management: ${areas.map(([n, t]) => `${esc(n)} (${t.map((x) => FLOOD_WORDS[x] ?? x).join(" and ")})`).join("; ")}. Whether this address is in the flood zone shows on the national flood map.`,
        whatif: "What if water rises into the house?" + (ins?.rule ? ` ${ins.rule}` : " Whether home insurance pays depends on the policy."), cost: "",
        who: ins?.covered ? ins.who ?? "Depends on the policy · check before you sign" : "Depends on the policy · check before you sign", tone: "other",
        link: SRC[FL.mapSrc] ? { href: SRC[FL.mapSrc].url, text: "Check the address on the flood map" } : null,
        tag: "SYKE: significant flood risk areas 2024 · Act 620/2010", real: true } });
    }
    return out;
  }

  /* ---------- houses and cottages: the rules ---------- */
  // Every number here comes from data/house-rules.json (or the radon, flood and electricity data), with a source.
  // An unknown field makes no claim: a rule fires on what the ad says, or on a sourced fact about the building's era.
  const ROOF_WORDS = { felt: "felt", "sheet metal": "sheet-metal", tile: "tile" };
  const SYSTEM_WORDS = { "holding tank": "a holding tank (umpisäiliö)", "small treatment plant": "a small treatment plant (pienpuhdistamo)", "septic tanks": "septic tanks (saostuskaivot)",
    "soil filter": "a soil filter (maasuodattamo)", "soil infiltration": "a soil infiltration field (imeytyskenttä)", "dry toilet": "a dry toilet" };
  const HEAT_WORDS = { oil: "oil", "ground-source": "ground-source heat pump", "air-to-water": "air-to-water heat pump", district: "district heating", wood: "wood",
    "direct electric": "direct electric", "storage electric": "storage electric", electric: "electric", "air-to-air": "air-source heat pump" };
  const range = (a) => (a ? (a[0] === a[1] || a[1] == null ? `${a[0]}` : `${a[0]}–${a[1]}`) : "");
  const quote = (s) => `“${esc(s.replace(/[“”"]/g, "").trim())}”`;
  COVER.house = (h, flood) => {
    const ins = H.ins ?? {};
    const it = h.cottage ? "cottage" : "house";
    const items = [
      ins.fire && { what: `A fire damages the ${it}`, who: "Covered by home insurance · after your excess", tone: "covered", note: ins.fire.rule },
      ins.leak && { what: "A pipe or appliance suddenly leaks", who: "Covered by home insurance · after your excess", tone: "covered", note: ins.leak.rule },
      ins.storm && { what: "A storm damages the roof", who: "Covered by home insurance · after your excess", tone: "covered", note: ins.storm.rule },
      ins.empty && { what: h.cottage ? "Pipes freeze in the cottage over winter" : "Pipes freeze while the house stands empty", who: "Covered only if the empty-house rule was followed", tone: "other", note: ins.empty.rule },
      flood && ins.flood && { what: `A flood reaches the ${it}`, who: ins.flood.who ?? "Depends on the policy · check before you sign", tone: ins.flood.covered ? "covered" : "other", note: ins.flood.rule },
      { what: "A defect that was there when you bought it", who: "Not covered by home insurance · the seller answers for a hidden defect", tone: "other",
        note: `Under the Land Code the seller answers for a hidden defect; you must tell the seller within a reasonable time of finding it, and at most ${H.land?.years ?? 5} years after you got the house.` },
      ins.defects && { what: "Wear, rot or mould that grew slowly", who: "Not covered · you pay", tone: "pay", note: ins.defects.rule },
    ].filter(Boolean);
    return { items, note: "Home insurance pays for sudden damage. A defect from before the sale is between you and the seller, and wear is the owner’s cost."
      + (H.ins?.hdi?.rule ? ` ${H.ins.hdi.rule}` : ""), sources: has(ins.fire?.src, ins.leak?.src, ins.storm?.src, ins.empty?.src, flood && ins.flood?.src, ins.defects?.src, H.land?.src, H.ins?.hdi?.src) };
  };

  function houseResult(h) {
    const y = h.buildingYear, a = h.livingAreaM2, cot = h.cottage;
    const what = cot ? "cottage" : "house";
    const L = H.land ?? {};
    const years = L.years ?? 5;
    const cands = []; // [rank, ask, sources]
    const add = (rank, ask, ...src) => cands.push([rank, { cost: "", real: true, ...ask }, has(src)]);
    const inspectLaw = `You can’t claim later for a defect you should have noticed when inspecting the ${what} (Land Code 540/1995, chapter 2, section 22).`;

    // What the ad itself says about moisture or mould comes first: once told, it is no longer a hidden defect.
    if (h.moisture?.length) {
      add(100, { q: "“Where was the moisture, what was done about it, and can I see the measurements?”",
        why: `The ad says ${quote(h.moisture[0])}. You can’t claim later as a defect anything you could have noticed by inspecting the ${what}, or anything you must be presumed to have known when you bought it (Land Code 540/1995, chapter 2, section 22).`,
        whatif: "What if the damage is bigger than the ad says? Ask for the reports before you sign: a defect you were told about is your cost.", who: "you",
        tag: "From the ad · Land Code 540/1995, 2:22" }, L.src);
    }

    // The condition inspection, and the buyer's duty to inspect.
    const kt = H.kt;
    const ktCost = kt ? `€${grp(kt.low)}–${grp(kt.high)}` : "";
    const done = h.inspection?.done === true;
    add(90, { q: done ? `“Can I see the condition inspection report${h.inspection.year ? ` from ${h.inspection.year}` : ""}?”` : "“Has a condition inspection been done? If not, may I have one done before we sign?”",
      why: (done ? `The ad says a condition inspection was done${h.inspection.year ? ` in ${h.inspection.year}` : ""}. ` : h.inspection?.done === false ? "The ad says no condition inspection has been done. " : "")
        + (kt?.what ? `${kt.what} ` : "") + inspectLaw + (!done && kt ? ` Condition inspectors’ published prices for a house run from €${grp(kt.low)} to €${grp(kt.high)}.` : ""),
      whatif: `What if a hidden defect shows up after you move in? Tell the seller within a reasonable time of finding it. After ${years} years from getting the ${what}, you can no longer claim (Land Code, 2:25).`,
      cost: done ? "" : ktCost, who: "The seller answers for a hidden defect · not home insurance", tone: "other",
      tag: `Land Code 540/1995, chapter 2${!done && kt ? " · price lists (secondary)" : ""}` }, L.src, !done && kt?.src, kt?.whatSrc);

    // Risk structures: what the ad says first, then sourced facts about houses of the same era.
    const RS = H.risk ?? {};
    const era = (r) => r && y && (r.from == null || y >= r.from) && (r.to == null || y <= r.to);
    const fnd = h.foundation ?? [];
    if (RS.plinth && (fnd.includes("false plinth") || (!cot && era(RS.plinth) && !fnd.length))) {
      const own = fnd.includes("false plinth");
      add(own ? 86 : 80, { q: own ? "“Has the false plinth been opened and checked, and what was found?”" : "“Does the house have a false plinth (valesokkeli)?”",
        why: `${own ? `The ad mentions a false plinth${h.plinthRepaired ? `, repaired${h.plinthRepaired === true ? "" : ` in ${h.plinthRepaired}`}` : ""}. ` : `The house is from ${y}. `}${RS.plinth.rule}`,
        whatif: "What if the bottom of the wall frame has rotted? Rot that grew slowly is not covered by home insurance: if it was hidden, the seller answers; if not, you pay.", who: "you",
        tag: own ? "From the ad · risk structure" : `Risk structures of houses from ${range([RS.plinth.from, RS.plinth.to])}` }, RS.plinth.src);
    }
    if (RS.crawl && fnd.includes("crawl space")) {
      add(78, { q: "“Is the crawl space well ventilated, and when was it last checked?”", why: `The ad says the ${what} has a crawl space (rossipohja). ${RS.crawl.rule}`,
        whatif: "What if moisture has damaged the floor structure? Slow damage is not covered by home insurance.", who: "you", tag: "From the ad · risk structure" }, RS.crawl.src);
    }
    if (RS.flat && (h.roofType === "flat" || (!h.roofType && !cot && era(RS.flat) && RS.flat.from != null))) {
      const own = h.roofType === "flat";
      add(own ? 77 : 58, { q: own ? "“Has the flat roof ever leaked, and when was it last renewed?”" : "“Is the roof flat or low-pitched?”",
        why: `${own ? "The ad says the roof is flat. " : `The house is from ${y}. `}${RS.flat.rule}`,
        whatif: "What if water has seeped in slowly? Slow leaks are not covered by home insurance.", who: "you", tag: own ? "From the ad · risk structure" : "Risk structures by era" }, RS.flat.src);
    }
    if (RS.slab && fnd.includes("slab on ground") && era(RS.slab)) {
      add(70, { q: "“How is the floor slab insulated, and has moisture been measured under the floor?”", why: `The ad says the house stands on a slab on the ground, and it is from ${y}. ${RS.slab.rule}`,
        whatif: "What if moisture has damaged the floor? Slow damage is not covered by home insurance.", who: "you", tag: "From the ad · risk structure" }, RS.slab.src);
    }

    // Oil heating: the tank, and what switching costs.
    const O = H.oil ?? {};
    const oil = h.heating?.includes("oil") || (h.oilTank && !h.oilTank.removed);
    if (oil) {
      const t = h.oilTank;
      add(72, { q: "“How old is the oil tank, and when was it last inspected?”",
        why: `The ad says the house has oil heating${t?.place ? `, with the tank ${t.place === "underground" ? "underground" : "indoors"}` : ""}${t?.inspected ? `, and that the tank was inspected${t.inspected === true ? "" : ` in ${t.inspected}`}` : ""}. ${O.tank?.rule ?? ""}`.trim(),
        whatif: "What if the tank leaks? Cleaning up polluted soil is the owner’s cost.", who: "you",
        tip: O.ground ? `Replacing oil heating with a ground-source heat pump costs about €${grp(O.ground[0])}–${grp(O.ground[1])}${O.air ? `, with an air-to-water heat pump about €${grp(O.air[0])}–${grp(O.air[1])}` : ""}.` : "",
        tag: "From the ad · heating-oil tank rules" }, O.tank?.src, O.spill?.src, O.ground && O.switchSrc);
    } else if (h.oilGone) {
      add(55, { q: "“Was the old oil tank removed, and can I see the papers?”", why: `The ad says the oil heating was replaced. ${O.spill?.rule ?? ""}`.trim(),
        whatif: "What if an old tank was left in the ground and leaks? Cleaning up polluted soil is the owner’s cost.", who: "you", tag: "From the ad" }, O.spill?.src);
    }

    // Own wastewater system: the rules for scattered settlements.
    const W = H.ww ?? {};
    if (h.wastewater?.type === "own") {
      const near = h.shore || h.groundwaterArea;
      const sys = h.wastewater.systems.map((s) => SYSTEM_WORDS[s] ?? s);
      add(near ? 76 : 62, { q: "“Does the wastewater system meet the current requirements, and can I see its papers?”",
        why: `The ad says the ${what} has its own wastewater system: ${and(sys)}. `
          + (near ? `The ad mentions ${h.shore ? "a shore" : "a groundwater area"}. ` : "")
          + `${(near ? W.near : W.elsewhere) ?? ""} ${W.docs ?? ""} ${W.exemption ?? ""}`.trim(),
        whatif: "What if it doesn’t meet the requirements? Bringing it up to standard is the owner’s cost.", who: "you",
        tag: "Environmental Protection Act 527/2014 · Government Decree 157/2017" }, W.src);
    }

    // Own well.
    const WE = H.well ?? {};
    if (/well/.test(h.water ?? "")) {
      add(45, { q: "“When was the well water last tested, and can I see the results?”",
        why: `The ad says the water comes from ${h.water === "drilled well" ? "a drilled well" : h.water === "dug well" ? "a dug well" : "a well"}. ${WE.rule ?? ""}${h.water === "drilled well" && H.radon?.well ? ` ${H.radon.well}` : ""}`,
        whatif: "What if the water isn’t fit to drink? Treating it or a new well is the owner’s cost.", who: "you", tag: "From the ad · well water testing" }, WE.src, h.water === "drilled well" && H.radon?.wellSrc);
    }

    // Roof and foundation drains, against the lifetimes in the data.
    const LF = H.life ?? {};
    const roofLife = LF.roof?.[h.roofMaterial] ?? null;
    if (LF.roof && (h.roofRenewed !== true)) {
      const since = typeof h.roofRenewed === "number" ? h.roofRenewed : y;
      const life = roofLife ?? LF.roof.any;
      if (since && life && YEAR - since >= life[0]) {
        add(65, { q: typeof h.roofRenewed === "number" ? "“What condition is the roof in?”" : "“When was the roof last renewed?”",
          why: `${typeof h.roofRenewed === "number" ? `The ad says the roof was renewed in ${since}` : `The ad doesn’t say the roof has been renewed, and the ${what} is from ${since}`}, ${YEAR - since} years ago. ${roofLife ? `A ${ROOF_WORDS[h.roofMaterial]} roof` : "A roof covering"} lasts about ${range(life)} years.`,
          whatif: "What if it needs renewing soon? A new roof is the owner’s cost: insurance pays for sudden damage, not for age.", who: "you", tag: "Roof lifetimes" }, LF.roof.src);
      }
    }
    if (LF.drain && h.drainsRenewed !== true) {
      const since = typeof h.drainsRenewed === "number" ? h.drainsRenewed : y;
      if (since && YEAR - since >= LF.drain.years[0]) {
        add(55, { q: typeof h.drainsRenewed === "number" ? "“What condition are the foundation drains in?”" : "“Have the foundation drains (salaojat) been renewed?”",
          why: `${typeof h.drainsRenewed === "number" ? `The ad says the drains were renewed in ${since}` : `The ad doesn’t say the foundation drains have been renewed, and the ${what} is from ${since}`}, ${YEAR - since} years ago. Foundation drains last about ${range(LF.drain.years)} years.`,
          whatif: "What if they are blocked? Water stays against the foundation, and renewing them is the owner’s cost.", who: "you", tag: "Foundation drain lifetimes" }, LF.drain.src);
      }
    }

    // Cottages: winter use and the road.
    const C = H.cottage ?? {};
    if (cot && h.winterUse !== true) {
      add(66, { q: "“Can it be lived in over winter: water, heating and road?”",
        why: `${h.winterUse === false ? "The ad says it is for summer use. " : "The ad doesn’t say it can be used in winter. "}${C.use ?? ""}${H.ins?.empty ? ` ${H.ins.empty.rule}` : ""}`.trim(),
        whatif: "What if pipes freeze while it stands empty? Insurance pays only if the empty-house rule was followed.", who: "Depends on following the policy’s rules", tone: "other",
        tag: "Building Act 751/2023 · If’s home insurance terms" }, C.useSrc, H.ins?.empty?.src);
    }
    if (C.road && (cot || h.privateRoad || h.roadAccess === false)) {
      add(cot ? 52 : 44, { q: h.roadAccess === false ? "“How do you get there, and who maintains the way?”" : "“Is the road a private road, and what is the yearly road charge?”",
        why: `${h.roadAccess === false ? "The ad says there is no road to the door. " : h.privateRoad ? "The ad mentions a private road or a road charge. " : ""}${C.road}${h.roadFee ? ` The ad gives a road charge of ${eur(h.roadFee)} a year.` : ""}`,
        whatif: "What if the road needs repairs? The road association shares the cost among its members.", who: "you", tag: h.roadFee ? "From the ad · Private Roads Act 560/2018" : "Private Roads Act 560/2018" }, C.roadSrc);
    }

    // A leased plot.
    if (h.plot === "leased") {
      add(63, { q: "“When does the plot lease end, and what is the rent?”",
        why: `The ad says the plot is leased, not owned.${h.plotRent ? ` The ad gives a plot rent of ${eur(h.plotRent)} a year.` : ""} The rent and the lease’s end date are in the lease; ask for it.`,
        whatif: "What if the rent goes up at the next review? It is part of what the house costs you each year.", who: "you", tag: "From the ad" });
    }

    // Asbestos, before any renovation.
    if (y && y < 1994) {
      add(h.asbestosFound ? 70 : 35, { q: `“Has the ${what} been surveyed for asbestos?”`,
        why: `${h.asbestosFound ? "The ad mentions asbestos. " : h.asbestosSurvey ? "The ad mentions an asbestos survey. " : ""}The ${what} is from ${y}. Before renovation work in a building from before 1994, the materials must be surveyed for asbestos.`,
        whatif: "What if you plan a new bathroom? Add the survey to the cost and the timetable.", who: "you", tag: "Government Decree 798/2015, section 7" }, "asbestos");
    }

    // Radon and flood risk areas for the municipality.
    const area = areaRisks(h.city, { kind: cot ? "cottage" : "house" });
    for (const x of area.asks) cands.push([x.rank, x.ask, x.sources]);

    cands.sort((p, q) => q[0] - p[0]);
    const asks = cands.slice(0, 3).map(([, x]) => x);
    const more = cands.slice(3).map(([, x]) => x);
    const sources = cands.flatMap(([, , s]) => s);

    // Costs over five years: the ad's numbers, the law's and sourced prices; the rest is a link or a quote.
    const costs = [];
    const tt = H.tt;
    if (h.price != null) {
      costs.push({ what: "Asking price", note: "From the ad", eur: h.price, seg: "price" });
      if (tt) { costs.push({ what: "Transfer tax", note: `${tt.pct}% of the price, paid by the buyer · vero.fi`, eur: Math.round((h.price * tt.pct) / 100), seg: "price" }); sources.push(...has(tt.src)); }
    }
    if (H.title) { costs.push({ what: "Title registration (lainhuuto)", note: `National Land Survey’s fee ${H.title.year ?? ""}`.trim(), eur: H.title.fee, seg: "price" }); sources.push(...has(H.title.src)); }
    if (!done && kt) costs.push({ what: "Condition inspection", note: `From ${eur(kt.low)} in price lists, up to ${eur(kt.high)} · secondary`, eur: kt.low, seg: "fix" });
    // Heating, only from what the ad says it uses or costs.
    const EL = H.elec ?? {};
    const elecHeat = (h.heating ?? []).some((k) => /electric|ground-source|air-to/.test(k));
    if (h.heatingCostYear) costs.push({ what: "Heating", note: `${eur(h.heatingCostYear)} a year × 5 · from the ad`, eur: h.heatingCostYear * 5, seg: "run" });
    else if (h.energyKwhYear && elecHeat) {
      const band = h.energyKwhYear > 15000 && EL.E ? EL.E : EL.D;
      if (band) {
        const yr = (h.energyKwhYear * band.cents) / 100;
        costs.push({ what: "Electricity", note: `${grp(h.energyKwhYear)} kWh a year from the ad × ${String(band.cents).replace(/(\.\d)\d+$/, "$1")} c/kWh (Statistics Finland, ${band.month}, ${band.label}) × 5`, eur: Math.round(yr * 5), seg: "run" });
        sources.push(...has(EL.src));
      }
    } else if (h.oilLitresYear && oil && EL.oil) {
      const yr = (h.oilLitresYear * EL.oil.cents) / 100;
      costs.push({ what: "Heating oil", note: `${grp(h.oilLitresYear)} litres a year from the ad × ${EL.oil.cents} c/l (Statistics Finland, ${EL.oil.month}) × 5`, eur: Math.round(yr * 5), seg: "run" });
      sources.push(...has(EL.oilSrc));
    }
    if (h.propertyTaxYear) costs.push({ what: "Property tax", note: `${eurc(h.propertyTaxYear)} a year × 5 · from the ad`, eur: h.propertyTaxYear * 5, seg: "run" });
    else if (H.ptax) { costs.push({ what: "Property tax", note: "Set by the municipality on the building’s and land’s taxable value, which isn’t in the ad", eur: null, seg: "run", open: "property tax", link: { href: SRC[H.ptax.src]?.url, text: "Municipalities’ rates" } }); sources.push(...has(H.ptax.src)); }
    if (h.roadFee) costs.push({ what: "Road charge", note: `${eur(h.roadFee)} a year × 5 · from the ad`, eur: h.roadFee * 5, seg: "run" });
    if (h.plotRent) costs.push({ what: "Plot rent", note: `${eur(h.plotRent)} a year × 5 · from the ad`, eur: h.plotRent * 5, seg: "run" });
    costs.push({ what: "Home insurance", note: `Depends on the ${what} and you`, eur: null, seg: "ins" });

    const place = [h.city, h.district].filter(Boolean).map(esc).join(" · ");
    const typeText = cot ? "cottage" : "detached house";
    const heat = (h.heating ?? []).map((k) => HEAT_WORDS[k] ?? k);
    const ww = h.wastewater ? (h.wastewater.type === "municipal" ? "municipal sewer" : `own: ${h.wastewater.systems.join(", ")}`) : nf;
    const later = [
      { when: "Key day", text: `Your home insurance starts today. The ${what}’s details are already filled in.` },
      tt && { when: "Within 6 months", text: "Apply for the title (lainhuuto), with the transfer tax paid by then. We remind you before the deadline." },
      RAD && { when: "Sep–May", text: `Measure radon, if it hasn’t been measured: a measurement takes at least ${H.radon?.months ?? 2} months.` },
      /well/.test(h.water ?? "") && WE.every && { when: `Every ${range(WE.every)} years`, text: "Test the well water." },
      H.ins?.empty && { when: cot ? "Closing for winter" : "Away a week", text: H.ins.empty.short ?? H.ins.empty.rule },
    ].filter(Boolean);
    return {
      kind: "house", stamp: cot ? "Cottage for sale" : "House for sale",
      name: a ? `${cot ? "Cottage" : "House"}, ${sq(a)}` : cot ? "Cottage for sale" : "House for sale",
      specs: [place, y ? `${typeText} from ${y}` : typeText, h.plotAreaM2 ? `plot ${grp(h.plotAreaM2)} m²${h.plot === "leased" ? ", leased" : h.plot === "own" ? ", own" : ""}` : null].filter(Boolean).join(" · "),
      price: h.price, priceLabel: "Asking price",
      steps: ["Reading the ad", y ? `Looking up risk structures of houses from ${y}` : "Looking up the building", h.city ? `Checking radon and flood data for ${esc(h.city)}` : "Checking radon and flood data", "Checking who pays if something goes wrong"],
      asks, more, period: "Over five years", costs,
      costNote: "Only numbers from the ad, the law or a named source. Repairs aren’t priced: the asks above say what to find out first.",
      safer: null, cover: COVER.house(h, area.flood.length > 0),
      later: { label: "After you buy", notif: { meta: "Sun 19:10", title: cot ? "Closing the cottage for winter?" : "Away for a week?", text: H.ins?.empty?.short ?? "Close the main water valve before you go." }, list: later },
      insure: { label: "Before you get the keys", title: `Get reminders for this ${what}.`, text: `They come with If home insurance. It can start on the day the ${what} becomes yours.`,
        details: [[cot ? "Cottage" : "House", [a ? sq(a) : null, y ? `from ${y}` : null].filter(Boolean).join(", ") || "From the ad"], place ? ["Area", place] : null, heat.length ? ["Heating", esc(heat.join(", "))] : null].filter(Boolean) },
      readout: [["Type", typeText], ["Built", shown(y)], ["Living area", shown(a, sq)], ["Plot", h.plotAreaM2 ? `${grp(h.plotAreaM2)} m²${h.plot ? `, ${h.plot}` : ""}` : h.plot ? h.plot : nf],
        ["Price", shown(h.price, eur)], ["Heating", heat.length ? esc(heat.join(", ")) : nf], ["Foundation", fnd.length ? fnd.join(", ") : nf],
        ["Roof", [h.roofType, h.roofMaterial].filter(Boolean).join(", ") + (typeof h.roofRenewed === "number" ? `${h.roofType || h.roofMaterial ? ", " : ""}renewed ${h.roofRenewed}` : "") || nf],
        ["Foundation drains", typeof h.drainsRenewed === "number" ? `renewed ${h.drainsRenewed}` : h.drainsRenewed ? "renewed, says the ad" : nf], ["Wastewater", ww], ["Water", shown(h.water)],
        ["Condition inspection", h.inspection?.done ? `done${h.inspection.year ? ` ${h.inspection.year}` : ""}` : h.inspection?.done === false ? "not done, says the ad" : nf],
        ["Energy class", h.energy?.cls ? `${h.energy.cls}${h.energy.version ? ` (${h.energy.version})` : ""}` : h.energy?.none ? "no certificate required, says the ad" : nf],
        ...(cot ? [["Winter use", h.winterUse === true ? "yes, says the ad" : h.winterUse === false ? "no, says the ad" : nf]] : []), ["Area", place || nf]],
      // One entry per address: the radon data and the house facts both cite STUK's reference-level page.
      sources: uniq(sources).filter((id, i, all) => all.findIndex((x) => SRC[x]?.url === SRC[id]?.url) === i),
    };
  }

  /* ---------- motorcycles: the rules ---------- */
  // Every sentence here comes from data/moto-rules.json, with a source. A fact that isn't in the data is left out.
  const M = F.moto ?? {};
  for (const [id, s] of Object.entries(M.sources ?? {})) SRC[`m-${id}`] = { text: s.name, url: s.url };
  const mSrc = (...ids) => ids.flat().filter((id) => id && SRC[`m-${id}`]).map((id) => `m-${id}`);
  const I = M.insurance ?? {};
  COVER.moto = {
    items: [
      I.others && { what: "You crash into someone else", who: "Your traffic insurance pays for their injuries and damage", tone: "covered", note: `Every motorcycle in traffic use must have it, by law. ${I.others.note}` },
      I.ownInjuries && { what: "You’re hurt in a crash, even one you caused", who: "Your bike’s traffic insurance pays for your injuries", tone: "covered", note: I.ownInjuries.note },
      I.gear && { what: "Your riding gear is damaged in a crash", who: I.gear.who, tone: I.gear.tone ?? "covered", note: I.gear.note },
      I.ownDamage && { what: "You drop or crash your own bike", who: I.ownDamage.who, tone: "covered", note: I.ownDamage.note },
      I.theft && { what: "The bike is stolen", who: I.theft.who, tone: "covered", note: I.theft.note },
      I.wear && { what: "The chain, sprockets, tyres or brake pads wear out", who: "Not covered · you pay", tone: "pay" },
    ].filter(Boolean),
    note: "Insurance pays for accidents, injuries and theft, not for wear. That’s why the checks above matter before you buy.",
    sources: mSrc(...["others", "ownInjuries", "gear", "ownDamage", "theft", "wear"].map((k) => I[k]?.source)),
  };

  function motoResult(m) {
    const name = esc([m.make, m.model].filter(Boolean).join(" ") || "Motorcycle");
    const L = M.licences ?? {};
    const absYear = M.abs?.over125From ? +M.abs.over125From.slice(0, 4) : null;
    const sources = [];
    const asks = [];

    // The licence class is a fact about the bike, never about the person.
    let licence = null;
    if (m.licence === "A1" && L.A1) licence = `Needs an A1 licence or higher${m.powerKw == null ? `, if its power is at most ${L.A1.maxKw} kW` : ""}`;
    if (m.licence === "A2" && L.A2) licence = `Needs an A2 licence or higher, if it meets the A2 limits (${L.A2.maxKw} kW, ${L.A2.maxKwPerKg} kW per kg)`;
    if (m.licence === "A" && L.A) licence = "Needs an A licence";
    if (licence) sources.push(...mSrc(L.source));

    // 1. No year: ask for it rather than guess.
    if (!m.year) {
      const abs = absYear ? ` It also tells you whether ABS was required when it was new: since ${absYear}, every new road bike over 125 cm³ has needed ABS, and a 125 ABS or combined brakes.` : "";
      asks.push({ q: "“What year is it, and when was it first registered?”",
        why: `The ad doesn’t say. The registration certificate shows the year, the engine size and the power.${abs}`,
        whatif: "What if it’s older than it looks? The chain, sprockets, tyres and brakes wear with age and use, and wear isn’t insured.", cost: "",
        who: "you", tag: abs ? "EU Regulation 168/2013 · If’s kasko terms" : "If’s kasko terms", real: !!I.wear });
      sources.push(...mSrc(abs ? M.abs.source : null, I.wear?.source));
    }

    // 2. Changes to the bike, and what the inspection in the ad can have been.
    const noPeriodic = M.inspection?.periodic === false;
    const when = m.lastInspection ? m.lastInspection.split("-").reverse().map(Number).join("/") : null;
    const inspectionLine = noPeriodic && when
      ? ` The ad says it was inspected in ${when}, but motorcycles have no periodic inspection: ask which inspection it was. A bike needs a registration inspection, for example, to go back on the register after an insurer had it removed as damaged.`
      : "";
    if (m.modifications.length) {
      const rules = m.modifications.map((x) => [x, M.modification?.[x.replace(/ (\w)/g, (s, c) => c.toUpperCase())]]).filter(([, r]) => r);
      let why = `The ad mentions ${and(m.modifications)}.`;
      for (const [, r] of rules) { why += ` ${r.rule}`; sources.push(...mSrc(r.source)); }
      if (M.riskIncrease) { why += ` ${M.riskIncrease.rule}`; sources.push(...mSrc(M.riskIncrease.source)); }
      why += inspectionLine;
      if (inspectionLine) sources.push(...mSrc(M.inspection.source));
      const lowered = rules.some(([x]) => x === "lowered suspension");
      const exhaust = rules.some(([x]) => x === "aftermarket exhaust");
      asks.push({ q: "“What was changed, with which parts, and who fitted them?”", why,
        whatif: lowered ? "What if you crash it? Kasko doesn’t pay for the lowering springs themselves."
          : exhaust ? "What if the silencer isn’t an approved one made for this bike? It needs a modification inspection before it’s legal."
          : "What if a change wasn’t approved? Ask for the paper before you pay.", cost: "",
        who: "you", tag: [rules.length ? "Traficom" : null, lowered ? "If’s kasko terms" : null, M.riskIncrease ? "Insurance Contracts Act 543/1994" : null].filter(Boolean).join(" · ") || "From the ad",
        real: !!(rules.length || M.riskIncrease) });
    } else if (inspectionLine) {
      asks.push({ q: "“Which inspection was it, and can I see the paper?”",
        why: `Motorcycles have no periodic inspection in Finland, so Traficom has no failure statistics by bike model.${inspectionLine}`,
        whatif: "What if it was off the register as damaged? Ask what happened and what was repaired.", cost: "", who: "you", tag: "Vehicles Act 82/2021 · Traficom", real: true });
      sources.push(...mSrc(M.inspection.source));
    }

    // 3. Who you are buying from changes your rights.
    if (m.sellerType === "dealer") {
      asks.push({ q: "“What do you promise about its condition, in writing?”",
        why: "You’re buying from a business, so consumer law covers you. If a fault shows up within a year, it’s presumed to have been there when you bought it, unless it’s normal wear for the bike’s age and km.",
        whatif: "What if the gearbox fails in month three?", cost: "", who: "The dealer answers for it, unless it’s normal wear", tag: "Consumer Protection Act 38/1978, chapter 5", real: true });
      sources.push("ksl");
    } else {
      asks.push({ q: m.sellerType === "private" ? "“Can I take it to a garage before I buy?”" : "“Are you a dealer or a private seller?”",
        why: m.sellerType === "private" ? "You’re buying from a private person. If a fault shows up next month, it’s mostly your problem: a dealer would have to answer for it for a year, a private seller doesn’t."
          : "It changes your rights. A dealer must answer for faults that show up within a year, unless they’re normal wear. With a private seller, a fault that shows up later is mostly your problem.",
        whatif: "What if the clutch or gearbox fails next month?", cost: "", who: "you", tag: "Sale of Goods Act 355/1987 · Consumer Protection Act, chapter 5", real: true });
      sources.push("kl", "ksl");
    }

    // 4. When there is room: service records, theft, ABS.
    if (asks.length < 3) {
      asks.push({ q: "“Can I see the service records?”",
        why: `${m.flags.serviceBook ? "The ad mentions a service book. " : ""}${m.km ? `The ad says ${grp(m.km)} km. ` : ""}Stamped services and receipts show the bike was looked after.`,
        whatif: "What if the chain, sprockets or tyres are worn out? That’s wear: the owner pays.", cost: "", who: "you",
        tag: I.wear ? "If’s kasko terms: wear isn’t covered" : "From the ad", real: !!I.wear });
      sources.push(...mSrc(I.wear?.source));
    }
    if (asks.length < 3 && I.theft) {
      asks.push({ q: "“Where has it been kept, and does it come with a lock?”",
        why: `Traffic insurance never covers theft. Kasko theft cover does, after your excess${I.theft.lockRequired ? ", and at If only if the bike was locked" : ""}.`,
        whatif: "What if it’s stolen from outside your home?", cost: "", who: I.theft.who, tone: "covered", tag: "If’s motorcycle insurance guide", real: true });
      sources.push(...mSrc(I.theft.source));
    }
    if (asks.length < 3 && absYear && I.ownInjuries && m.abs !== true && (!m.year || m.year < absYear)) {
      asks.push({ q: "“Does it have ABS?”",
        why: `Since ${absYear}, every new road bike over 125 cm³ has needed ABS, and a 125 ABS or combined brakes.${M.abs.effect ? ` ${M.abs.effect.text}` : ""}`,
        whatif: "What if you have to brake hard on a wet road?", cost: "", who: "Your injuries: your bike’s traffic insurance pays", tone: "covered", tag: "EU Regulation 168/2013", real: true });
      sources.push(...mSrc(M.abs.source, M.abs.effect?.source, I.ownInjuries.source));
    }

    // Costs: only the ad's numbers and sourced facts.
    const costs = [];
    if (m.price != null) costs.push({ what: "Asking price", note: m.previousPrice ? `From the ad · down from ${eur(m.previousPrice)}` : "From the ad", eur: m.price, seg: "price" });
    if (m.officeFee) costs.push({ what: "Office fee", note: "The dealer adds it on top · from the ad", eur: m.officeFee, seg: "price" });
    if (M.vehicleTax?.taxed === false) { costs.push({ what: "Vehicle tax", note: M.vehicleTax.note, eur: 0, seg: "run" }); sources.push(...mSrc(M.vehicleTax.source)); }
    costs.push({ what: "Insurance", note: "Traffic insurance is required by law while it’s in traffic use. The price depends on you and the bike", eur: null, seg: "ins" });

    // After you buy: reminders that need the bike's details, for If customers.
    const later = [{ when: "Within 7 days", text: "Register yourself as the new owner. The seller hands over the papers." }];
    if (M.newOwner) { later.push({ when: "Day one", text: M.newOwner.rule }); sources.push(...mSrc(M.newOwner.source)); }
    if (M.outOfUse) {
      later.push({ when: "Autumn", text: M.outOfUse.rule });
      later.push({ when: "Spring", text: `Put it back in traffic use before the first ride. ${M.outOfUse.ridingWhileOut}` });
      sources.push(...mSrc(M.outOfUse.source));
    }
    sources.push("ajl", "lvl");

    // Is there a safer choice? Traficom has no failure statistics for motorcycles, so the sourced pointer is ABS.
    let safer = null;
    if (absYear) {
      safer = { label: "Is there a safer choice?", title: m.abs === true ? "This one has ABS, says the ad" : "A bike with ABS",
        points: [`Since ${absYear}, every new road bike over 125 cm³ has needed ABS, and a 125 ABS or combined brakes. Enduro and trial bikes are exempt.`,
          M.abs.effect ? M.abs.effect.text : null].filter(Boolean),
        note: m.year && m.year < absYear ? `This one is from ${m.year}, before the rule: ask whether it has ABS.` : m.abs === true ? "Check it in the registration papers or on the bike." : "Ask, and check it in the registration papers or on the bike.",
        tag: ["EU Regulation 168/2013", M.abs.effect?.short].filter(Boolean).join(" · ") };
      sources.push(...mSrc(M.abs.source, M.abs.effect?.source));
    }

    const specs = [m.year, m.km ? `${grp(m.km)} km` : null, m.engineCc ? `${m.engineCc} cm³` : null, m.powerKw ? `${m.powerKw} kW` : null,
      m.sellerType === "dealer" ? "dealer" : m.sellerType === "private" ? "private seller" : null, m.city ? esc(m.city) : null].filter(Boolean).join(" · ");
    return {
      kind: "moto", stamp: "Used motorcycle", name, specs: licence ? `${specs}<br>${licence}` : specs, price: m.price, priceLabel: "Asking price",
      steps: ["Reading the ad", m.engineCc ? `Checking the licence class for ${m.engineCc} cm³` : "Checking the licence class",
        m.modifications.length ? "Checking what the changes mean for insurance" : "Checking the seller’s duties", "Checking who pays if something goes wrong"],
      asks: asks.slice(0, 3), period: "Over two years", costs,
      costNote: "Only numbers from the ad or with a source. Insurance depends on you, so get your own price below.",
      safer, cover: COVER.moto,
      later: { label: "After you buy", notif: M.outOfUse ? { meta: "Sun 18:30", title: "Storing the bike for winter?", text: M.outOfUse.rule } : null, list: later },
      insure: { label: "Ride it home", title: "Get reminders for this motorcycle.", text: "They come with If insurance. Traffic insurance is required by law from the moment the bike is yours.",
        details: [["Bike", m.year ? `${name}, ${m.year}` : name], m.engineCc ? ["Engine", `${m.engineCc} cm³`] : null, m.km ? ["Km", grp(m.km)] : null, m.city ? ["Area", esc(m.city)] : null].filter(Boolean) },
      readout: [["Bike", name], ["Year", shown(m.year)], ["Km", shown(m.km, grp)], ["Engine", shown(m.engineCc, (v) => `${v} cm³`)], ["Power", shown(m.powerKw, (v) => `${v} kW`)],
        ["Licence class", shown(m.licence)], ["Price", shown(m.price, eur)], ["Seller", shown(m.sellerType)], ["ABS", m.abs === true ? "yes, says the ad" : m.abs === false ? "no, says the ad" : nf],
        ["Changes", m.modifications.length ? esc(and(m.modifications)) : nf], ["Area", shown(m.city, esc)]],
      sources: uniq(sources),
    };
  }

  /* ---------- entry points ---------- */
  function read(raw) {
    const P = prep(raw);
    const car = readCar(P);
    if (unsupported(P, car)) return { kind: "unsupported" };
    const kind = kindOf(P, car);
    if (kind === "car") return { kind, ...car };
    if (kind === "moto") return { kind, ...readMoto(P) };
    if (kind === "home") return { kind, ...readHome(P) };
    if (kind === "rent") return { kind, ...readRent(P) };
    if (kind === "house") return readHouse(P);
    return { kind: null };
  }

  function analyse(raw) {
    const P = prep(raw);
    if (P.text.length < 30) return { message: "Paste the whole ad: everything from the title down to the seller’s details." };
    const link = adLink(raw);
    if (link) {
      if (link.site === "Nettivene") return { message: `That’s a link to Nettivene. ${READS} Boats come in the full version.` };
      return { link, message: `That’s a link${link.site ? ` to ${link.site}` : ""}. This page doesn’t open other websites, so the link went nowhere. Open the ad, select all its text, copy it and paste it here.` };
    }
    const car = readCar(P);
    const odd = unsupported(P, car);
    if (odd) {
      const [what, plural] = odd.split(", and ");
      return { message: `This looks like ${what}. ${READS} ${plural[0].toUpperCase() + plural.slice(1)} come in the full version.` };
    }
    const kind = kindOf(P, car);
    if (kind === "car") return carResult(car);
    if (kind === "moto") return motoResult(readMoto(P));
    if (kind === "home") return homeResult(readHome(P));
    if (kind === "rent") return rentResult(readRent(P));
    if (kind === "house") return houseResult(readHouse(P));
    return { message:`We couldn’t tell what this ad is for. ${READS} Paste the ad’s text, not the link.` };
  }

  /* ---------- the AI reader, for ads the rules can't read ---------- */
  // Contract with deploy/what-if: POST /api/read {text} → {ok, model, kind, fields, draft}. The rules stay first;
  // the AI is asked only when they can't read the ad. Any failure, or no answer within 12 s, means "no AI".
  const AI_URL = "/api/read";
  const AI_MAX = 12000;
  const AI_TIMEOUT = 12000;

  // Out before an ad goes anywhere: e-mail addresses, phone numbers, and the seller's name where a site's layout shows it.
  const EMAIL = /[\p{L}\d._%+-]+@[\p{L}\d-]+(?:\.[\p{L}\d-]+)*\.\p{L}{2,}/gu;
  const PHONE = /(?:\+|00|\()?\d[\d \t()-]{5,18}\d/g;
  const PERSON = /^[\p{Lu}][\p{Ll}'’-]+(?: [\p{Lu}][\p{Ll}'’-]+){1,3}$/u;
  function stripContacts(raw) {
    let t = String(raw ?? "").replace(EMAIL, "[email removed]");
    t = t.replace(PHONE, (m, at, s) => {
      const digits = m.replace(/\D/g, "");
      const phoneLike = /^(?:\+|00|\(?0)/.test(m);
      const after = s.slice(at + m.length, at + m.length + 8).toLowerCase();
      if (!phoneLike || digits.length < 7 || digits.length > 13) return m;
      if (/^\s?(?:€|e(?!\p{L})|eur|km|kg|m²|m2|cm|kw|hv|hp|%)/u.test(after)) return m;
      return "[phone removed]";
    });
    const lines = t.split(/\r?\n/);
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (/^(?:jäsenenä \d+ vuotta|member for \d+ years?|ota yhteyttä|contact)$/i.test(line) && PERSON.test((lines[i + 1] ?? "").trim())) lines[i + 1] = "[name removed]";
      if (/^(?:näytä numero|show number|lähetä viesti(?: ilmoittajalle)?|send a message)$/i.test(line) && i > 0 && PERSON.test(lines[i - 1].trim())) lines[i - 1] = "[name removed]";

  }

  // Ask the AI only when the rules can't give a full result: a car or motorcycle needs make and model,
  // a flat for sale its building year and a price, a rental its rent. Links and scraps never go out.
  function plan(raw) {
    const P = prep(raw);
    if (P.text.length < 30 || (P.lines.length <= 3 && /https?:\/\/|www\./i.test(P.text))) return { callAI: false, read: null };
    const r = read(raw);
    const enough = r.kind === "car" || r.kind === "moto" ? !!(r.make && r.model)
      : r.kind === "home" ? !!(r.buildingYear && (r.debtFreePrice || r.sellingPrice))
      : r.kind === "rent" ? !!r.rent
      : r.kind === "house" ? !!(r.price || r.buildingYear) : false;
    return { callAI: !enough, read: r };
  }

  // The AI's fields, checked one by one: wrong types, out-of-range numbers and unknown values become null.
  const fNum = (v, lo, hi) => (typeof v === "number" && Number.isFinite(v) && v >= lo && v <= hi ? v : null);
  const fStr = (v, max = 60) => (typeof v === "string" && v.trim() && v.trim().length <= max ? v.trim() : null);
  const fOne = (v, list) => (list.includes(v) ? v : null);
  const fBool = (v) => (typeof v === "boolean" ? v : null);
  const fDate = (v) => (typeof v === "string" && /^(?:19|20)\d\d-(?:0[1-9]|1[0-2])(?:-\d\d)?$/.test(v) ? v : null);
  const fPost = (v) => (typeof v === "string" && /^\d{5}$/.test(v.trim()) ? v.trim() : null);
  const fDay = (v) => (typeof v === "string" && /^(?:20|21)\d\d(?:-(?:0[1-9]|1[0-2])(?:-\d\d)?)?$/.test(v) ? v : null);
  const pick = (f, path) => (path in f ? f[path] : path.split(".").reduce((o, k) => (o == null ? o : o[k]), f));
  const ckeys = (f, o) => Object.keys(o).filter((k) => o[k] != null && pick(f, k) != null);
  function aiFields(kind, f) {
    const common = { city: fStr(pick(f, "city"), 40), district: fStr(pick(f, "district"), 40) };
    if (kind === "car") return { make: fStr(pick(f, "make"), 30), model: fStr(pick(f, "model"), 40), year: fNum(pick(f, "year"), 1950, YEAR + 1),
      km: fNum(pick(f, "km"), 0, 2e6), price: fNum(pick(f, "price"), 100, 1e7), previousPrice: fNum(pick(f, "previousPrice"), 100, 1e7), officeFee: fNum(pick(f, "officeFee"), 1, 5000),
      fuel: fOne(pick(f, "fuel"), ["petrol", "diesel", "electric", "gas", "hybrid-petrol", "hybrid-diesel", "plug-in hybrid"]), gearbox: fOne(pick(f, "gearbox"), ["manual", "automatic"]),
      sellerType: fOne(pick(f, "sellerType"), ["private", "dealer"]), city: common.city, lastInspection: fDate(pick(f, "lastInspection")),
      flags: Object.fromEntries(["timingBeltReplaced", "timingChain", "serviceBook", "rustMentioned", "hybridBatteryChecked", "imported"].map((k) => [k, fBool(pick(f, `flags.${k}`)) ?? undefined]).filter(([, v]) => v !== undefined)) };
    if (kind === "moto") return { make: fStr(pick(f, "make"), 30), model: fStr(pick(f, "model"), 40), year: fNum(pick(f, "year"), 1950, YEAR + 1),
      km: fNum(pick(f, "km"), 0, 1e6), price: fNum(pick(f, "price"), 50, 1e6), officeFee: fNum(pick(f, "officeFee"), 1, 5000), engineCc: fNum(pick(f, "engineCc"), 30, 3000),
      powerKw: fNum(pick(f, "powerKw"), 1, 300), sellerType: fOne(pick(f, "sellerType"), ["private", "dealer"]), city: common.city, lastInspection: fDate(pick(f, "lastInspection")),
      abs: fBool(pick(f, "abs")), modifications: Array.isArray(pick(f, "modifications")) ? pick(f, "modifications").filter((x) => MODS.some(([w]) => w === x)) : null };
    if (kind === "home") {
      const pr = pick(f, "pipeRenovation") ?? {};
      const status = fOne(pick(f, "pipeRenovation.status") ?? pr.status, ["done", "planned", "mentioned", "not-mentioned"]);
      const years = (pick(f, "pipeRenovation.years") ?? pr.years ?? []).filter?.((y) => fNum(y, 1950, 2050) != null) ?? [];
      return { buildingYear: fNum(pick(f, "buildingYear"), 1800, YEAR + 2), livingAreaM2: fNum(pick(f, "livingAreaM2"), 8, 1000),
        debtFreePrice: fNum(pick(f, "debtFreePrice"), 1000, 1e8), sellingPrice: fNum(pick(f, "sellingPrice"), 1000, 1e8), debtShare: fNum(pick(f, "debtShare"), 0, 1e8),
        maintenanceCharge: fNum(pick(f, "maintenanceCharge"), 0, 10000), financingCharge: fNum(pick(f, "financingCharge"), 0, 10000), plotRentCharge: fNum(pick(f, "plotRentCharge"), 0, 10000),
        rooms: fNum(pick(f, "rooms"), 1, 20), ...common, pipeRenovation: status ? { status, years } : null,
        postcode: fPost(pick(f, "postcode")), energyClass: fOne(pick(f, "energyClass"), ["A", "B", "C", "D", "E", "F", "G"]),
        energyClassScale: fOne(pick(f, "energyClassScale"), [2007, 2013, 2018]), plotLeaseEnds: fDay(pick(f, "plotLeaseEnds")),
        plotLeased: pick(f, "plotOwnership") === "leased" ? true : null };
    }
    if (kind === "house") return { buildingYear: fNum(pick(f, "buildingYear"), 1800, YEAR + 2), livingAreaM2: fNum(pick(f, "livingAreaM2"), 8, 1000),
      price: fNum(pick(f, "price") ?? pick(f, "sellingPrice") ?? pick(f, "debtFreePrice"), 1000, 1e8), rooms: fNum(pick(f, "rooms"), 1, 20), city: common.city };
    if (kind === "rent") return { rent: fNum(pick(f, "rent"), 50, 20000), deposit: fNum(pick(f, "deposit"), 0, 100000), depositMonths: fNum(pick(f, "depositMonths"), 0, 12),
      buildingYear: fNum(pick(f, "buildingYear"), 1800, YEAR + 2), livingAreaM2: fNum(pick(f, "livingAreaM2"), 8, 1000), homeInsuranceRequired: fBool(pick(f, "homeInsuranceRequired")),
      rooms: fNum(pick(f, "rooms"), 1, 20), postcode: fPost(pick(f, "postcode")), ...common };
    return null;
  }

  // Wherever the rules read a field, the rules' value wins; the AI fills the gaps.
  function fill(rules, ai) {
    const out = { ...rules };
    const used = [];
    for (const [k, v] of Object.entries(ai)) {
      if (v == null || k === "flags") continue;
      if (out[k] == null || (Array.isArray(out[k]) && !out[k].length && Array.isArray(v) && v.length)) { out[k] = v; used.push(k); }
    }
    if (ai.flags) for (const [k, v] of Object.entries(ai.flags)) if (out.flags?.[k] === undefined) { out.flags = { ...(out.flags ?? {}), [k]: v }; used.push(k); }
    return { out, used };
  }
  const WORDS = { make: "make", model: "model", year: "year", km: "km", price: "price", previousPrice: "earlier price", officeFee: "office fee", fuel: "fuel", gearbox: "gearbox",
    sellerType: "seller", city: "place", district: "district", lastInspection: "last inspection", engineCc: "engine size", powerKw: "power", abs: "ABS", modifications: "changes",
    buildingYear: "building year", livingAreaM2: "size", debtFreePrice: "debt-free price", sellingPrice: "selling price", debtShare: "loan share", maintenanceCharge: "maintenance charge",
    financingCharge: "capital charge", plotRentCharge: "plot rent", rooms: "rooms", pipeRenovation: "pipe renovation", rent: "rent", deposit: "deposit", depositMonths: "deposit",
    homeInsuranceRequired: "home insurance", plotAreaM2: "plot area", timingBeltReplaced: "timing belt", timingChain: "timing chain", serviceBook: "service book", rustMentioned: "rust",
    hybridBatteryChecked: "hybrid battery", imported: "import", postcode: "postcode", energyClass: "energy class", energyClassScale: "energy class",
    plotLeaseEnds: "plot lease", plotLeased: "plot lease" };

  // A full result from the AI's fields, built by the same rules as a rules-read ad.
  function fromAI(kind, fields, raw, model) {
    const P = prep(raw ?? "");
    // The AI reader has no kind for houses: a house it reads as a flat ("home") is read as a house when the rules say so.
    if (kind === "home" && P.text && kindOf(P, readCar(P)) === "house") kind = "house";
    const ai = aiFields(kind, fields && typeof fields === "object" ? fields : {});
    if (!ai) return null;
    let result, used;
    if (kind === "car") {
      const base = { make: null, model: null, modelKey: null, flags: {}, ...(P.text ? readCar(P) : {}) };
      const filled = fill(base, ai);
      used = filled.used;
      const c = filled.out;
      if (!c.modelKey && c.make) {
        const mm = makeModel(prep(`${c.make} ${c.model ?? ""}`));
        if (mm) { c.make = mm.make; if (mm.key) { c.modelKey = mm.key; c.model = c.model ?? mm.text; } }
      }
      if (!c.make || !c.model) return null;
      result = carResult(c);
    } else if (kind === "moto") {
      const base = { make: null, model: null, modifications: [], flags: {}, ...(P.text ? readMoto(P) : {}) };
      const { out, used: u } = fill(base, ai);
      used = u;
      out.licence = licenceOf(out.engineCc, out.powerKw, out.powerHp);
      out.modifications = out.modifications ?? [];
      out.modified = out.modifications.length ? true : null;
      if (!out.make) return null;
      result = motoResult(out);
    } else if (kind === "home") {
      const base = { renovationsPlanned: [], renovationsDone: [], pipeRenovation: null, ...(P.text ? readHome(P) : {}) };
      if (base.pipeRenovation?.status === "not-mentioned" && ai.pipeRenovation) base.pipeRenovation = null;
      const { out, used: u } = fill(base, ai);
      used = u;
      out.pipeRenovation = out.pipeRenovation ?? { status: "not-mentioned", years: [] };
      if (out.debtFreePrice == null && out.sellingPrice != null) out.debtFreePrice = out.sellingPrice + (out.debtShare ?? 0);
      if (!out.buildingYear && !out.debtFreePrice) return null;
      result = homeResult(out);
    } else if (kind === "house") {
      const base = { kind: "house", heating: [], foundation: [], moisture: [], ...(P.text ? readHouse(P) : {}) };
      const { out, used: u } = fill(base, ai);
      used = u;
      if (!out.buildingYear && !out.price) return null;
      result = houseResult(out);
    } else if (kind === "rent") {
      const base = { pipeRenovation: { status: "not-mentioned", years: [] }, noDeposit: false, fixedTerm: false, waterFee: null, ...(P.text ? readRent(P) : {}) };
      const { out, used: u } = fill(base, ai);
      used = u;
      if (out.deposit == null && out.depositMonths && out.rent) out.deposit = out.depositMonths * out.rent;
      if (!out.rent) return null;
      result = rentResult(out);
    }
    if (!result) return null;
    const words = uniq(used.map((k) => WORDS[k]).filter(Boolean));
    result.ai = { model: esc(String(model ?? "AI model").slice(0, 80)), fields: words };
    if (words.length) result.aiNote = `An AI model read these details from the ad: ${esc(and(words))}. Check them against the ad.`;

  }

  // A draft for anything we have no facts for: written by the AI, shown as such, with no figures.
  const WHO_AI = { you: ["pay", "Not covered · you pay"], insurance: ["covered", "Covered by insurance · after your excess"], check: ["other", "Depends on the policy · check before you sign"] };
  const noFigures = (s) => !/€|%|(?<!\p{L})euro/iu.test(s);
  function draftResult(draft, model) {
    if (!draft || typeof draft !== "object") return null;
    const item = fStr(draft.item, 80);
    const asks = (Array.isArray(draft.asks) ? draft.asks : []).map((a) => fStr(a, 220)).filter((a) => a && noFigures(a)).slice(0, 3);
    const whatIfs = (Array.isArray(draft.whatIfs) ? draft.whatIfs : []).filter((w) => w && fStr(w.text, 220) && noFigures(w.text) && WHO_AI[w.whoPays]).slice(0, 4)
      .map((w) => ({ text: esc(w.text.trim()), who: WHO_AI[w.whoPays][1], tone: WHO_AI[w.whoPays][0] }));
    if (!item || !asks.length || !whatIfs.length) return null;
    // Asks are things to say to the seller, in quotes, unless they already quote the ad ("The ad says “…”").
    const quote = (q) => (/[“”"]/.test(q) ? q : `“${q}”`);
    return {
      kind: "draft", item: esc(item), model: esc(String(model ?? "AI model").slice(0, 80)),
      asks: asks.map((q) => esc(quote(q))), whatIfs,
      disclaimer: "First draft. An AI model read the ad and wrote the questions that quote it. The rest are general questions and what-ifs for this kind of item. None of it is checked like our car, motorcycle and flat results.",
      insure: { label: "Before you sign", title: "Ask If about cover for it.", text: "The item from the ad is already filled in, so you don’t have to type it again.", details: [["Item", esc(item)]] },
    };
  }

  // One POST to /api/read with a time limit. Any failure or a late answer is null: the caller then does what it did before.
  async function ask(body, fetchImpl, url, timeoutMs) {
    const ctrl = typeof AbortController === "function" ? new AbortController() : null;
    let timer;
    const timeout = new Promise((_, no) => { timer = setTimeout(() => { ctrl?.abort(); no(new Error("timeout")); }, timeoutMs); });
    const work = (async () => {
      const res = await fetchImpl(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), signal: ctrl?.signal });
      return res && res.ok ? res.json() : null;
    })();
    work.catch(() => {}); // a late failure after the time limit is not an error
    try {
      const answer = await Promise.race([work, timeout]);
      return answer && answer.ok === true ? answer : null;
    } catch {
      return null;
    } finally {
      clearTimeout(timer);
    }
  }

  // Rules first; the AI only when needed; today's behaviour whenever the AI can't help.
  async function analyseWithAI(raw, { fetch: fetchImpl, url = AI_URL, timeoutMs = AI_TIMEOUT } = {}) {
    const p = plan(raw);
    if (!p.callAI || typeof fetchImpl !== "function") return analyse(raw);
    const answer = await ask({ text: stripContacts(raw).slice(0, AI_MAX) }, fetchImpl, url, timeoutMs);
    if (!answer) return analyse(raw);
    // A house the rules recognised stays a house: the AI may fill its year, size, price or place, never make it a draft.
    if (p.read?.kind === "house") return (answer.kind === "home" || answer.kind === "house" ? fromAI("house", answer.fields, raw, answer.model) : null) ?? analyse(raw);
    if (["car", "moto", "home", "rent"].includes(answer.kind)) return fromAI(answer.kind, answer.fields, raw, answer.model) ?? analyse(raw);
    if (answer.kind === "other") return draftResult(answer.draft, answer.model) ?? analyse(raw);
    return analyse(raw);
  }

  /* ---------- screenshots ---------- */
  // Contract: POST /api/read {image: "data:image/jpeg;base64,…"} (PNG, JPEG or WebP, at most 8,000,000 characters),
  // never text and image together. The answer is as for text, plus "transcript": the text read off the picture.
  // The transcript goes through the rules like pasted text, so wherever the rules read a field, their value wins.
  // A long ad takes several screenshots: up to SHOTS_MAX go one by one (each is one request, so each counts as one ad
  // on the reader), their transcripts are joined in order, and the rules read the whole ad from that. The AI's fields
  // from every screenshot fill what the rules miss, the first screenshot that names a field winning.
  const IMAGE_MAX = 8000000;
  const IMAGE_TIMEOUT = 30000;
  const SHOTS_MAX = 4;
  const SHOT_FAIL = "We couldn’t read an ad from that screenshot. Try one that shows the whole ad, or paste the ad’s text.";
  const SHOT_NOTE = "Read from your screenshot by an AI model on our team’s own computer.";
  const READ_KINDS = ["car", "moto", "home", "rent"];
  const isImage = (image) => typeof image === "string" && image.length <= IMAGE_MAX && /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/]+=*$/.test(image);
  const shotNote = (read, sent) => (sent === 1 ? SHOT_NOTE
    : read === sent ? `Read from your ${sent} screenshots by an AI model on our team’s own computer.`
    : `Read from ${read} of your ${sent} screenshots by an AI model on our team’s own computer; the other${sent - read > 1 ? "s" : ""} couldn’t be read.`);
  // The most common kind among the answers; on a tie, the first screenshot's.
  const shotKind = (answers) => {
    const kinds = answers.map((a) => a.kind).filter((k) => [...READ_KINDS, "other"].includes(k));
    return kinds.reduce((best, k) => (kinds.filter((x) => x === k).length > kinds.filter((x) => x === best).length ? k : best), kinds[0]);
  };
  // First non-empty value per field across the screenshots; flags and other small objects are merged the same way.
  const empty = (x) => x == null || (Array.isArray(x) && !x.length);
  const mergeFields = (list) => {
    const out = {};
    for (const fields of list) {
      if (!fields || typeof fields !== "object") continue;
      for (const [k, v] of Object.entries(fields)) {
        if (v && typeof v === "object" && !Array.isArray(v)) out[k] = { ...v, ...Object.fromEntries(Object.entries(out[k] ?? {}).filter(([, x]) => !empty(x))) };

  };

    if (typeof fetchImpl !== "function" || !list.length || !list.every(isImage)) return fail;
    const answers = (await Promise.all(list.map((image) => ask({ image }, fetchImpl, url, timeoutMs)))).filter(Boolean);
    if (!answers.length) return fail;
    const texts = answers.map((a) => (typeof a.transcript === "string" ? a.transcript.trim() : "")).filter(Boolean);
    const transcript = texts.length ? texts.join("\n\n").slice(0, 20000) : null;
    // A transcript the rules read as a house is a house, whatever kind the AI gave it.
    const kind = transcript && read(transcript).kind === "house" ? "house" : shotKind(answers);
    const same = kind === "house" ? answers.filter((a) => a.kind === "home") : answers.filter((a) => a.kind === kind);
    const r = kind === "house" ? fromAI("house", mergeFields(same.map((a) => a.fields)), transcript, answers[0].model)
      : READ_KINDS.includes(kind) ? fromAI(kind, mergeFields(same.map((a) => a.fields)), transcript ?? "", same[0].model)
      : kind === "other" ? draftResult(same.find((a) => a.draft)?.draft, same[0].model) : null;
    if (!r) return fail;
    return { ...r, fromScreenshot: true, shotNote: shotNote(answers.length, list.length), transcript };
  }

  // The check before screenshots leave the phone: confirm(images) shows them and answers false (send nothing), true
  // (send them all) or the list the person kept after removing some.
  async function sendScreenshots(images, confirm, opts = {}) {
    const list = (Array.isArray(images) ? images : [images]).slice(0, SHOTS_MAX);
    const chosen = await confirm(list);
    const send = Array.isArray(chosen) ? chosen.slice(0, SHOTS_MAX) : chosen ? list : [];
    if (!send.length) return { cancelled: true };
    return analyseImages(send, opts);
  }
  const sendScreenshot = (image, confirm, opts) => sendScreenshots([image], (list) => confirm(list[0]), opts);

  return { read, analyse, plan, areaRisks, adLink, bookmarklet, adFromHash, LINK_TEXT_MAX, stripContacts, fromAI, draftResult, analyseWithAI, analyseImage, analyseImages, sendScreenshot, sendScreenshots, SHOTS_MAX, SHOT_FAIL, SRC, COVER, esc, vehicleTax };
}

      takeShots(e.dataTransfer.files);
    });
    // A screenshot pasted into the box (Win+Shift+S, then Ctrl+V) is read like an upload; text pastes as usual.
    box.addEventListener("paste", (e) => {
      const pics = [...(e.clipboardData?.files ?? [])].filter((f) => /^image\//.test(f.type));
      if (!pics.length) return;
      e.preventDefault();
      takeShots(pics);
    });
  }
  screen.querySelectorAll("[data-example]").forEach((b) =>
    b.addEventListener("click", () => {
      state.text = CASES[b.dataset.example].ad;
      home();

    if (state.busy) return;
    state.text = box.value;

    if (r.kind === "draft") return draftView(r);
    check(r, "ad:" + squash(state.text).length + ":" + r.name);
  });

// Decode on the phone and send only a resized JPEG, never the original file or its metadata (like Aapo's PWA, D-025):
// at most 1600 px on the longest side, quality 0.85.
async function screenshotData(file) {
  const data = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
  // onload, not image.decode(): decode() can wait forever while the page isn't being drawn (an app in the
  // background, a tab without focus).
  const image = new Image();
  await new Promise((resolve, reject) => {
    image.onload = resolve;
    image.onerror = () => reject(new Error("the picture could not be opened"));
    image.src = data;
  });
  const scale = Math.min(1, 1600 / Math.max(image.naturalWidth, image.naturalHeight));
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
  const context = canvas.getContext("2d");
  if (!context) throw new Error("canvas unavailable");
  context.fillStyle = "#ffffff";
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.drawImage(image, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.85);
}
