        <span class="fine">Or try an example</span>
        <div class="examples" role="group" aria-label="Example ads">
          ${ORDER.map((id) => {
            const c = CASES[id].chip;
            return `<button type="button" class="chip" data-example="${id}" aria-pressed="${picked === id}"><span class="cat">${c.cat}</span><span>${c.label}</span><span class="eur">${c.eur}</span></button>`;
          }).join("")}
        </div>
      </div>
      ${message ? `<p class="notice" role="alert">${message}</p>` : ""}
      <button class="btn" type="submit" id="checkBtn">Check this ad</button>
      <p class="fine">Reads used cars and motorcycles (Nettiauto, Autotalli, Nettimoto), flats for sale (Etuovi, Oikotie) and flats to rent (Vuokraovi, Oikotie). Paste the ad’s text, not the link. ${AI_ON ? "For other ads, an AI model writes a first draft." : "Other ads come in the full version."} Figures with a source are real; the rest are labelled estimates.</p>
      <p class="fine">${AI_ON ? "If our rules can’t read an ad, its text, without phone numbers or email addresses, goes through our server at Cloudflare to an AI model on our team’s own computer. Nothing is stored, nothing about you is sent, and nothing goes to If." : "Nothing you paste leaves your phone."}</p>
    </form>
  `);
  const box = document.getElementById("ad");
  box.value = state.text;
  if (message) screen.querySelector(".notice").scrollIntoView({ block: "center" });
  box.addEventListener("input", () => {
    state.text = box.value;
    const now = curatedFor(state.text);
    screen.querySelectorAll("[data-example]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.example === now)));
  });
  document.getElementById("clearBtn").addEventListener("click", () => { state.text = ""; box.value = ""; box.dispatchEvent(new Event("input")); box.focus(); });
  const shot = document.getElementById("shot");
  if (shot) {
    const form = document.getElementById("checkForm");
    const note = document.getElementById("dropNote");
    // Chosen, dropped or pasted: the same check, then the same reading.
    const takeShots = async (files) => {
      const pics = [...files].filter((f) => /^image\//.test(f.type));
      if (!pics.length || state.busy) return;
      let images;
      try { images = await Promise.all(pics.slice(0, engine.SHOTS_MAX).map(screenshotData)); } catch { return home("We couldn’t open that picture. Choose another screenshot, or paste the ad’s text."); }
      state.busy = true;
      let r;
      try { r = await engine.sendScreenshots(images, (list) => confirmShots(list, pics.length - list.length), { fetch: (url, opts) => window.fetch(url, opts) }); } finally { state.busy = false; }
      if (r.cancelled) return home();
      if (r.message) return home(r.message);
      if (r.transcript) state.text = r.transcript; // the text read off the pictures, in the box to see and correct
      if (r.kind === "draft") return draftView(r);
      check(r, `shot:${Date.now()}`);
    };
    document.getElementById("shotBtn").addEventListener("click", () => shot.click());
    shot.addEventListener("change", () => {
      const files = [...(shot.files ?? [])];
      shot.value = "";
      takeShots(files);
    });
    // Drag and drop: files only, so dragging text inside the box still works as usual.
    const hasFiles = (e) => [...(e.dataTransfer?.types ?? [])].includes("Files");
    const dropping = (on) => { form.classList.toggle("dropping", on); note.hidden = !on; };
    form.addEventListener("dragenter", (e) => { if (hasFiles(e)) { e.preventDefault(); dropping(true); } });
    form.addEventListener("dragover", (e) => { if (hasFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; dropping(true); } });
    form.addEventListener("dragleave", (e) => { if (!form.contains(e.relatedTarget)) dropping(false); });
    form.addEventListener("drop", (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      dropping(false);
      takeShots(e.dataTransfer.files);
    });
    // A screenshot pasted into the box (Win+Shift+S, then Ctrl+V) is read like an upload; text pastes as usual.
    box.addEventListener("paste", (e) => {
      const pics = [...(e.clipboardData?.files ?? [])].filter((f) => /^image\//.test(f.type));
      if (!pics.length) return;
      e.preventDefault();
      takeShots(pics);
    });
  }
  screen.querySelectorAll("[data-example]").forEach((b) =>
    b.addEventListener("click", () => {
      state.text = CASES[b.dataset.example].ad;
      home();
    }),
  );
  document.getElementById("checkForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (state.busy) return;
    state.text = box.value;
    const id = curatedFor(state.text);
    if (id) return check(CASES[id], id);
    let r;
    if (AI_ON && engine.plan(state.text).callAI) {
      // The rules can't read this ad: our server's AI reader gets its text. Any failure falls back to the rules.
      state.busy = true;
      reading();
      try { r = await engine.analyseWithAI(state.text, { fetch: (url, opts) => window.fetch(url, opts) }); } finally { state.busy = false; }
    } else {
      r = engine.analyse(state.text);
    }
    if (r.message) return home(r.message);
    if (r.kind === "draft") return draftView(r);
    check(r, "ad:" + squash(state.text).length + ":" + r.name);
  });
}

// Decode on the phone and send only a resized JPEG, never the original file or its metadata (like Aapo's PWA, D-025):
// at most 1600 px on the longest side, quality 0.85.
async function screenshotData(file) {
  const data = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
  // onload, not image.decode(): decode() can wait forever while the page isn't being drawn (an app in the
  // background, a tab without focus).
  const image = new Image();
  await new Promise((resolve, reject) => {
    image.onload = resolve;
    image.onerror = () => reject(new Error("the picture could not be opened"));
    image.src = data;
  });
  const scale = Math.min(1, 1600 / Math.max(image.naturalWidth, image.naturalHeight));
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
  const context = canvas.getContext("2d");
  if (!context) throw new Error("canvas unavailable");
  context.fillStyle = "#ffffff";
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.drawImage(image, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.85);
}

// Consent copy: a legal-design choice (AGENTS.md). Vaishnav confirmed the one-screenshot wording on 2026-10-17;

const SHOT_CONSENT = {
  title: (n) => (n === 1 ? "Send this screenshot?" : `Send these ${n} screenshots?`),

    ? "It goes through our server at Cloudflare to an AI model on our team’s own computer, which reads the ad from it. Check that it shows only the ad, not your name, messages or notifications. Nothing is stored, and nothing goes to If."
    : "They go through our server at Cloudflare to an AI model on our team’s own computer, which reads the ad from them. Check that they show only the ad, not your name, messages or notifications. Nothing is stored, and nothing goes to If."),
  send: "Send",
  cancel: "Cancel",
};

// The check before screenshots leave the phone: the resized pictures and the wording. Remove takes one out; Cancel,
// or removing the last one, sends nothing. Resolves with the pictures to send, or false.
function confirmShots(images, extra = 0) {
  return new Promise((done) => {
    const list = [...images];
    const draw = () => {
      const n = list.length;
      show(`
        <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="shotTitle" aria-describedby="shotText">
          <h2 id="shotTitle" tabindex="-1">${SHOT_CONSENT.title(n)}</h2>

            ? `<img class="shot" src="${list[0]}" alt="The screenshot you chose, made smaller on this phone">`
            : `<div class="shots">${list.map((src, i) => `<figure><img class="shot" src="${src}" alt="Screenshot ${i + 1} of ${n}, made smaller on this phone"><button type="button" class="textbtn" data-remove="${i}" aria-label="Remove screenshot ${i + 1}">Remove</button></figure>`).join("")}</div>`}
          ${extra > 0 ? `<p class="fine">Only the first ${engine.SHOTS_MAX} screenshots are read.</p>` : ""}
          <p id="shotText">${SHOT_CONSENT.text(n)}</p>
          <div class="shotactions">
            <button class="btn" type="button" id="shotSend">${SHOT_CONSENT.send}</button>
            <button class="btn ghost" type="button" id="shotCancel">${SHOT_CONSENT.cancel}</button>
          </div>
        </section>
      `);
      document.getElementById("shotTitle").focus();
      document.getElementById("shotSend").addEventListener("click", () => { readingShot(list.length); done(list); });
      document.getElementById("shotCancel").addEventListener("click", () => done(false));
      screen.querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", () => {
        list.splice(Number(b.dataset.remove), 1);
        if (!list.length) return done(false);
        draw();
      }));
    };
    draw();
  });
}

function check(c, key) {

  const items = [...document.querySelectorAll("#steps li")];
  if (reduce) return result(c, key);
  let i = 0;
  const tick = () => {

    items[i].className = "on";
    i++;
    setTimeout(tick, 420);
  };
  tick();
}

  const w = (n) => ((n / scaleMax) * 100).toFixed(2);
  return `<div class="stackbar" role="img" aria-label="${label}: about ${eur(sum(rows))}">
    ${["price", "fix", "run", "ins"].map((s) => `<span class="seg-${s}" style="width:${w(segs[s])}%"></span>`).join("")}
  </div>`;
}

      <p class="specs">${c.specs}</p>
      ${shotHtml(c)}
      <div class="price"><span class="kicker">${c.priceLabel}</span>${c.price != null ? `<span class="amount">${eur(c.price)}</span>` : `<span class="amount none">Not in the ad</span>`}</div>
      ${c.readout ? `<details class="read"><summary>What we read from the ad</summary><dl class="kv">${c.readout.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></details>` : ""}
    </section>
    <section class="sheet">
      <p class="eyebrow">Before you sign</p>
      <h2>Ask these ${c.asks.length} things</h2>
      <ol class="asks">${asksHtml(c)}</ol>
    </section>
    ${costHtml(c)}
    ${compareHtml(c)}
    ${saferHtml(c)}
    ${replyHtml(c)}
    ${coverHtml(c)}
    ${laterHtml(c)}
    ${insureHtml(c)}
    ${sourcesHtml(c)}
  `, still);
  wire();
}

function reveal(sheetId) {
  result(state.current, state.key, true);
  const el = document.getElementById(sheetId);
  if (el) el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
}

function wire() {
  document.getElementById("backBtn").addEventListener("click", () => home());
  document.getElementById("editShot")?.addEventListener("click", () => home());
  const cmp = document.getElementById("compareBtn");
  if (cmp) cmp.addEventListener("click", () => { state.compare = true; reveal("compareSheet"); });
  const rb = document.getElementById("replyBtn");
  if (rb) rb.addEventListener("click", () => { state.replied = true; reveal("replySheet"); });
  const cb = document.getElementById("copyBtn");
  if (cb) cb.addEventListener("click", () => {
    const box = document.getElementById("yourMsg");
    const note = document.getElementById("copyNote");
    const fallback = () => { box.focus(); box.select(); note.textContent = "Selected. Press copy on your keyboard."; };
    try {
      navigator.clipboard.writeText(box.value).then(() => { note.textContent = "Copied"; }, fallback);
    } catch { fallback(); }
  });
  screen.querySelectorAll("[data-quote]").forEach((b) => b.addEventListener("click", () => {
    document.getElementById("quoteNote").textContent = "In the full version this opens If’s quote with these details filled in. This prototype sends nothing.";
  }));
}

home();
</script>
