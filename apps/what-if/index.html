:root {
  --ground: #f6f2ee;       /* If's warm off-white */
  --card: #ffffff;
  --ink: #331e11;          /* If's dark brown text */
  --muted: #74655a;
  --line: #e7dfd7;
  --blue: #0054f0;         /* If blue: actions, links, insurance */
  --blue-ink: #ffffff;
  --blue-soft: #eaf0fe;    /* the what-if note */
  --sand: #efe7de;         /* quiet fills, chart track */
  --risk: #e08a2c;         /* money you might have to pay later */
  --run: #b9a998;          /* running costs: charges, services, inspections */
  --pay-bg: #fbeadb;       /* "you pay" label */
  --pay-ink: #8a4a12;
  --bad: #c2412d;
  --good: #2f7d4f;
  --font: "Figtree", "Avenir Next", Avenir, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 400 17px/1.55 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 56px;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 460px; margin-inline: auto; display: grid; gap: 24px; }
button, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px; }
.mark { font: 800 24px/1 var(--font); letter-spacing: -0.01em; display: inline-flex; align-items: baseline; gap: 1px; }
.lights { display: inline-flex; gap: 3px; margin-left: 3px; }
.lights i { width: 5px; height: 5px; border-radius: 50%; background: var(--blue); display: block; }
.from { font: 600 14px/1 var(--font); color: var(--muted); }
.back { justify-self: start; background: none; border: 0; padding: 6px 0; font: 600 16px/1 var(--font); color: var(--blue); cursor: pointer; }

/* Type */
h1, h2, h3 { font-family: var(--font); margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
h1 { font-size: clamp(34px, 9.5vw, 44px); line-height: 1.06; font-weight: 800; }
h2 { font-size: 24px; line-height: 1.2; font-weight: 700; }
h3 { font-size: 20px; line-height: 1.25; font-weight: 700; }
p { margin: 0; }
.lead { color: var(--muted); font-size: 18px; max-width: 34ch; }
.eyebrow { font: 600 15px/1.2 var(--font); color: var(--muted); }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 14px; }

/* Input */
.fieldrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
label.field { font: 600 15px/1.2 var(--font); color: var(--ink); }
.textbtn { background: none; border: 0; padding: 4px 0; font: 600 15px/1.2 var(--font); color: var(--blue); cursor: pointer; }
textarea {
  width: 100%; resize: vertical; min-height: 170px; padding: 14px 16px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  font: 400 16px/1.55 var(--font); color: var(--ink);
}
textarea::placeholder { color: var(--muted); }
textarea.short { min-height: 84px; }
.examples { display: grid; gap: 8px; }
.chip {
  display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 12px; text-align: left;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 16px; cursor: pointer; color: var(--ink);
}
.chip .cat { grid-column: 1; font: 600 13px/1.3 var(--font); color: var(--muted); }
.chip > span:nth-child(2) { grid-column: 1; grid-row: 2; font: 600 16px/1.3 var(--font); }

o-kiinteistot"]},"ptax":{"src":"h-vero-kiinteistoveroprosentit-2026"},"ww":{"near":"A system built before 2004 under the rules or permit of its time that lies within 100 m of a water body or the sea, or in a groundwater area used or suitable for water supply, had to be brought up to the basic treatment requirement by 31 October 2019.","elsewhere":"Elsewhere, a pre-2004 system must be brought up to the basic requirement when a water toilet is built, when water and sewer installations are renovated so that the system is renewed or wholly repaired, or when a renovation comparable to constructing a building that needs a building permit (rakentamislupa) is done.","docs":"The owner must have a report on the wastewater system (or a system plan under 157 a §) and the system's operating and maintenance instructions, and must show them to the supervising authority on request.","exemption":"An exemption granted to the seller lapses when the property changes owner.","src":["h-law-527-2014","h-law-157-2017"]},"cottage":{"use":"Changing the use of a building or part of it substantially, such as turning a holiday home into a permanent home, needs a building permit (rakentamislupa), and the municipality's building ordinance can name areas where this conversion needs no exceptional permit (poikkeamislupa).","useSrc":["h-law-751-2023"],"road":"The owner of a property with a right of way to a private road is a road owner (tieosakas) who must share in the road's upkeep in proportion to the road units (tieyksiköt) set by the benefit the road brings, and the road charges (tiemaksut) are set from those units; the road is managed by a road association (tiekunta) if one has been set up, otherwise by the road owners together, and a new owner takes over the previous owner's road-upkeep commitments but not unpaid money charges.","roadSrc":["h-law-560-2018"]},"kt":{"low":895,"high":1910,"src":["h-px-sustera-laskuri","h-px-jep-hinnasto","h-px-satpa-hinnasto"],"what":"A condition inspection for a home sale (asuntokaupan kuntotarkastus) uses mainly sensory, experience-based and non-destructive methods with interviews of the occupants, and includes moisture measurements and minor openings of structures.","whatSrc":["h-px-kkv-menetelmat"]},"risk":{"plinth":{"rule":"A false plinth (valesokkeli) appears in the checklists for 1960s, 1970s and 1980s detached houses; low foundations with a false plinth became common in the 1970s, and the structure does not ventilate, so moisture damage develops easily.","from":1960,"to":1989,"src":["h-px-hometalkoot-1970"]},"crawl":{"rule":"A ventilated crawl-space floor (rossipohja, tuulettuva alapohja) is listed for 1940s and 1950s houses; it can have moisture damage, and the joint between an extension's slab-on-ground floor and the old crawl-space floor is a risk structure where moisture damage is common.","from":1940,"to":1959,"src":["h-px-hometalkoot-1950"]},"flat":{"rule":"Flat roofs were built on 1970s detached houses and are a moisture-damage risk when not maintained.","from":1970,"to":1979,"src":["h-px-hometalkoot-1970"]},"slab":{"rule":"A slab-on-ground floor with wooden battens and thermal insulation laid on top of the concrete slab is very prone to moisture damage and lasts on average 40 years; it appears in the checklists for 1940s to 1980s houses.","from":1940,"to":1989,"src":["h-px-hometalkoot-1970"]},"basement":{"rule":"Concrete or block basement walls insulated on the inside are very prone to moisture damage because soil moisture keeps the wall damp, and mould often forms between the concrete and the insulation.","from":1950,"to":null,"src":["h-px-hometalkoot-1960"]}},"radon":{"months":2,"season":"between the start of September and the end of May","price":86.6,"src":["h-px-stuk-viitearvot","h-px-stuk-kauppa"],"well":"STUK recommends reducing radon in private well water when it exceeds 1000 Bq/l, and drilled-well water is tested for radon, arsenic and uranium in addition to the normal tests.","wellSrc":["h-px-vantaa-kaivo"]},"oil":{"tank":{"rule":"Periodic inspection is mandatory only for underground oil tanks in important groundwater areas (first within 10 years of commissioning, then by condition class); municipal environmental protection regulations may make inspection mandatory for other tanks, and Tukes recommends regular inspection for all tanks. If's home insurance terms require oil tanks and their pipes to be inspected at least every 10 years, and by an expert firm at least every 5 years for buildings in groundwater areas.","src":["h-px-tukes-oljy","h-px-if-oma"]},"spill":{"rule":"The property owner or holder is primarily responsible for a heating-oil tank and pays for cleaning up a leak; the Oil Pollution Compensation Fund (öljysuojarahasto) may pay soil and groundwater clean-up only at its discretion, as a secondary payer, when the polluter cannot be found or cannot pay and the holder of the area cannot reasonably be required to clean it.","src":["h-px-pelastustoimi-oljy"]},"ground":[23000,26000],"air":[17000,18000],"switchSrc":["h-px-motiva-esim"]},"well":{"rule":"A household well's water should be tested regularly at least every three years, and whenever its colour, taste or smell changes or it is suspected of causing symptoms; the well owner is responsible for testing.","every":[3,5],"src":["h-px-hel-talousvesi","h-px-eurofins-kaivo"]},"life":{"roof":{"felt":[25,35],"sheet metal":[40,60],"tile":[45,45],"src":["h-px-hometalkoot-1980"]},"drain":{"years":[40,50],"src":["h-px-hometalkoot-1950"]}},"ins":{"fire":{"rule":"If's home insurance covers sudden and unforeseen direct damage to the insured building caused by fire that has got loose, soot, smoke, an explosion, or lightning that struck the property directly; If's product page lists this in all three cover levels.","src":["h-px-if-oma"]},"leak":{"rule":"Damage from a leak caused by a sudden and unforeseen breakage of the building's fixed plumbing or heating equipment, its pipes or a connected appliance is covered, but not water through floor-drain joints or a failed or missing waterproofing, rain or melt water through the foundation, walls or roof, slowly developing damage such as rot, mould or corrosion, and the payout is cut by 25 % for pipes aged 30–50 years and 50 % for pipes over 50.","src":["h-px-if-oma"]},"storm":{"rule":"Sudden and unforeseen direct damage caused by storm wind (myrskytuuli) or hail is covered, but the terms give no wind-speed threshold for storm wind.","src":["h-px-if-oma"]},"defects":{"rule":"The insurance does not cover damage to property caused by design, installation, workmanship, structural, manufacturing or material defects, construction against the rules or good practice of its time, building or foundation defects, or slowly developing events such as corrosion, rot, mould, wear, condensation, settling or movement of structures.","src":["h-px-if-oma"]},"flood":{"rule":"Damage to an insured building in Finland from an exceptional heavy-rain, river/lake or sea flood is covered when the water entered the building straight from the ground surface or through fixed sewer pipes; rain counts as exceptional at 30 mm in an hour or 75 mm in a day and a water level at a once-in-50-years level or rarer, yard damage from water-body and sea floods is not covered, and flood damage to a building built without the required permit is excluded.","src":["h-px-if-oma"],"covered":true,"who":"Covered by home insurance · if the flood counts as exceptional"},"empty":{"rule":"If the building is uninhabited for more than a week, the main shut-off valve inside the building must be closed (before the water meter if there is one) and the water pump switched off; in the cold season a building left without enough base heat must be drained, and the insurer treats supervision of a building as a visit at least once a month.","src":["h-px-if-oma"],"short":"If the building stands empty for over a week, close the main water valve and switch off the water pump: If’s home insurance terms require it."},"hdi":{"rule":"A seller can insure their own hidden-defect liability: one such policy, sold with a condition inspection, covers up to €75,000 for 5 years after the handover (secondary source).","src":["h-px-sustera-kauppaturva"]}},"elec":{"D":{"cents":17.91,"month":"2026-06","label":"household, 5,000–15,000 kWh a year","key":"D"},"E":{"cents":14.892,"month":"2026-06","label":"household, over 15,000 kWh a year"},"src":["h-sf-13rb"],"oil":{"cents":167,"month":"2026-06"},"oilSrc":["h-sf-12ge"]}}}}</script>

<script>
"use strict";

/* engine:start */
/* The ad reader and the rules. No AI: patterns read the ad, Traficom's statistics and the renovation and
   lease rules turn it into the same result the curated examples use. Pure functions of the text and DATA,
   so test/reader.test.mjs runs this block in Node. Every value taken from the ad is escaped before it is

function createEngine(DATA, today) {
  const NOW = today || new Date();
  const YEAR = NOW.getFullYear();
  const F = DATA.facts;

  /* ---------- formatting ---------- */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  const sq = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(1)) + " m²";
  const near = (n, step) => Math.round(n / step) * step;
  // "a, b and c", with a comma before "and" when an item has its own "and" ("springs and shock absorbers, brakes, and …").
  const and = (a) => (a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + (a.length > 2 && a.some((x) => / and /.test(x)) ? ", and " : " and ") + a[a.length - 1]);
  const uniq = (a) => [...new Set(a)];
  // An electric car, as a whole word, so "sähköikkunat" or "electric mirrors" don't make a petrol car electric.
  const ELECTRIC = /(?<!\p{L})(?:täys)?sähkö(?:auto)?(?!\p{L})|(?<!\p{L})bev(?!\p{L})|(?<!\p{L})electric(?!\p{L})(?!\s+(?:windows?|mirrors?|seats?|tailgate|boot|sunroof|parking|heat|sauna|stove))/u;
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------- sources ---------- */
  const SRC = {

  /* ---------- who pays if something goes wrong ---------- */
  const COVER = {
    car: {
      items: [

        { what: "Your own car is damaged in a crash", who: "Covered with full kasko · after your excess", tone: "covered", note: "Partial kasko doesn’t cover crash damage to your own car." },

        { what: "It breaks down: timing belt, clutch, gearbox", who: "Not covered · you pay", tone: "pay", breakdown: true },
        { what: "It fails the inspection", who: "Not covered · you pay", tone: "pay" },
      ],

    },
    home: {
      items: [
        { what: "A leak damages your flat", who: "Covered by insurance · after your excess", tone: "covered", note: "The housing company’s insurance covers the building. Your home insurance covers your things and the parts of the flat you’re responsible for." },
        { what: "A leak you caused damages the flat below", who: "Covered by your liability insurance · after your excess", tone: "covered", note: "When the leak was your fault. Liability cover is usually part of home insurance." },
        { what: "The pipe renovation", who: "Not covered · you pay your share", tone: "pay" },

      items: [
        { what: "Your things are damaged or stolen", who: "Covered by your home insurance · after your excess", tone: "covered" },
        { what: "A leak you caused damages the flat below", who: "Covered by your liability insurance · after your excess", tone: "covered", note: "When the leak was your fault. Liability cover is usually part of home insurance. Without it, you pay." },

        { what: "Normal wear in the flat", who: "Not your cost · it’s the landlord’s", tone: "other" },
      ],
      note: "The landlord’s insurance doesn’t cover your things or damage you cause.",
      sources: ["fine", "lease"],

  };

  /* ---------- numbers as written in Finnish and English ads ---------- */
  // "176 412,30", "13900", "312,000", "4.20", "1.090". Spaces of every kind are already plain spaces.
  const NUM = String.raw`\d{1,3}(?:[ .,]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d+)?`;
  function toNum(s) {
    s = s.replace(/ /g, "");
    const c = s.lastIndexOf(","), d = s.lastIndexOf(".");
    if (c >= 0 && d >= 0) {
      const dec = c > d ? "," : ".";
      s = s.split(dec === "," ? "." : ",").join("").replace(dec, ".");
    } else if (c >= 0 || d >= 0) {
      const parts = s.split(c >= 0 ? "," : ".");
      const thousands = parts.length > 2 || (parts[1].length === 3 && parts[0] !== "0");
      s = thousands ? parts.join("") : parts.join(".");
    }
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  }

  // Euro amounts with what they are per: "298,00 € / kk", "€4.20/m²/month", "22e/kk/henkilö", "offer 98.52 €/m".
  const MONEY = new RegExp(String.raw`(?:€|eur(?!\p{L}))[ ]?(${NUM})|(${NUM})[ ]?(?:€|euroa?(?!\p{L})|eur(?!\p{L})|e(?!\p{L}))`, "giu");
  function monies(s) {
    const out = [];
    for (const m of s.matchAll(MONEY)) {
      const v = toNum(m[1] ?? m[2]);
      if (v == null) continue;
      const after = s.slice(m.index + m[0].length, m.index + m[0].length + 24).toLowerCase();
      const before = s.slice(Math.max(0, m.index - 14), m.index).toLowerCase();
      let per = null;
      if (/^\s*\/\s*(m²|m2|neliö)/.test(after)) per = "m2";
      else if (/^\s*\/\s*(hlö|henk|person)|^\s*\/\s*(kk|kuukausi|month|mo)\s*\/\s*(hlö|henk|person)/.test(after)) per = "person";
      else if (/^\s*\/\s*(kk|kuuk|month|mo\b|m\b)|^\s*(kuukaudessa|per month|a month)/.test(after)) per = "month";
      else if (/^\s*\/\s*(v\b|vuosi|vuodessa|year|yr)/.test(after)) per = "year";
      const finance = /(alk\.?|alkaen|from|offer|rahoitus\w*|financing)\s*$/.test(before);
      out.push({ v, per, finance });
    }
    return out;
  }
  const pMoney = (s) => monies(s).find((m) => !m.finance && m.per !== "m2" && m.per !== "person")?.v ?? null;
  const pMonthly = (s) => monies(s).find((m) => !m.finance && (m.per === "month" || m.per === null))?.v ?? null;
  const pPerM2 = (s) => monies(s).find((m) => m.per === "m2")?.v ?? null;
  const pYear = (s) => {
    const m = s.match(/(?<![\d.\/-])(18[5-9]\d|19\d\d|20[0-4]\d)(?![\d.\/])/);
    return m && +m[1] <= YEAR + 1 ? +m[1] : null;
  };
  const YEARS = (s) => [...s.matchAll(/(?<![\d.\/])(19[5-9]\d|20[0-4]\d)(?![\d.\/])/g)].map((m) => +m[1]);
  const AREA = new RegExp(String.raw`(${NUM})[ ]?(?:\/[ ]?(?:${NUM})[ ]?)?(?:m²|m2|neliötä|neliöt|sqm)(?![\p{L}\d])`, "u");
  const pArea = (s) => {
    const m = s.match(AREA);
    const v = m ? toNum(m[1]) : null;
    return v && v >= 8 && v <= 1000 ? v : null;
  };
  const KM = new RegExp(String.raw`(${NUM})[ ]?(tkm|t\.km|km)(?![\p{L}\/])`, "iu");
  const pKm = (s) => {
    const m = s.match(KM);
    if (!m) return null;
    const v = toNum(m[1]) * (/^t/i.test(m[2]) ? 1000 : 1);
    return v >= 100 && v <= 2000000 ? v : null;
  };
  const pad = (n) => String(n).padStart(2, "0");
  function pDate(s) {
    let m = s.match(/(?<!\d)(\d{1,2})\.(\d{1,2})\.(20\d\d)(?!\d)/);
    if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    m = s.match(/(?<!\d)(\d{1,2})\/(\d{1,2})\/(20\d\d)(?!\d)/);
    if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    m = s.match(/(?<![\d.\/])(\d{1,2})[\/.-](20\d\d)(?!\d)/);
    if (m && +m[1] >= 1 && +m[1] <= 12) return `${m[2]}-${pad(m[1])}`;
    m = s.match(/(?<!\d)(20\d\d)-(\d{2})(?:-(\d{2}))?(?!\d)/);
    if (m) return m[3] ? `${m[1]}-${m[2]}-${m[3]}` : `${m[1]}-${m[2]}`;
    return null;
  }

  /* ---------- the text, as lines ---------- */
  function prep(raw) {
    let t = String(raw ?? "").normalize("NFC").replace(/\r\n?/g, "\n")
      .replace(/[    ]/g, " ").replace(/[​-‏﻿]/g, "").replace(/[ \t]+/g, " ");
    t = t.replace(/(\d) ?\n ?€ ?(?=\n|$)/g, "$1 €"); // Autotalli prints "13 900" and "€" on separate lines
    const lines = t.split("\n").map((l) => l.trim().replace(/^[*•·–-]\s*(?=\p{L})/u, "")).filter(Boolean);
    return { lines, text: lines.join("\n"), low: lines.join("\n").toLowerCase() };
  }

  // "Label\nvalue" (most sites) or "Label: value" on one line.
  const label = (src) => new RegExp(String.raw`^(?:${src})(?![\p{L}\d-])[ ]*[:.]?[ ]*`, "iu");
  function field(P, src, parse) {
    const re = label(src);
    for (let i = 0; i < P.lines.length; i++) {
      const m = re.exec(P.lines[i]);
      if (!m) continue;
      const rest = P.lines[i].slice(m[0].length);
      let v = rest ? parse(rest) : null;
      if (v == null && rest.length <= 14 && i + 1 < P.lines.length) v = parse(P.lines[i + 1]);
      if (v != null) return v;

    return null;
  }
  // A label anywhere in free text: "Selling price 159 000 €, debt-free price 168 000 €".
  function inline(P, src, parse) {
    const re = new RegExp(String.raw`(?<![\p{L}\d])(?:${src})(?![\p{L}\d])`, "giu");
    for (const m of P.text.matchAll(re)) {
      const v = parse(P.text.slice(m.index + m[0].length).split("\n")[0].slice(0, 70));
      if (v != null) return v;
    }
    return null;
  }
  const either = (P, src, parse) => field(P, src, parse) ?? inline(P, src, parse);

  /* ---------- place ---------- */
  const CITIES = ("Helsinki Espoo Tampere Vantaa Oulu Turku Jyväskylä Kuopio Lahti Pori Kouvola Joensuu Lappeenranta Hämeenlinna " +
    "Vaasa Seinäjoki Rovaniemi Mikkeli Kotka Salo Porvoo Kokkola Lohja Hyvinkää Nurmijärvi Järvenpää Rauma Kirkkonummi Tuusula " +
    "Kajaani Kerava Savonlinna Nokia Kangasala Ylöjärvi Kaarina Vihti Riihimäki Raisio Imatra Raahe Lempäälä Iisalmi Sastamala " +
    "Hollola Siilinjärvi Kemi Tornio Valkeakoski Mäntsälä Kuusamo Varkaus Pirkkala Äänekoski Jämsä Forssa Hamina Heinola Lieto " +
    "Pieksämäki Uusikaupunki Kauniainen Sipoo Naantali Ylivieska Pietarsaari Lapua Kurikka Kankaanpää Loviisa Kauhava Laukaa " +
    "Orimattila Paimio Huittinen Ulvila Kontiolahti Kempele Liminka Muhos Pudasjärvi Sotkamo Kitee Lieksa Nurmes Outokumpu Liperi " +
    "Suonenjoki Kiuruvesi Nivala Kalajoki Oulainen Alavus Ähtäri Kauhajoki Närpiö Kristiinankaupunki Mustasaari Pedersöre Kemijärvi " +
    "Sodankylä Kittilä Inari Keuruu Mänttä-Vilppula Orivesi Akaa Hämeenkyrö Ikaalinen Parkano Virrat Loimaa Somero Mynämäki Masku " +
    "Parainen Eura Eurajoki Harjavalta Kokemäki Janakkala Hattula Loppi Karkkila Raasepori Hanko Inkoo Siuntio Pyhtää Luumäki " +
    "Ruokolahti Juva Mäntyharju Joroinen Leppävirta Lapinlahti Haapajärvi Saarijärvi Viitasaari Kannus Kaskinen Lapinjärvi").split(" ");
  const CITY_ALIAS = { Helsingfors: "Helsinki", Esbo: "Espoo", Vanda: "Vantaa", Åbo: "Turku", Tammerfors: "Tampere", Grankulla: "Kauniainen", Borgå: "Porvoo", Vasa: "Vaasa", Uleåborg: "Oulu", Jakobstad: "Pietarsaari", Karleby: "Kokkola" };
  const CITY_RE = new RegExp(String.raw`(?<![\p{L}\d-])(${[...CITIES, ...Object.keys(CITY_ALIAS)].join("|")})(?![\p{L}\d])`, "u");
  const CAPITAL = ["Helsinki", "Espoo", "Vantaa", "Kauniainen"];
  function city(P) {
    const hit = (s) => s.match(CITY_RE)?.[1] ?? null;
    const c = field(P, "kaupunki|city|paikkakunta|kunta|municipality|sijaintikunta", hit) ?? field(P, "sijainti|location", (s) => hit(s)) ?? hit(P.text);
    return c ? CITY_ALIAS[c] ?? c : null;
  }
  function district(P, town) {
    const word = /^[\p{Lu}][\p{L}-]+(?: [\p{Lu}][\p{L}-]+)?$/u;
    const d = field(P, "kaupunginosa|district|neighbourhood|neighborhood", (s) => (word.test(s) && s !== town ? s : null));
    if (d) return d;
    if (town) {
      for (const line of P.lines.slice(0, 15)) {
        const parts = line.split(/,\s*/).map((x) => x.trim());
        const i = parts.indexOf(town);
        if (i > 0 && word.test(parts[i - 1]) && !/\d/.test(parts[i - 1])) return parts[i - 1];
      }
    }
    return P.text.match(/\(([\p{Lu}][\p{L}-]+) area\)/u)?.[1] ?? null;
  }

  /* ---------- cars ---------- */
  const MAKE_BY_FOLD = Object.fromEntries(DATA.makes.map((m) => [fold(m), m]));
  const MAKE_ALIAS = { vw: "Volkswagen", mercedes: "Mercedes-Benz", "mercedes benz": "Mercedes-Benz", mersu: "Mercedes-Benz", "land-rover": "Land Rover", "range rover": "Land Rover" };
  const OTHER_MAKES = ["Lada", "Lancia", "Daihatsu", "Rover", "Infiniti", "DS", "MG", "BYD", "Genesis", "Isuzu", "SsangYong", "Cadillac", "Maserati", "Ferrari", "Lamborghini", "Bentley", "Aston Martin", "Lotus", "Alpine", "Abarth", "Lynk & Co", "Nio", "Xpeng", "Zeekr"];
  const MAKE_NAMES = { ...MAKE_BY_FOLD, ...MAKE_ALIAS, ...Object.fromEntries(OTHER_MAKES.map((m) => [fold(m), m])) };
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const MAKE_RE = new RegExp(String.raw`(?<![a-z0-9])(${Object.keys(MAKE_NAMES).sort((a, b) => b.length - a.length).map(reEsc).join("|")})(?![a-z0-9])`, "g");
  const MODELS = {};
  for (const key of Object.keys(DATA.m)) {
    const [mk, model] = key.split("|");
    const src = reEsc(model).replace(/\\\./g, "[ .]?").replace(/[ -]/g, "[ -]?");
    (MODELS[mk] ??= []).push({ key, model, re: new RegExp("^" + src + (mk === "mercedes-benz" ? "(?![a-z])" : "(?![a-z0-9])")) });
  }
  for (const l of Object.values(MODELS)) l.sort((a, b) => b.model.length - a.model.length);

  // How ads write some models, against Traficom's series names (the text here is lowercase, without accents).
  const MODEL_ALIASES = {
    kia: [[/^pro[_ -]?cee['’]?d(?![a-z])/, "proceed"], [/^x[ -]?cee['’]?d(?![a-z])/, "xceed"], [/^cee['’]?d(?![a-z])/, "ceed"]],

  // Make and model: the first make in the ad that is followed by a model Traficom knows.

    + "italiasta|espanjasta|itävallasta|sveitsistä|englannista|britanniasta|iso-britanniasta|japanista|usa:sta|yhdysvalloista|kanadasta|"
    + "ulkomailta|euroopasta|keski-euroopasta|eu-alueelta|eu:sta";

    for (const line of P.lines.slice(0, 15)) {

  const ENGINE_FIELD = "moottori|engine|moottorin tilavuus|iskutilavuus|engine size|displacement|moottorikoodi|engine code|moottorityyppi|engine type";

    const re = label(ENGINE_FIELD);

      }).filter((v) => v >= 0.6 && v <= 6.6);

    };
    const litres = litresIn(fields) ?? litresIn(title);
    const text = [...title, ...fields].join("\n");
    return text || litres != null ? { litres, text } : null;
  }

  function readCar(P) {
    const low = P.low;
    const mm = makeModel(P);
    const c = { make: mm?.make ?? null, model: mm?.text ?? null, modelKey: mm?.key ?? null, flags: {} };
    c.badge = badgeOf(P, mm);

    c.year = field(P, "vuosimalli|year model|model year|vuosi|year|ensirekisteröinti|rekisteröity|käyttöönottovuosi", pYear)
      ?? P.lines.map((l) => l.match(/^(19[5-9]\d|20[0-3]\d)(?:\s*[●,|·•]|$)/)?.[1]).find(Boolean)
      ?? P.lines.slice(0, 3).map(pYear).find(Boolean) ?? null;

    if (c.year && (c.year < 1950 || c.year > YEAR + 1)) c.year = null;

    c.km = field(P, "mittarilukema|ajettu|ajomäärä|kilometrit|mileage|odometer|km-lukema", (s) => pKm(s) ?? (/^\d[\d ]*$/.test(s) ? toNum(s) : null));
    if (c.km == null) {
      for (const line of P.lines) {
        if (/takuu|warranty|kohdalla|vaihdettu|changed|replaced|huolto|service|väli|interval|hihna|belt|km\/h/i.test(line)) continue;
        const v = pKm(line);
        if (v) { c.km = v; break; }
      }
    }

    // Price: by label, else the first line that is only an amount, else the first plain amount in the ad.
    const pureLine = new RegExp(String.raw`^(?:€ ?)?(${NUM}) ?(?:€|eur|e)?$`, "i");
    c.price = field(P, "hinta|price|myyntihinta|pyyntö|asking price|kokonaishinta", pMoney);
    let priceLine = -1;
    for (let i = 0; i < P.lines.length; i++) {

    }

    if (priceLine >= 0 && P.lines[priceLine + 1] && /€|eur/i.test(P.lines[priceLine + 1]) && pureLine.test(P.lines[priceLine + 1])) {
      const v = toNum(P.lines[priceLine + 1].match(pureLine)[1]);

    }
    c.officeFee = field(P, "toimistomaksu|office fee|toimituskulut|toimitusmaksu", pMoney);

      const t = s.toLowerCase();

    // number and is never read. Two different CO2 figures with no method give none.
    const co2s = [...P.text.matchAll(/(?<![\d.,])(\d{1,3}) ?g ?\/ ?km(?!\p{L})/giu)].map((m) => {
      const lb = [...P.text.slice(Math.max(0, m.index - 40), m.index).matchAll(/wltp|nedc/gi)].at(-1)?.[0];

    c.firstUse = field(P, "käyttöönottopäivä|first usage date|date of first use|first use|ensirekisteröintipäivä|ensirekisteröinti|first registration", pDate)

    const rusty = low.split(/[.!?\n]+/).filter((s) => /ruost|(?<!t)rust(?!\p{L})/u.test(s));
    if (rusty.some((s) => !/(?<!\p{L})(?:ei|eikä|ilman|no|not|without|free)(?!\p{L})|ruosteeton|rust-free/u.test(s))) f.rustMentioned = true;

    if (stated(low, MOD_INSPECTED)) f.modInspected = true;

    if (w && !/^ei\b/i.test(w[1])) f.dealerWarranty = w[1].trim();
    return c;
  }

  /* ---------- homes and rentals ---------- */
  const PIPE = /putki(?:remont|saneera)|linjasaneera|lvis?-(?:saneera|remont)|käyttövesi- ja viemäriputk|viemäriputk|käyttövesiputk|pipe (?:renovation|replacement|repair)|plumbing (?:renovation|replacement)|pipes (?:were |have been )?(?:renewed|replaced)/i;
  const DONE_HEAD = /^(?:taloyhtiön |asunnon )?(?:tehdyt (?:remontit|korjaukset|peruskorjaukset)|completed renovations|renovations done|past renovations)/i;
  const PLAN_HEAD = /^(?:taloyhtiön |asunnon )?(?:tulevat (?:remontit|korjaukset)|suunnitellut (?:remontit|korjaukset)|tiedossa olevat (?:remontit|korjaukset)|upcoming renovations|planned renovations|future renovations)/i;
  const PLAN_WORDS = /suunnitte|suunnitel|tulossa|tulevat|alkaa|alkamassa|aloitetaan|valmistuu|hankesuunnittelu|selvitetään|selvityksessä|aiotaan|päätetty|keskustel|harkit|planned|planning|upcoming|coming|under discussion|discussed|will start|starts in|to be done|decided/i;
  const DONE_WORDS = /valmistunut|valmistui|tehty|tehtiin|uusittu|uusittiin|saneerattu|saneerattiin|toteutettu|yhteydessä|done|completed|renewed|replaced|finished/i;
  const PARTS = [[/julkisivu/i, "facade"], [/parvekeov/i, "balcony door"], [/parvek(?!eov)/i, "balcony"], [/vesikat|katto|katon/i, "roof"], [/ikkun/i, "window"], [/hissi/i, "lift"],
    [/märkätil/i, "wet-room"], [/salaoj/i, "foundation drain"], [/lämmönvaihdin|lämmönsiir|lämmönjako/i, "heating"], [/putki|lvis|linjasaneera/i, "pipe"],
    [/viemär/i, "drain"], [/sähkö/i, "electrical"], [/piha/i, "yard"], [/ilmanvaiht/i, "ventilation"], [/perustu|sokkel/i, "foundation"], [/kylpyhuone/i, "bathroom"],
    [/savuhormi/i, "chimney"], [/porra/i, "stairwell"]];
  const ACTS = [[/kuntotutkimu/i, "condition survey"], [/kuntoarvio/i, "condition assessment"], [/modernisoin/i, "modernisation"],
    [/uusimi|uusitaan|uusinta|uusittu/i, "renewal"], [/korjau|kunnostu/i, "repair"], [/maalau/i, "painting"], [/saneera|remont|urakka/i, "renovation"], [/suunnittelu/i, "planning"]];
  // Finnish renovation lines in plain English, or null when the words aren't known (then the line is left out).
  function inEnglish(text) {
    const parts = PARTS.filter(([re]) => re.test(text)).map(([, w]) => w);
    if (parts.length) {
      const act = ACTS.find(([re]) => re.test(text));
      return `${and(parts)} ${act ? act[1] : "work"}`;
    }
    if (/(?<!\p{L})(?:renovation|repair|replacement|facade|roof|windows?|balcon(?:y|ies)|pipes?|lift|elevator|survey|painting|renewal)(?!\p{L})/iu.test(text)) {
      return esc(text.replace(/(?<!\d)(?:19|20)\d\d(?!\d)\s*[–-]?\s*/g, "").replace(/[.:]\s*$/, "").trim().toLowerCase()); // already English
    }
    return null;
  }

  // Which renovation list each line belongs to, from headings like "Tehdyt remontit" and "Tulevat remontit".
  function lists(P) {
    const where = [];
    let sec = null, run = 0;
    for (const line of P.lines) {
      if (DONE_HEAD.test(line)) { sec = "done"; run = 0; where.push(null); continue; }
      if (PLAN_HEAD.test(line)) { sec = "plan"; run = 0; where.push(null); continue; }
      if (sec && (YEARS(line).length || (run === 0 && line.length > 25))) { where.push(sec); run++; continue; }
      sec = null;
      where.push(null);
    }
    return where;
  }
  function renovations(P) {
    const where = lists(P);
    const hits = [], planned = [], done = [];
    P.lines.forEach((line, i) => {
      if (where[i] === "plan") planned.push({ years: YEARS(line), en: inEnglish(line.replace(/^[\d\s:–-]+/, "")) });
      if (where[i] === "done") done.push({ years: YEARS(line), en: inEnglish(line.replace(/^[\d\s:–-]+/, "")) });
      for (const clause of line.split(/(?<=[.;!?])\s+|,\s+(?=\p{L})/u)) {
        if (!PIPE.test(clause)) continue;
        const ys = YEARS(clause);
        let st = where[i] === "plan" ? "planned" : where[i] === "done" ? "done" : null;
        if (!st) {
          const p = PLAN_WORDS.test(clause), d = DONE_WORDS.test(clause);
          if (p && !d) st = "planned";
          else if (d && !p) st = "done";
          else if (ys.length) st = Math.max(...ys) >= YEAR ? "planned" : "done";
          else st = "mentioned";
        }
        if (st === "done" && ys.length && Math.min(...ys) > YEAR) st = "planned";
        hits.push({ st, ys });
      }
    });
    const of = (st) => hits.filter((h) => h.st === st);
    const years = (hs) => uniq(hs.flatMap((h) => h.ys)).sort((a, b) => a - b);
    let pipe = { status: "not-mentioned", years: [] };
    if (of("planned").some((h) => h.ys.some((y) => y >= YEAR))) pipe = { status: "planned", years: years(of("planned")) };
    else if (of("done").length) pipe = { status: "done", years: years(of("done")) };
    else if (of("planned").length) pipe = { status: "planned", years: years(of("planned")) };
    else if (hits.length) pipe = { status: "mentioned", years: years(hits) };
    return { pipe, planned: planned.filter((p) => p.en && !/pipe/.test(p.en)), done: done.filter((d) => d.en) };
  }

  function buildingType(P) {
    const map = (s) => {
      const t = s.toLowerCase();
      if (/kerrostalo|block of flats|apartment building|luhtitalo/.test(t)) return "block of flats";
      if (/rivitalo|terraced|townhouse|row house/.test(t)) return "terraced house";
      if (/paritalo|semi-detached/.test(t)) return "semi-detached house";
      if (/omakotitalo|erillistalo|detached house/.test(t)) return "detached house";
      return null;
    };
    return field(P, "talotyyppi|rakennuksen tyyppi|housing type|building type|tyyppi|type", map) ?? map(P.lines[0] ?? "") ?? map(P.text)
      ?? (/(?<!\p{L})(?:apartment|flat)(?!\p{L})[^.]{0,60}(?:floor|lift|elevator)/iu.test(P.text) ? "block of flats" : null);
  }
  function rooms(P) {
    const word = { yksiö: 1, kaksio: 2, kolmio: 3 };
    const n = field(P, "huoneita|number of rooms|rooms|huoneluku", (s) => {
      const b = s.match(/(\d)\s*(?:bedrooms?|makuuhuone)/i);
      if (b) return +b[1] + 1;
      const d = s.match(/^(\d{1,2})(?!\d)/);
      if (d) return +d[1];
      return word[s.toLowerCase().trim()] ?? null;
    });
    if (n) return n;
    const lay = P.text.match(/(?<![\p{L}\d])(\d)\s?(?:h|mh)(?:\s?[,+]|\s)/u);
    if (lay) return +lay[1];
    const en = P.text.match(/(\d)[ -]?(?:bedroom)/i);
    if (en) return +en[1] + 1;
    const r = P.text.match(/(\d)\s+rooms?\b/i);
    if (r) return +r[1];
    const w = P.low.match(/(?<!\p{L})(yksiö|kaksio|kolmio|studio)(?!\p{L})/u);
    return w ? { yksiö: 1, kaksio: 2, kolmio: 3, studio: 1 }[w[1]] : null;
  }
  function livingArea(P) {
    const v = field(P, "asuintilojen pinta-ala|asuinpinta-ala|asuinala|living area|huoneiston pinta-ala|pinta-ala|koko|size|area", pArea);
    if (v) return v;
    let skipNext = false;
    for (const line of P.lines) {
      if (skipNext) { skipNext = false; continue; }
      if (/^(tontin|tontti|plot|lot)/i.test(line)) { skipNext = true; continue; }
      if (/€|eur|neliöhinta|price/i.test(line)) continue;
      const a = pArea(line);
      if (a) return a;
    }
    return null;
  }
  function builtIn(P) {
    return field(P, "rakennusvuosi|construction year|year built|built|valmistumisvuosi|rakennettu|vuosi|year|käyttöönottovuosi", pYear)
      ?? inline(P, "rakennettu|valmistunut|built|rakennusvuosi|rak\\.? ?v\\.?|rv", pYear)
      ?? pYear(P.text.match(/(?:kerrostalo|rivitalo|paritalo|luhtitalo|block of flats|terraced house)[^\n\d]{0,12}((?:19|20)\d\d)(?!\d)/i)?.[1] ?? "");
  }

  // The postcode from the address: "Esimerkkikatu 4 B, 33500", "Esimerkkitie 12 B, 20540 Turku", or Oikotie's
  // "Esimerkkitie 12 B\n,\n20540\nTurku". Never a price, an id or a size.
  function postcode(P) {
    const f = field(P, "postinumero|postal code|postcode|zip code", (s) => s.match(/^(\d{5})(?![\d\p{L}])/u)?.[1] ?? null);
    if (f) return f;
    for (let i = 0; i < P.lines.length; i++) {
      const line = P.lines[i];
      const a = line.match(/(?:^|,\s*|\s)(\d{5})\s+([\p{Lu}][\p{L}-]+)(?=\s*(?:,|\(|$))/u);
      if (a && (CITY_RE.test(a[2]) || /\p{L}/u.test(line.slice(0, a.index)))) return a[1];
      const b = line.match(/\p{L}.*,\s*(\d{5})$/u);
      if (b) return b[1];
      if (/^\d{5}$/.test(line) && (P.lines[i - 1] === "," || CITY_RE.test(P.lines[i + 1] ?? ""))) return line;
    }
    return null;
  }

  /* ---------- flats: what the ad's own words say ---------- */
  // A word the ad says, not counting a negation before it in the same clause ("ei kosteusvaurioita", "ei ole havaittu
  // kosteusvaurioita", "no mould", "ilman …") or right after it ("kosteusvaurioita ei ole havaittu", "none found").
  // Gives the clause it was found in, cut short, to quote, and the years in it.
  const NEG_BEFORE = /(?<!\p{L})(?:ei|eikä|not|no|never|without|ilman|free of)\s+(?:\p{L}+\s+){0,2}$/u;
  const NEG_AFTER = /^[^.;!?]{0,25}?(?<!\p{L})(?:ei (?:ole )?(?:havaittu|todettu|ilmennyt|esiinny|ole|löytynyt)|not (?:been )?found|none found|not detected)/u;
  const clip = (s) => (s.length <= 90 ? s : s.slice(0, 88).replace(/\s+\S*$/, "") + " …").replace(/[.:;,]\s*$/, "");
  function adSays(P, re, ok = () => true) {
    const g = new RegExp(re.source, "giu");
    for (const line of P.lines) {
      for (const clause of line.split(/(?<=[.;!?])\s+/)) {
        const low = clause.toLowerCase();
        for (const m of low.matchAll(g)) {
          if (NEG_BEFORE.test(low.slice(Math.max(0, m.index - 40), m.index)) || NEG_AFTER.test(low.slice(m.index + m[0].length))) continue;
          if (!ok(low, m)) continue;
          return { quote: clip(line.length <= 90 ? line : clause), word: m[0], years: YEARS(clause) };
        }
      }
    }
    return null;
  }
  const MOISTURE = /(?<!\p{L})(?:kosteusvauri\p{L}*|kosteusvahin\p{L}*|kosteusongelm\p{L}*|kosteusvik\p{L}*|vesivahin\p{L}*|vesivauri\p{L}*|vuotovahin\p{L}*|moisture damage|water damage|damp problems?)(?!\p{L})/u;
  // "home" is mould in Finnish and a home in English: on its own it counts only in a Finnish clause.
  const MOULD = /(?<!\p{L})(?:home(?:vauri\p{L}*|ongelm\p{L}*|itiö\p{L}*|haju\p{L}*|kasvusto\p{L}*|tta|esta|en|inen|isia)?|homehtu\p{L}*|mould\p{L}*|mold|moldy|mouldy)(?!\p{L})/u;
  const ENGLISH = /(?<!\p{L})(?:the|and|is|with|your|this|for|of|to|in|sweet|new)(?!\p{L})/u;
  const mouldOk = (low, m) => m[0] !== "home" || (!ENGLISH.test(low) && /[äö]|(?<!\p{L})(?:on|ja|ei|oli|löytyi|havaittu|todettu)(?!\p{L})/u.test(low));
  const SURVEY = /(?<!\p{L})(?:kuntotutkimu\p{L}*|kuntoarvi\p{L}*|kuntokartoitu\p{L}*|pts|pts-\p{L}+|pitkän (?:aikavälin|tähtäimen) (?:kunnossapito|korjaus)suunnitelm\p{L}*|condition survey\p{L}*|condition assessment\p{L}*|condition report\p{L}*)(?!\p{L})/u;
  const OIL = /(?<!\p{L})(?:öljylämmit\p{L}*|öljylämpö|öljykattila\p{L}*|öljypoltin|oil heating|oil-heated|oil heated|oil boiler)(?!\p{L})/u;
  // Oil heating that is still there: not "öljylämmitys vaihdettu maalämpöön 2019" or "maalämpö (ent. öljy)".
  const OIL_GONE = /(?<!\p{L})(?:vaihdettu|korvattu|luovuttu|poistettu|purettu|muutettu|ent\.|entinen|aiemmin|replaced|switched|converted|former(?:ly)?|removed)(?!\p{L})/u;
  const oilOk = (low) => !OIL_GONE.test(low);
  const ASBESTOS = /(?<!\p{L})(?:asbesti\p{L}*|asbestos)(?!\p{L})/u;
  const LOAN = /(?<!\p{L})(?:(?:taloyhtiö|yhtiö)laina(?!osuu)\p{L}*|(?:uusi|uutta|lisä)laina\p{L}*|lainarahoit\p{L}*|lainoit\p{L}*|lainalla rahoitet\p{L}*|rahoitetaan (?:yhtiö)?lainalla|(?:otetaan|nostetaan|nostettava|otettava|haetaan) (?:yhtiö|uusi |uutta )?laina\p{L}*|(?:taloyhtiöllä|yhtiöllä) on (?:\p{L}+ )?lainaa|(?:new |planned )?(?:housing )?company loan(?! share)s?|loan[- ]financed|financed (?:with|by) a (?:new )?loan)(?!\p{L})/u;
  const PLAN_LOAN = /(?<!\p{L})(?:suunnitel\p{L}*|tulossa|tuleva\p{L}*|otetaan|nostetaan|nostettava|otettava|haetaan|päätetty|päätti|uusi|uutta|lisälaina\p{L}*|rahoitetaan|planned|will be|new|to be)(?!\p{L})/u;

  // Energy class from "Energialuokka\nD (2018)", "E2018", "Energy class B2018", "C (2013)", "energialuokka A".
  function energyOf(P) {
    const parse = (s) => {
      const m = s.replace(/^[\s:]+/, "").match(/^([A-G])(?:\s*[(,]?\s*(2007|2013|2018)\)?)?(?![\p{L}\d])/u);
      return m ? { cls: m[1], scale: m[2] ? +m[2] : null } : null;
    };
    return either(P, "energialuokka|energiatehokkuusluokka|energiatodistus|energy class|energy rating|energy certificate", parse);
  }
  // How the building is heated, from a heating field or the ad's words.
  function heatingOf(P) {
    const map = (s) => {
      const t = s.toLowerCase();
      return /öljy|(?<!\p{L})oil(?!\p{L})/u.test(t) && oilOk(t) ? "oil" : /kaukolämpö|district/.test(t) ? "district" : /maalämpö|ground[- ]source|geothermal/.test(t) ? "ground-source heat pump"
        : /sähkö|electric/.test(t) ? "electric" : null;
    };
    return field(P, "lämmitys|lämmitysjärjestelmä|lämmitysmuoto|lämmitystapa|heating system|heating", map)
      ?? (OIL.test(P.low) && adSays(P, OIL, oilOk) ? "oil" : /kaukolämpö|district heating/.test(P.low) ? "district" : null);
  }
  // When the plot lease ends: "Tontin vuokra-aika päättyy\n31.12.2045", "vuokrasopimus päättyy 2035". A plain
  // "vuokrasopimus päättyy" counts only when the ad is about a leased plot and doesn't mention a tenant in the flat.
  function plotLeaseEnd(P, leased) {
    const when = (s) => {
      const d = pDate(s);
      if (d) return d;
      const y = s.match(/^(?:\D{0,12})(?<!\d)(20\d\d|21\d\d)(?!\d)/)?.[1];
      return y ? y : null;
    };
    const plot = either(P, "tontin vuokra-aika päättyy|tontin vuokrasopimus päättyy|tontin vuokrasopimus voimassa|maanvuokrasopimus päättyy|vuokra-aika päättyy|plot lease ends|ground lease ends|plot lease expires|lease of the plot ends", when);
    if (plot) return plot;
    if (!leased || /vuokralai|asunto on vuokrattu|vuokrattuna|tenant/.test(P.low)) return null;
    return either(P, "vuokrasopimus päättyy|vuokrasopimus voimassa|lease ends|lease expires", when);
  }
  // What the ad itself says about the building and the flat. Only words the ad uses; negations don't count.
  function flatSays(P) {
    const moisture = adSays(P, MOISTURE);
    const mould = adSays(P, MOULD, mouldOk);
    const loan = adSays(P, LOAN);
    return {
      damage: moisture || mould ? { ...(moisture ?? mould), mould: !!mould && !moisture } : null,
      survey: adSays(P, SURVEY),
      oil: adSays(P, OIL, oilOk),
      asbestos: adSays(P, ASBESTOS),
      loan: loan ? { ...loan, planned: PLAN_LOAN.test(loan.quote.toLowerCase()) } : null,
    };
  }

  function readHome(P) {
    const h = {};
    h.debtFreePrice = either(P, "velaton hinta|debt[- ]free price|velaton myyntihinta", pMoney);
    h.sellingPrice = either(P, "myyntihinta|selling price|pyyntihinta", pMoney);
    h.debtShare = either(P, "velkaosuus|lainaosuus|yhtiölainaosuus|housing company loan share|loan share|debt share", pMoney);
    if (h.debtFreePrice == null) h.debtFreePrice = field(P, "hinta|price", pMoney); // Etuovi's header price is the debt-free price
    if (h.debtShare == null && h.debtFreePrice != null && h.sellingPrice != null) h.debtShare = Math.round((h.debtFreePrice - h.sellingPrice) * 100) / 100;
    if (h.sellingPrice == null && h.debtFreePrice != null && h.debtShare != null) h.sellingPrice = h.debtFreePrice - h.debtShare;
    if (h.debtFreePrice == null && h.sellingPrice != null) h.debtFreePrice = h.sellingPrice + (h.debtShare ?? 0);
    h.maintenanceCharge = either(P, "hoitovastike|maintenance charge|maintenance fee", pMonthly);
    h.maintenanceChargePerM2 = either(P, "hoitovastike|maintenance charge|maintenance fee", pPerM2);
    h.financingCharge = either(P, "pääomavastike|rahoitusvastike|capital charge|financing charge", pMonthly);
    h.plotRentCharge = either(P, "tontin vuokravastike|tonttivuokra|plot rent", pMonthly);
    h.totalCharge = field(P, "yhtiövastike yhteensä|vastikkeet yhteensä|vastike yhteensä|total charges?", pMonthly);
    h.livingAreaM2 = livingArea(P);
    h.buildingYear = builtIn(P);
    h.buildingType = buildingType(P);
    h.rooms = rooms(P);
    h.city = city(P);
    h.district = district(P, h.city);
    const r = renovations(P);
    h.pipeRenovation = r.pipe;
    h.renovationsPlanned = r.planned;
    h.renovationsDone = r.done;
    h.plotLeased = /tontin omistus\s*\n?\s*vuokra|plot is leased|leased plot|vuokratontti|tontti on vuokra|tontti vuokrattu|tontin vuokra|tonttivuokra|maanvuokra|plot rent|ground rent|leased from the city/i.test(P.text);
    h.plotLeaseEnds = plotLeaseEnd(P, h.plotLeased);
    if (h.plotLeaseEnds) h.plotLeased = true;
    h.postcode = postcode(P);
    const e = energyOf(P);
    h.energyClass = e?.cls ?? null;
    h.energyClassScale = e?.scale ?? null;
    h.heating = heatingOf(P);
    h.says = flatSays(P);
    return h;
  }

  function readRent(P) {
    const r = {};
    r.rent = either(P, "vuokra\\/kk|vuokra|kuukausivuokra|monthly rent|rent per month|rent", pMonthly)
      ?? P.lines.slice(0, 12).map((l) => monies(l).find((m) => m.per === "month" && !m.finance)?.v).find((v) => v >= 100) ?? null;
    const months = (s) => {
      const m = s.match(/(?<!\d)(\d(?:[.,]\d)?)\s*(?:kk|kuukauden|kuukautta|months?|month['’]s|x\s*vuokra)/i);
      return m ? toNum(m[1]) : null;
    };
    r.deposit = either(P, "vakuus|vuokravakuus|takuuvuokra|security deposit|deposit", pMoney);
    r.depositMonths = either(P, "vakuus|vuokravakuus|takuuvuokra|lisätietoa vakuudesta|security deposit|deposit", months);
    r.noDeposit = /ei vakuutta|no deposit|vakuudeton|without a deposit/i.test(P.text);
    if (r.deposit == null && r.depositMonths != null && r.rent) r.deposit = r.depositMonths * r.rent;
    if (r.depositMonths == null && r.deposit != null && r.rent) r.depositMonths = Math.round((r.deposit / r.rent) * 10) / 10;
    r.homeInsuranceRequired = /kotivakuutus(?:\s+on)?\s+(?:vaaditaan|vaadittava|pakollinen|edellytetään|edellytys)|(?:vaaditaan|edellytetään)\s+kotivakuutus|home insurance (?:is )?(?:required|mandatory|compulsory)|requires? (?:a )?home insurance/i.test(P.text) || null;
    const water = [];
    for (const src of ["vesimaksun lisätiedot", "vesimaksu|water fee|water charge|water"]) {
      const v = either(P, src, (s) => {
        if (/sisältyy|included/i.test(s)) return { included: true };
        const m = monies(s)[0];
        return m ? { amount: m.v, perPerson: m.per === "person" } : null;
      });
      if (v) water.push(v);
    }
    r.waterIncluded = water.some((w) => w.included) || /(?:rent includes|vuokraan sisältyy|sisältyy vuokraan)[^.\n]{0,20}(?:water|vesi)/i.test(P.text);
    r.waterFee = r.waterIncluded ? null : water.find((w) => w.perPerson) ?? water.find((w) => w.amount) ?? null;
    r.fixedTerm = /määräaikai|fixed[- ]term/i.test(P.text);
    r.livingAreaM2 = livingArea(P);
    r.buildingYear = builtIn(P);
    r.buildingType = buildingType(P);
    r.rooms = rooms(P);
    r.city = city(P);
    r.district = district(P, r.city);
    r.pipeRenovation = renovations(P).pipe;
    r.postcode = postcode(P);
    const d = flatSays(P).damage;
    r.says = { damage: d };
    return r;
  }

  /* ---------- houses and cottages sold as real estate ---------- */
  // The ad's clauses, so "ei kosteusvaurioita" and "kosteusvaurioita ei ole havaittu" both read as none. A label on its
  // own line and its value on the next ("Viemäri" / "kunnan") are read with field() instead.
  const NEG = /(?<!\p{L})(?:ei|eikä|ilman|no|not|without|never|none)(?!\p{L})|(?<!\p{L})(?:puuttuu|missing)(?!\p{L})/u;
  const clauses = (P) => P.text.split(/(?<=[.;!?])\s+|\n|,\s+(?=\p{L})/u).map((s) => s.trim()).filter(Boolean);
  // What the ad affirms about re, and what it denies.
  function said(P, re) {
    const hit = clauses(P).filter((c) => re.test(c.toLowerCase()));
    return { yes: hit.filter((c) => !NEG.test(c.toLowerCase())), no: hit.filter((c) => NEG.test(c.toLowerCase())) };
  }
  // The latest year in a piece of text, also in "11/2025", never after this year.
  const lastYear = (s) => {
    const ys = [...String(s).matchAll(/(?<!\d)(19[5-9]\d|20[0-4]\d)(?!\d)/g)].map((m) => +m[1]).filter((y) => y <= YEAR);
    return ys.length ? Math.max(...ys) : null;
  };
  const RENEWED = /uusittu|uusittiin|uusinta|vaihdettu|vaihdettiin|uusi(?:ttu)? (?:kate|katto|vesikatto)|asennettu|rakennettu|tehty|tehtiin|renewed|replaced|new (?:roof|drains?)|installed|re-?roofed|done/;
  const UPKEEP = /huoltomaalat|maalattu|maalaus|pesty|pesu|huuhtel|huuhdeltu|kuvattu|kuvaus|tarkastettu|tarkistettu|painted|cleaned|flushed|inspected|camera/;
  const PLANNED = /tulossa|suunnitte|uusitaan|tehdään|vaihdetaan|edessä|planned|due|will be|to be (?:renewed|replaced|done)/;

  const pPlot = (s) => {
    const ha = s.match(new RegExp(String.raw`(${NUM})[ ]?(?:ha|hehtaari\p{L}*)(?![\p{L}\d])`, "u"));
    if (ha) { const v = toNum(ha[1]); return v && v < 1000 ? Math.round(v * 10000) : null; }
    const m = s.match(new RegExp(String.raw`(${NUM})[ ]?(?:m²|m2|neliötä|sqm)(?![\p{L}\d])`, "u"));
    const v = m ? toNum(m[1]) : null;
    return v && v >= 50 && v <= 1e7 ? v : null;
  };
  const pYearly = (s) => {
    const m = monies(s).find((x) => !x.finance && (x.per === "year" || x.per === "month"));
    return m ? (m.per === "month" ? m.v * 12 : m.v) : null;
  };

  const HOUSE_TYPES = [["cottage", /mökki|huvila|loma-asunto|vapaa-ajan ?asunto|kesäasunto|cottage|summer house|holiday home/],
    ["house", /omakotitalo|erillistalo|paritalo|rivitalo|talo|detached|semi-detached|house/]];
  const COTTAGE_WORDS = /mökki tai huvila|loma-asunnon perustiedot|(?<!\p{L})(?:kesä|loma|vapaa-ajan |rantas)?mökki(?:\p{L}{0,3})?(?!\p{L})|(?<!\p{L})(?:kesä)?huvila(?!\p{L})|vapaa-ajan ?asunto|loma-asunto|kesäasunto|(?<!\p{L})(?:cottage|summer house|summer cottage|holiday home)(?!\p{L})/u;
  const HOUSE_WORDS = /omakotitalo|erillistalo|(?<!\p{L})okt(?!\p{L})|detached house|(?<!\p{L})(?:family )?house for sale(?!\p{L})/u;
  // A house or a cottage sold as real estate: no housing company charges, and not a rental.
  function houseKind(P) {
    const head = P.lines.slice(0, 8).join("\n").toLowerCase();
    if (/hoitovastike|yhtiövastike|maintenance charge|osakehuoneisto/.test(P.low)) return null;
    if (/vuokra(?!-?aika|tontti|tontilla|lla|\s*-?sopimus)|vuokrataan|for rent|to let(?!\p{L})|(?<!\p{L})rent(?!\p{L})/u.test(head) && !/tontin omistus|tontti/.test(head)) return null;
    const typed = field(P, "tyyppi|rakennuksen tyyppi|talotyyppi|kohdetyyppi|property type|type", (s) => HOUSE_TYPES.find(([, re]) => re.test(s.toLowerCase()))?.[0] ?? null);
    const estate = /\(kiinteistö\)|kohde on\s*\n?\s*kiinteistö|omistusmuoto\s*\n?\s*kiinteistö|kiinteistökauppa/.test(P.low);
    if (typed === "cottage" || COTTAGE_WORDS.test(head)) return "cottage";
    if (typed === "house" && (estate || /omakotitalo|erillistalo|detached/.test(P.low))) return "house";
    if (HOUSE_WORDS.test(head) || buildingType(P) === "detached house" || estate) return "house";
    return null;
  }
  // A plot with no house on it.
  function plotOnly(P) {
    const head = P.lines.slice(0, 6).join("\n").toLowerCase();
    return /(?<!\p{L})(?:tontti|rakennuspaikka|rakentamaton tontti|building plot|plot for sale)(?!\p{L})/u.test(head)
      && !/omakotitalo|mökki|huvila|talo(?!\p{L})|house|cottage/.test(head) && !builtIn(P) && !livingArea(P);
  }

  const HEAT = [
    ["oil", /öljylämm|öljykeskuslämm|öljykattila|öljypoltin|öljyläm|öljysäiliö|öljyä (?:mennyt|kuluu|kului)|polttoöljy|(?<!\p{L})öljy(?!\p{L})|oil[- ](?:heating|boiler|burner|tank|central heating|fired)/u],
    ["ground-source", /maalämpö|maalämmitys|ground[- ]source|geothermal/],
    ["air-to-water", /ilma-?vesilämpö|ilma-vesi|air[- ]to[- ]water|air-water heat pump/],
    ["district", /kaukolämpö|kaukolämmitys|district heat/],
    ["wood", /puulämmitys|puukeskuslämmitys|puukattila|hakelämmitys|pelletti|(?<!\p{L})puu(?!\p{L})(?=[^.\n]{0,20}lämmity)|lämmitys:? puu(?!\p{L})|wood[- ](?:heating|boiler|central heating|fired)|pellet/u],
    ["direct electric", /suora sähkölämmitys|suora sähkö|suorasähkö|direct electric/],
    ["storage electric", /varaava sähkölämmitys|osittain varaava sähkö|storage electric/],
    ["electric", /sähkölämmitys|sähköpatteri|electric heating|electric radiators/],
    ["air-to-air", /ilmalämpöpumppu|air[- ]source heat pump|air-to-air heat pump/],
  ];
  // Words that say a heating system is gone: "öljylämmitys vaihdettu maalämpöön 2015".
  const GONE = /vaihdettu|vaihtui|vaihdettiin|poistettu|purettu|luovuttu|korvattu|öljystä|replaced|removed|switched|converted/;
  function heating(P) {
    const fromField = field(P, "lämmitysjärjestelmän kuvaus|lämmitysjärjestelmä|lämmitystapa|lämmitys|heating system|heating", (s) => {
      const t = s.toLowerCase();
      const hit = HEAT.filter(([, re]) => re.test(t)).map(([k]) => k);
      return hit.length ? hit : null;
    });
    const found = new Set(fromField ?? []);
    let oilGone = false;
    for (const [k, re] of HEAT) {
      const s = said(P, re);
      const live = s.yes.filter((c) => !(k === "oil" && GONE.test(c.toLowerCase())));
      if (k === "oil" && s.yes.length && !live.length) oilGone = true;
      if (live.length && !fromField) found.add(k);
      if (k === "oil" && live.length) found.add(k);
    }
    if (oilGone && !said(P, /öljykattila|öljypoltin|öljylämmitys(?! vaihd)/).yes.some((c) => !GONE.test(c.toLowerCase()))) found.delete("oil");
    if (found.has("direct electric") || found.has("storage electric")) found.delete("electric");
    return { kinds: [...found], oilGone: oilGone && !found.has("oil") };
  }

  const FOUNDATIONS = [
    ["false plinth", /valesokkel|false plinth/],
    ["crawl space", /rossipohja|tuulettuva alapohja|ryömintätila|crawl ?space/],
    ["slab on ground", /maanvarainen (?:betoni)?laatta|maanvarainen alapohja|maanvarainen betonilaatta|slab[- ]on[- ]ground|ground slab/],
    ["basement", /(?<!\p{L})(?:osa)?kellari(?:kerros|tila|n|ssa|in|lla|llinen)?(?!\p{L})|(?<!\p{L})basement(?!\p{L})/u],
  ];
  const ROOF_TYPES = [["flat", /tasakatto|flat roof/], ["mono-pitch", /pulpettikatto|mono-?pitch|shed roof/], ["hip", /aumakatto|hip roof|hipped/],
    ["mansard", /mansardi/], ["gable", /harjakatto|satulakatto|gable/]];
  const ROOF_MATERIALS = [["sheet metal", /pelti|konesaumattu|lukkopontti|steel|sheet metal|metal roof/], ["felt", /huopa|kermi|bitumi|felt|bitumen/],
    ["tile", /tiili|tile/]];
  const ROOF = /(?<!\p{L})(?:vesi)?kat(?:to|on|ot|ossa|toa|e|teen)|vesikat|katemateriaali|roof/u;
  const DRAINS = /salaoj|foundation drain|perimeter drain|(?<!\p{L})drainage(?!\p{L})/u;

  const OWN_WW = [["holding tank", /umpisäiliö|umpikaivo|holding tank|sealed tank/], ["small treatment plant", /pienpuhdistamo|biopuhdistamo|panospuhdistamo|(?<!\p{L})puhdistamo(?!\p{L})|small treatment plant|package treatment plant/u],
    ["septic tanks", /saostuskaiv|sakokaiv|septic tank/], ["soil filter", /maasuodat|soil filter|sand filter/], ["soil infiltration", /imeytyskenttä|imeyttämö|maaperäkäsittely|infiltration field|soakaway/],
    ["dry toilet", /kuivakäymälä|kompostikäymälä|kompostoiva käymälä|dry toilet|composting toilet/]];
  const MUNI_WW = /kunnallisviemär|kunnan viemär|kunnallinen viemär|kunnallistekniikka|viemäriverkko|liitetty (?:kunnan )?viemäriin|viemäröinti: kunnallinen|municipal sewer|mains sewer|public sewer|sewer network|kunnallinen vesi ja viemäri|municipal water and sewer|mains water and sewer/;
  function wastewater(P) {
    const v = field(P, "viemäri|viemäröinti|jätevesi|jätevedet|jätevesijärjestelmä|vesi ja jätevesi|wastewater|sewage|sewer", (s) => {
      const t = s.toLowerCase();
      const own = OWN_WW.filter(([, re]) => re.test(t)).map(([k]) => k);
      if (own.length) return { type: "own", systems: own };
      if (/^kunna|kunnallis|kunnan|municipal|public|mains/.test(t)) return { type: "municipal", systems: [] };
      return null;
    });
    if (v) return v;
    const own = OWN_WW.filter(([, re]) => said(P, re).yes.length).map(([k]) => k);
    if (own.length) return { type: "own", systems: own };
    if (said(P, MUNI_WW).yes.length) return { type: "municipal", systems: [] };
    return null;
  }
  const WELL = /porakaivo|rengaskaivo|kaivovesi|oma kaivo|(?<!\p{L})kaivo(?:sta|n)?(?!\p{L})|lähdevesi|drilled well|dug well|own well|well water|private well/u;
  function water(P) {
    const kindOf = (t) => /porakaivo|drilled/.test(t) ? "drilled well" : /rengaskaivo|dug well/.test(t) ? "dug well" : WELL.test(t) ? "well"
      : /kunnallisvesi|kunnan vesi|kunnallinen vesi|vesiosuuskun|vesijohtoverkko|municipal water|mains water|water (?:network|utility)/.test(t) ? "municipal"
      : /kantovesi|ei juoksevaa vettä|no running water|carried water/.test(t) ? "carried" : /järvivesi|merivesi|lake water/.test(t) ? "lake" : null;
    const v = field(P, "vesijohto|vesihuollon kuvaus|vesihuolto|talousvesi|vesi|water supply|water", (s) => kindOf(s.toLowerCase()));
    if (v) return v;
    for (const re of [/porakaivo|rengaskaivo|drilled well|dug well/, WELL, /kunnallisvesi|kunnan vesi|kunnallinen vesi|vesiosuuskun|municipal water|mains water/, /kantovesi|no running water|carried water/, /järvivesi|lake water/]) {
      const hit = said(P, re).yes[0];
      if (hit) return kindOf(hit.toLowerCase());
    }
    return /ei juoksevaa vettä|no running water/i.test(P.text) ? "carried" : null;
  }
  const INSPECTION = /kuntotarkast|kuntokartoitu|condition (?:inspection|survey|report)|pre-purchase inspection|home inspection|building survey/;
  function conditionInspection(P) {
    const v = field(P, "kuntotarkastus|kuntotarkastettu|kuntokartoitus|condition inspection", (s) => {
      const t = s.toLowerCase();
      if (/^(?:ei|no)(?!\p{L})/u.test(t)) return { done: false, year: null };
      if (/^(?:kyllä|tehty|on tehty|yes|done)|\d/.test(t)) return { done: true, year: lastYear(t) };
      return null;
    });
    if (v) return v;
    const s = said(P, INSPECTION);
    const done = s.yes.find((c) => !PLANNED.test(c.toLowerCase()) && (/tehty|tehtiin|teetetty|teetettiin|valmistunut|saatavilla|nähtävillä|liitteenä|done|carried out|available|attached|\d{4}/.test(c.toLowerCase())));
    if (done) return { done: true, year: lastYear(done) };
    if (s.no.length) return { done: false, year: null };
    if (s.yes.some((c) => PLANNED.test(c.toLowerCase()))) return { done: null, planned: true, year: null };
    return null;
  }
  const MOIST = /kosteusvauri|kosteusvahin|kosteusongelm|kosteusjälk|kosteusläikk|kohonne\p{L}* kosteu|kosteutta|kosteus(?:ta|a)? (?:havait|löyty|todett)|vesivahin|vesivauri|vuotovahin|vuotanut|(?<!\p{L})vuoto(?!\p{L})|(?<!\p{L})hometta|(?<!\p{L})homeen|homevauri|homehaju|homeongelm|mikrobivauri|mikrobikasvu|(?<!\p{L})mou?ld(?:y)?(?!\p{L})|moisture damage|damp(?:ness)?(?!\p{L})|water damage|(?<!\p{L})leak(?:ed|s|ing|age)?(?!\p{L})/u;
  const ENERGY = (s) => {
    const t = s.trim();
    if (/^ei (?:lain edellyttämää|energiatodistusta)|^not required|^no (?:energy )?certificate/i.test(t)) return { cls: null, none: true };
    const m = t.match(/^(?:energialuokka:?\s*)?([A-G])(?:\s*\(?\s*(2007|2013|2018)\s*\)?)?(?![\p{L}\d])/u) ?? t.match(/energialuokka:?\s*([A-G])\s*\(?(2007|2013|2018)?/iu);
    return m ? { cls: m[1].toUpperCase(), version: m[2] ? +m[2] : null } : null;
  };
  // Every Finnish municipality we have data for (STUK's radon table), so a house in Muurame or Sotkamo is placed too.
  const MUNIS = Object.keys(F.radon?.m ?? {});
  const MUNI_RE = MUNIS.length ? new RegExp(String.raw`(?<![\p{L}\d-])(${[...MUNIS, ...Object.keys(F.radon?.alias ?? {})].sort((a, b) => b.length - a.length).map(reEsc).join("|")})(?![\p{L}\d-])`, "u") : null;
  function municipality(P) {
    const known = (s) => { const m = MUNI_RE && s.match(MUNI_RE); return m ? F.radon.alias?.[m[1]] ?? m[1] : null; };
    return city(P) ?? field(P, "sijainti|kunta|municipality|kaupunki|paikkakunta|location", known) ?? P.lines.slice(0, 6).map(known).find(Boolean) ?? null;
  }

  function readHouse(P) {
    const h = { kind: "house" };
    h.cottage = houseKind(P) === "cottage";
    h.buildingYear = builtIn(P);
    h.livingAreaM2 = either(P, "asuintilojen pinta-ala|asuinpinta-ala|asuinala|huoneistoala|living area", pArea) ?? livingArea(P);
    h.plotAreaM2 = either(P, "tontin pinta-ala|tontin koko|tontin ala|tontti|plot area|plot size|lot size|plot|lot", pPlot);
    const own = (s) => /^(?:oma|omistus|own|owned|freehold)(?!\p{L})/iu.test(s.trim()) ? "own" : /^(?:vuokra|vuokralla|leased|rented|leasehold)/i.test(s.trim()) ? "leased" : null;
    h.plot = field(P, "tontin omistus|tontin omistusmuoto|plot ownership|plot owned", own)
      ?? (/vuokratontti|vuokratontilla|tontti (?:on )?vuokralla|leased plot|plot is leased|rented plot|(?:tontti|plot)(?:\s+[\d ,.]+\s*(?:m²|m2|ha))?,?\s+(?:vuokralla|vuokra|leased)(?!\p{L})/iu.test(P.text) ? "leased"
        : /oma tontti|omalla tontilla|(?:tontti|plot)(?:\s+[\d ,.]+\s*(?:m²|m2|ha))?,?\s+(?:oma|own|owned)(?!\p{L})|own plot|plot is owned/iu.test(P.text) ? "own" : null);
    h.plotRent = h.plot === "leased" ? either(P, "tontin vuokra|tonttivuokra|maanvuokra|plot rent|ground rent", pYearly) : null;
    h.price = either(P, "myyntihinta|velaton hinta|pyyntihinta|hinta|asking price|selling price|price", pMoney);
    h.city = municipality(P);
    h.district = district(P, h.city);
    if (h.district && (HOUSE_TYPES.some(([, re]) => re.test(h.district.toLowerCase())) || /myydään|for sale/i.test(h.district))) h.district = null;
    h.rooms = rooms(P);
    const w = said(P, /talviasuttava|ympärivuoti|talvikäyttö|talvikunto|winteri[sz]ed|year-round|all[- ]year|winter use/);
    h.winterUse = w.no.length || /kesäkäyttöön|vain kesä|summer use only/i.test(P.text) ? false : w.yes.length ? true : null;
    // Road: Etuovi's "Tie perille" (road to the door), a private road and its road association, or water access only.
    h.roadAccess = field(P, "tie perille|tieyhteys|road access|road to the property", (s) => /^(?:kyllä|on|yes)/i.test(s) ? true : /^(?:ei|no)(?!\p{L})/iu.test(s) ? false : null)
      ?? (/ei tieyhteyttä|ei tietä perille|vain vesitse|veneellä perille|no road access|access by boat|reached by boat/i.test(P.text) ? false : null);
    h.privateRoad = said(P, /yksityistie|tiekun|tiehoitokun|tieosaka|tiemaksu|private road|road association|road fee/).yes.length ? true : null;
    h.roadFee = either(P, "tiemaksu|tiekuntamaksu|tienhoitomaksu|road fee|road maintenance fee", pYearly);
    h.shore = said(P, /rantatontti|oma ranta|rantaan|rannalla|ranta-asemakaava|rantayleiskaava|lakeside|lake shore|seaside|waterfront|shoreline|own beach/).yes.length ? true : null;
    h.groundwaterArea = said(P, /pohjavesialue|groundwater area/).yes.length ? true : null;
    const heat = heating(P);
    h.heating = heat.kinds;
    h.oilGone = heat.oilGone || null;
    const tank = said(P, /öljysäiliö|öljysäiliön|oil tank/).yes;
    h.oilTank = tank.length ? {
      place: tank.some((c) => /maanalai|maan alla|maahan|underground|buried/.test(c.toLowerCase())) ? "underground" : tank.some((c) => /sisä|kellarissa|indoor|inside|basement/.test(c.toLowerCase())) ? "indoors" : null,
      removed: tank.some((c) => GONE.test(c.toLowerCase())) || null,
      inspected: lastYear(tank.find((c) => /tarkast|inspected/.test(c.toLowerCase())) ?? "") ?? (tank.some((c) => /tarkast|inspected/.test(c.toLowerCase())) ? true : null),
    } : null;
    const oilUse = P.text.match(new RegExp(String.raw`(${NUM})\s*(?:l|litraa|litres|liters)\s*(?:\/\s*(?:v|vuosi|vuodessa|year|yr)|vuodessa|a year|per year)`, "iu"));
    h.oilLitresYear = oilUse && /öljy|oil/i.test(P.text) ? toNum(oilUse[1]) : null;
    const kwh = clauses(P).map((c) => c.match(new RegExp(String.raw`(${NUM})\s*kwh\s*(?:\/\s*(?:v|vuosi|vuodessa|year|yr)(?!\s*\/)|vuodessa|a year|per year)`, "iu"))).find(Boolean);
    h.energyKwhYear = kwh ? toNum(kwh[1]) : null;
    h.heatingCostYear = either(P, "sähkölämmityskulut|lämmityskulut|lämmityskustannukset|lämmityksen kustannukset|heating costs?|annual heating cost", pYearly);
    h.propertyTaxYear = either(P, "kiinteistövero|property tax", pYearly);
    h.foundation = FOUNDATIONS.filter(([, re]) => said(P, re).yes.length).map(([k]) => k);
    const plinthFixed = said(P, /valesokkel/).yes.find((c) => /korjattu|korjattiin|poistettu|purettu|repaired|fixed|removed/.test(c.toLowerCase()));
    h.plinthRepaired = plinthFixed ? lastYear(plinthFixed) ?? true : null;
    const roofField = (list) => (s) => list.find(([, re]) => re.test(s.toLowerCase()))?.[0] ?? null;
    h.roofType = field(P, "kattotyyppi|katon tyyppi|kattotyypin kuvaus|roof type", roofField(ROOF_TYPES))
      ?? ROOF_TYPES.find(([, re]) => said(P, re).yes.length)?.[0] ?? null;
    h.roofMaterial = field(P, "kattomateriaali|kattomateriaalin kuvaus|katemateriaali|vesikate|roof material|roofing", roofField(ROOF_MATERIALS))
      ?? ROOF_MATERIALS.find(([k, re]) => said(P, re).yes.some((c) => ROOF.test(c.toLowerCase())))?.[0] ?? null;
    const renewedIn = (re) => {
      const hits = said(P, re).yes.filter((c) => { const t = c.toLowerCase(); return RENEWED.test(t) && !PLANNED.test(t) && !(UPKEEP.test(t) && !/uusittu|uusittiin|vaihdettu|renewed|replaced|new/.test(t)); });
      if (!hits.length) return null;
      const ys = hits.map(lastYear).filter(Boolean);
      return ys.length ? Math.max(...ys) : true;
    };
    h.roofRenewed = renewedIn(ROOF);
    h.drainsRenewed = renewedIn(DRAINS);
    h.wastewater = wastewater(P);
    h.water = water(P);
    h.inspection = conditionInspection(P);
    h.moisture = said(P, MOIST).yes.filter((c) => !/kosteusmittaus(?:\p{L}*) tehty|vakuutus|insurance|vuotovahinkovakuutus/u.test(c.toLowerCase())).map((c) => c.slice(0, 140));
    h.energy = field(P, "energialuokka|energiatodistus|energy class|energy rating|energy certificate", ENERGY);
    const asb = field(P, "asbestikartoitus|asbestos survey", (s) => /^(?:ei|no)(?!\p{L})/iu.test(s) ? false : /^(?:kyllä|tehty|on|yes|done)|\d/i.test(s) ? true : null);
    const asbS = said(P, /asbesti|asbestos/);
    h.asbestosSurvey = asb ?? (asbS.yes.some((c) => /kartoitus|kartoitettu|survey/.test(c.toLowerCase())) ? true : null);
    h.asbestosFound = asbS.yes.some((c) => /sisältää|sisältävi|löyty|todettu|havaittu|contains|found/.test(c.toLowerCase())) ? true : null;
    return h;
  }

  /* ---------- motorcycles ---------- */
  // Makes that build two-wheelers; Honda, Suzuki, BMW and Peugeot build cars too.
  const BIKE_ONLY = ["Yamaha", "Kawasaki", "Ducati", "KTM", "Harley-Davidson", "Triumph", "Aprilia", "Husqvarna", "Royal Enfield", "Moto Guzzi", "MV Agusta",
    "Benelli", "CFMoto", "Piaggio", "Vespa", "Kymco", "SYM", "Hyosung", "Keeway", "Rieju", "Derbi", "Husaberg", "Junak", "Tunturi", "Solifer", "Baotian"];
  const BIKE_BOTH = ["Honda", "Suzuki", "BMW", "Peugeot"];
  const BIKE_NAMES = { ...Object.fromEntries([...BIKE_ONLY, ...BIKE_BOTH].map((m) => [fold(m), m])), harley: "Harley-Davidson", "harley davidson": "Harley-Davidson", "cf moto": "CFMoto" };
  const BIKE_RE = new RegExp(String.raw`(?<![a-z0-9])(${Object.keys(BIKE_NAMES).sort((a, b) => b.length - a.length).map(reEsc).join("|")})(?![a-z0-9])`, "g");
  const ccOf = (P) => { const m = P.text.match(/(?<![\d.,])(\d{2,4}) ?(?:cc|cm³|cm3|ccm|kuutiota)(?![\p{L}\d])/iu); return m ? +m[1] : null; };

  // Motorcycle, moped, snowmobile or ATV. The ad's own class field decides first. Otherwise only singular
  // words in the title area count: Nettimoto's menu lists every class in the plural ("Mopot", "Mönkijät").
  function vehicleClass(P, car) {
    if (car.modelKey) return null;
    const cls = field(P, "ajoneuvolaji|ajoneuvoluokka|vehicle class|vehicle category", (s) => {
      const t = s.toLowerCase();
      return /moottoripyörä|motorcycle|motorbike/.test(t) ? "moto" : /mopo|moped/.test(t) ? "moped"
        : /moottorikelkka|snowmobile/.test(t) ? "snowmobile" : /mönkijä|atv|quad/.test(t) ? "atv" : null;
    });
    if (cls) return cls;
    const head = P.lines.slice(0, 8).join("\n").toLowerCase();
    if (/(?<!\p{L})(?:moottorikelkka|snowmobile|ski-doo|lynx)(?!\p{L})/u.test(head)) return "snowmobile";
    if (/(?<!\p{L})(?:mönkijä|atv|quad)(?!\p{L})/u.test(head)) return "atv";
    const cc = ccOf(P);
    const make = [...fold(P.text).matchAll(BIKE_RE)][0]?.[1];
    const onlyBikes = make && !BIKE_BOTH.map(fold).includes(make);
    const words = /(?<!\p{L})(?:moottoripyörä|motorcycle|motorbike|skootteri|scooter|katupyörä|kevari|enduro)(?!\p{L})/u.test(head);
    if (/(?<!\p{L})(?:mopo|mopedi|moped|mopoauto)(?!\p{L})/u.test(head) || /(?<!\p{L})am[- ]?(?:kortti|ajokortti|licen[cs]e)/u.test(P.low)
      || ((onlyBikes || words) && cc != null && cc <= 50)) return "moped";
    if (onlyBikes || words || (make && cc != null)) return "moto";
    return null;
  }

  const MODS = [["lowered suspension", /madallet|madallus|lowered|lowering|lyhennetyt jouset|matalammat jouset/],
    ["aftermarket exhaust", /akrapovic|yoshimura|termignoni|leovince|sc-project|tehoputki|aftermarket exhaust|sport exhaust|race exhaust/],
    ["engine changes", /viritetty|viritys|(?<!\p{L})tuned|derestrict|rajoitin poistettu|rajoittimet poistettu/u]];
  // Licence class as a fact about the bike: up to 125 cm³ and 11 kW is A1; up to 35 kW is A2; more is A.
  function licenceOf(cc, kw, hp) {
    const k = kw ?? (hp ? Math.round(hp * 0.7457) : null);
    if (cc == null && k == null) return null;
    if (cc != null && cc <= 125 && (k == null || k <= 11)) return "A1";
    return k != null ? (k <= 35 ? "A2" : "A") : null;
  }

  function readMoto(P) {
    const c = readCar(P); // year, km, price, seller, place and inspection are read the same way as for cars
    const hit = [...fold(P.text).matchAll(BIKE_RE)][0];
    let model = null;
    if (hit) {
      const end = P.text.indexOf("\n", hit.index);
      let rest = P.text.slice(hit.index + hit[0].length, end < 0 ? undefined : end).trim();
      if (!rest && end >= 0) rest = P.text.slice(end + 1).split("\n")[0].trim(); // Nettimoto puts the model on the next line
      rest = rest.split(/[,(|•●;:]| [-–] |\s(?:19|20)\d\d(?!\d)|\s\d{2,4} ?(?:cc|cm³|cm3|ccm)(?![\p{L}\d])|\s\d[\d ]* ?km(?!\p{L})/u)[0].trim();
      if (rest && rest.length <= 30 && !/^(?:ilmoitus|myydään|for sale)$/i.test(rest)) model = rest;
    }
    const m = { make: hit ? BIKE_NAMES[hit[1]] : null, model, year: c.year, km: c.km, price: c.price, previousPrice: c.previousPrice,
      officeFee: either(P, "toimistomaksu|office fee|toimituskulut", pMoney), city: c.city, lastInspection: c.lastInspection, flags: { serviceBook: c.flags.serviceBook } };
    m.engineCc = ccOf(P);
    m.powerKw = c.powerKw;
    m.powerHp = c.powerHp;
    m.sellerType = c.sellerType ?? (/(?:moottoripyörä|moto|mp)[- ]?liike|(?<!\p{L})dealer(?!\p{L})|(?<!\p{L})(?:liike|kauppa)(?!\p{L})/u.test(P.low) ? "dealer" : null);
    m.licence = licenceOf(m.engineCc, m.powerKw, m.powerHp);
    m.abs = /(?:ei|ilman|no|without) abs/i.test(P.text) ? false : /(?<!\p{L})abs(?!\p{L})/iu.test(P.text) ? true : null;
    m.modifications = MODS.filter(([, re]) => re.test(P.low)).map(([w]) => w);
    m.modified = m.modifications.length ? true : null;
    return m;
  }

  /* ---------- what kind of ad is this ---------- */
  function kindOf(P, car) {
    const t = P.low;
    const count = (res) => res.reduce((n, re) => n + (re.test(t) ? 1 : 0), 0);
    const home = count([/velaton hinta|debt[- ]free price/, /myyntihinta|selling price/, /velkaosuus|lainaosuus|loan share|debt share/,
      /hoitovastike|maintenance charge/, /yhtiövastike|rahoitusvastike|pääomavastike|capital charge|financing charge/, /myytävät asunnot|omistusasunto|osakehuoneisto|for sale/]);
    const rent = count([/vuokra\s*\/\s*kk|(?:^|\n)vuokra(?:\n|\s+\d)|kuukausivuokra|monthly rent|(?:^|\n)rent(?:\n|:|\s+\d|\s+€)/, /vuokrataan|vuokra-asunnot|for rent|to rent|to let(?!\p{L})/u,
      /(?:^|\n)vakuus(?!\p{L})|vuokravakuus|takuuvuokra|(?<!\p{L})deposit(?!\p{L})/u, /vuokranantaja|lessor|landlord|vuokralainen|tenant/, /vuokrasopimus|vuokranmaksupäivä|rent payment|(?<!\p{L})lease(?!\p{L})|rental (?:number|agreement|contract)/u]);
    const carish = count([/mittarilukema|mileage|ajettu|\d\s?(?:km|tkm)(?![\p{L}\/])/u, /vuosimalli|year model|model year|ensirek|first reg/, /vaihteisto|gearbox|automaatti|manuaali|automatic|manual/,
      /katsastettu|inspected|inspection date|katsastus/, new RegExp(`diesel|bensiini|petrol|hybrid|polttoaine|käyttövoima|fuel|${ELECTRIC.source}`, "u"), /rekisterinumero|registration number|vetotapa|drive type|korimalli|henkilöauto/]);
    // A house or cottage sold as real estate has no housing company: the buyer owns the building and the land (readHouse).
    if (houseKind(P)) return "house";
    if (home >= 2 && home >= rent) return "home";
    if (rent >= 2 && rent > home) return "rent";
    if (vehicleClass(P, car) === "moto") return "moto";
    if (car.make && carish >= 2) return "car";
    if (carish >= 4) return "car";
    if (home >= 1 && home > rent) return "home";
    if (rent >= 1) return "rent";
    return null;
  }
  function unsupported(P, car) {
    const head = P.lines.slice(0, 6).join("\n").toLowerCase();
    const hasCharges = /hoitovastike|yhtiövastike|maintenance charge/.test(P.low);
    if (car.modelKey) return null; // a known car model wins over a stray "moottoripyörät" in the site's menu
    const cls = vehicleClass(P, car);
    if (cls === "moped") return "a moped, and mopeds";
    if (cls === "snowmobile") return "a snowmobile, and snowmobiles";
    if (cls === "atv") return "an ATV, and ATVs";
    if (houseKind(P)) return null; // a cottage "reached by boat" is a cottage
    if (/(?<!\p{L})(?:vene|veneet|purjevene|moottorivene|perämoottori|boat|sailboat|outboard)(?!\p{L})/u.test(head)) return "a boat, and boats";
    if (/matkailuauto|asuntovaunu|asuntoauto|caravan|motorhome|camper/.test(head)) return "a motorhome or caravan, and those";
    // Houses and cottages are read (readHouse); a plot with nothing built on it is not.
    if (!hasCharges && plotOnly(P) && !/vuokra|for rent|(?<!\p{L})rent(?!\p{L})/u.test(head)) return "a building plot, and plots";
    return null;
  }
  const SITES = [[/nettiauto/i, "Nettiauto"], [/autotalli/i, "Autotalli"], [/etuovi/i, "Etuovi"], [/oikotie/i, "Oikotie"], [/vuokraovi/i, "Vuokraovi"],
    [/nettimoto/i, "Nettimoto"], [/nettivene/i, "Nettivene"], [/tori\.fi/i, "Tori"]];

  /* ---------- a link instead of the ad (D-031) ---------- */
  // No server opens ad pages: Nettiauto answers anything but a browser with a Cloudflare challenge, and Alma's Nettix
  // API needs a partner's credentials. So a pasted link gets help to bring the ad's text over from the person's own
  // browser, where the ad is already open, and the link itself goes nowhere.
  const LINK_TEXT_MAX = 15000;
  function adLink(raw) {
    const P = prep(raw);
    if (P.lines.length > 3 || !/https?:\/\/|www\./i.test(P.text)) return null;
    const site = SITES.find(([re]) => re.test(P.text))?.[1] ?? null;
    const m = P.text.match(/(?:https?:\/\/|www\.)[^\s<>"'`]+/i);
    let url = null;
    try {
      const u = new URL(/^www\./i.test(m[0]) ? `https://${m[0]}` : m[0]);
      if (/^https?:$/.test(u.protocol)) url = u.href;
    } catch {}
    return { url, site };
  }
  // The bookmarklet the person keeps in their browser's bookmarks bar. Clicked on an ad's page, it takes the text they
  // selected, or else the page's main text, and opens What if… in a new tab with that text after "#ad=". A URL's
  // fragment is never sent to any server, and noreferrer keeps the ad's address from going with the page request.
  function bookmarklet(appUrl) {
    const code = `(function(){var s=String(getSelection()||"").trim(),m=document.querySelector("main"),`
      + `t=s.length>=30?s:m&&m.innerText.trim().length>=200?m.innerText:document.body.innerText;`
      + `window.open(${JSON.stringify(String(appUrl).replace(/#.*$/, ""))}+"#ad="+encodeURIComponent(t.trim().slice(0,${LINK_TEXT_MAX})),"_blank","noopener,noreferrer")})()`;
    return `javascript:${encodeURIComponent(code)}`;
  }
  // What the bookmarklet handed over: the ad's text from "#ad=…", or null.
  function adFromHash(hash) {
    const m = String(hash ?? "").match(/^#?ad=([\s\S]*)$/);
    if (!m) return null;
    let t;
    try { t = decodeURIComponent(m[1]); } catch { return null; }
    t = t.slice(0, LINK_TEXT_MAX).trim();
    return t || null;
  }

  /* ---------- the rules: what to ask, what it costs, who pays ---------- */
  const READS = "This version reads used cars and motorcycles (Nettiauto, Autotalli, Nettimoto), flats, houses and cottages for sale (Etuovi, Oikotie) and flats to rent (Vuokraovi, Oikotie).";
  const nf = "<i>not in the ad</i>";
  const shown = (v, f = (x) => x) => (v == null || v === "" ? nf : f(v));

  function inspectionFor(c) {
    const y = c.year;
    const rows = c.modelKey ? DATA.m[c.modelKey] : null;
    let row = null, ry = null;
    if (rows && y) for (const d of [0, -1, 1, -2, 2]) if (rows[y + d]) { row = rows[y + d]; ry = y + d; break; }
    const avgYear = ry ?? y;
    return { row, ry, avg: avgYear ? DATA.avg[avgYear] ?? null : null, avgYear, make: !row && y && c.make ? DATA.mk[fold(c.make)]?.[y] ?? null : null };
  }

  const FUEL_WORDS = { "hybrid-petrol": "petrol hybrid", "hybrid-diesel": "diesel hybrid" };
  // Traficom model keys that are electric only, each with the maker's page (data/powertrain-models.json).
  const EV_KEYS = new Set(F.ev);

  /* Vehicle tax for 365 days under the 2026 rates (Vehicle Tax Act 1281/2003): basic tax by CO2 (Table 1 NEDC,
     Table 1 A WLTP) or by total mass (Table 2, cars first used before 2001), plus the motive-power tax per started
     100 kg of total mass for diesel, electric and plug-in hybrid cars. Rounded down to the cent, as the act says.
     Nothing is guessed: a missing input gives { need: [...] }; a CO2 figure without its method gives both amounts
     when the tables differ. Returns { eur, base, motive } in euros a year. */
  function vehicleTax({ fuel, co2, co2Method, firstUse, year, totalMassKg, plugInOf }) {
    const T = F.tax;
    const need = [];
    const motiveRate = fuel === "petrol" ? 0 : fuel === "diesel" ? T.motive.diesel : fuel === "electric" ? T.motive.electric
      : fuel === "plug-in hybrid" && plugInOf ? (plugInOf === "diesel" ? T.motive.plugInHybridDiesel : T.motive.plugInHybridPetrol) : null;
    // Our tables have no motive-power rate for an ordinary (not plug-in) hybrid or for gas cars: those go to the calculator.
    if (motiveRate == null) return fuel && fuel !== "plug-in hybrid" ? { uncovered: true } : { need: ["fuel"] };
    if (motiveRate && totalMassKg == null) need.push("mass");
    const fu = firstUse ? { y: +firstUse.slice(0, 4), ym: firstUse.slice(0, 7), full: firstUse.length === 10 ? firstUse : null } : null;
    // Basic tax in cents a day: one value, or one per CO2 method when the ad doesn't say which.
    let base = null;
    if (fuel === "electric") {
      // The lowest amount of the table, plus the extra for cars first used on or after 1.10.2021.
      const after = !fu ? null : fu.full ? fu.full >= T.evFrom : T.evFrom.endsWith("-01") ? fu.ym >= T.evFrom.slice(0, 7) : null;
      if (after == null) need.push("firstUse");
      else base = { one: Math.min(...T.nedc) + (after ? T.evExtra : 0) };
    } else {
      const from = fu ? fu.y : year ? year - 1 : null; // a model year Y car was first used in Y − 1 at the earliest
      const byMass = () => { const r = T.mass.find(([max]) => max == null || totalMassKg <= max); return { one: r[1] }; };
      const table1 = from != null && (from >= 2002 || (fu && fu.y === 2001 && totalMassKg != null && totalMassKg <= 2500));
      const table2 = fu && (fu.y <= 2000 || (fu.y === 2001 && totalMassKg != null && totalMassKg > 2500));
