:root {
  --ground: #f6f2ee;       /* If's warm off-white */
  --card: #ffffff;
  --ink: #331e11;          /* If's dark brown text */
  --muted: #74655a;
  --line: #e7dfd7;
  --blue: #0054f0;         /* If blue: actions, links, insurance */
  --blue-ink: #ffffff;
  --blue-soft: #eaf0fe;    /* the what-if note */
  --sand: #efe7de;         /* quiet fills, chart track */
  --risk: #e08a2c;         /* money you might have to pay later */
  --run: #b9a998;          /* running costs: charges, services, inspections */
  --pay-bg: #fbeadb;       /* "you pay" label */
  --pay-ink: #8a4a12;
  --bad: #c2412d;
  --good: #2f7d4f;
  --font: "Figtree", "Avenir Next", Avenir, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 400 17px/1.55 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 56px;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 460px; margin-inline: auto; display: grid; gap: 24px; }
button, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px; }
.mark { font: 800 24px/1 var(--font); letter-spacing: -0.01em; display: inline-flex; align-items: baseline; gap: 1px; }
.lights { display: inline-flex; gap: 3px; margin-left: 3px; }
.lights i { width: 5px; height: 5px; border-radius: 50%; background: var(--blue); display: block; }
.from { font: 600 14px/1 var(--font); color: var(--muted); }
.back { justify-self: start; background: none; border: 0; padding: 6px 0; font: 600 16px/1 var(--font); color: var(--blue); cursor: pointer; }

/* Type */
h1, h2, h3 { font-family: var(--font); margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
h1 { font-size: clamp(34px, 9.5vw, 44px); line-height: 1.06; font-weight: 800; }
h2 { font-size: 24px; line-height: 1.2; font-weight: 700; }
h3 { font-size: 20px; line-height: 1.25; font-weight: 700; }
p { margin: 0; }
.lead { color: var(--muted); font-size: 18px; max-width: 34ch; }
.eyebrow { font: 600 15px/1.2 var(--font); color: var(--muted); }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 14px; }

/* Input */
.fieldrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
label.field { font: 600 15px/1.2 var(--font); color: var(--ink); }
.textbtn { background: none; border: 0; padding: 4px 0; font: 600 15px/1.2 var(--font); color: var(--blue); cursor: pointer; }
textarea {
  width: 100%; resize: vertical; min-height: 170px; padding: 14px 16px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  font: 400 16px/1.55 var(--font); color: var(--ink);
}
textarea::placeholder { color: var(--muted); }
textarea.short { min-height: 84px; }
.examples { display: grid; gap: 8px; }
.chip {
  display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 12px; text-align: left;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 16px; cursor: pointer; color: var(--ink);
}
.chip .cat { grid-column: 1; font: 600 13px/1.3 var(--font); color: var(--muted); }
.chip > span:nth-child(2) { grid-column: 1; grid-row: 2; font: 600 16px/1.3 var(--font); }

","lockRequired":true,"excessEur":200,"source":["if-moto-guide","if-kasko"],"where":"If guide p. 3 and 8; If AUT 640.35, 3.2–3.2.1"},"wear":{"rule":"Wear and other slowly developing damage isn’t covered.","source":"if-kasko","where":"If AUT 640.35, section 4 kohdat 2–3"}},"outOfUse":{"rule":"A bike can be taken out of traffic use for the winter. At If, its theft, fire and vandalism cover stays on while it’s stored.","ridingWhileOut":"Riding it while it’s out of traffic use can cost up to three times the traffic insurance premium.","source":["if-out-of-use","traficom-out-of-use","lvl"],"where":"If's page on liikennekäytöstäpoisto; Traficom; LVL 8 § and 22 §"},"vehicleTax":{"taxed":false,"note":"Motorcycles pay no annual vehicle tax · Vehicle Tax Act 1281/2003, 4 §","source":"avl","quoteFi":"Ajoneuvoveroa on suoritettava rekisteriin merkityistä luokkiin M ja N kuuluvista ajoneuvoista."},"abs":{"over125From":"2017-01-01","newTypesFrom":"2016-01-01","upTo125":"ABS or combined brakes","exempt":"enduro and trial bikes","source":"eu-168","where":"Regulation (EU) 168/2013, Annex VIII and Annex IV 2.3.3","effect":{"text":"A European study found that ABS cut injury crashes by 24–34% and severe or fatal ones by 34–42%.","short":"Rizzi et al. 2015","source":"rizzi-2015"}},"newOwner":{"rule":"Traffic insurance is the new owner’s duty from the day of the sale: the seller’s covers only the first seven days.","registerDays":7,"source":["traficom-new-owner","lvl","ajl"],"where":"Ajoneuvolaki 84 § 5 mom; LVL 6 § and 18 §"}}}}</script>

<script>
"use strict";

/* engine:start */
/* The ad reader and the rules. No AI: patterns read the ad, Traficom's statistics and the renovation and
   lease rules turn it into the same result the curated examples use. Pure functions of the text and DATA,
   so test/reader.test.mjs runs this block in Node. Every value taken from the ad is escaped before it is
   put into the result, because the result is rendered as HTML. */
function createEngine(DATA, today) {
  const NOW = today || new Date();
  const YEAR = NOW.getFullYear();
  const F = DATA.facts;

  /* ---------- formatting ---------- */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const fold = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const grp = (n) => Math.round(n).toLocaleString("en-GB");
  const eur = (n) => "€" + grp(n);
  const eurc = (n) => "€" + (Math.round(n) === n ? grp(n) : n.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
  const sq = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(1)) + " m²";
  const near = (n, step) => Math.round(n / step) * step;
  // "a, b and c", with a comma before "and" when an item has its own "and" ("springs and shock absorbers, brakes, and …").
  const and = (a) => (a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + (a.length > 2 && a.some((x) => / and /.test(x)) ? ", and " : " and ") + a[a.length - 1]);
  const uniq = (a) => [...new Set(a)];
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------- sources ---------- */
  const SRC = {
    trafi: { text: `Traficom: periodic inspection statistics ${DATA.trafi.year}, by model and first registration year`, url: DATA.trafi.url },
    lookup: { text: "Traficom: check a vehicle’s details", url: "https://traficom.fi/fi/autoilijat/ajoneuvon-osto-ja-myynti/tarkista-ajoneuvon-tiedot" },
    fee: { text: `Traficom: inspection prices in ${F.inspectionFee.year} (Katsastusalan tilannekatsaus 2025)`, url: F.inspectionFee.url },

    pipes: { text: `Isännöintiliitto: Putkiremonttibarometri ${F.pipes.year}, median €${F.pipes.median} per m²`, url: F.pipes.url },
    survey: { text: "Kiinteistöliitto’s advice on pipe condition surveys, via Finanssiala (2022)", url: F.pipes.surveyUrl },
    leaks: { text: `Finanssiala: ${grp(F.leaks.count)} leak damages and €${Math.round(F.leaks.paid / 1e6)} million paid in ${F.leaks.year}`, url: F.leaks.url },
    aoyl: { text: "Limited Liability Housing Companies Act 1599/2009", url: "https://www.finlex.fi/fi/lainsaadanto/2009/1599" },
    concrete: { text: "RT 103765: average technical life of building parts (2025)", url: F.concreteUrl },
    asbestos: { text: "Government Decree 798/2015 on asbestos work, section 7", url: F.asbestosUrl },
    lease: { text: "Residential Leases Act 481/1995", url: "https://www.finlex.fi/fi/lainsaadanto/1995/481" },
    deposit: { text: "KKV: security deposit for a rented flat", url: "https://www.kkv.fi/en/consumer-affairs/housing/rental-apartments/security-deposit-for-a-rented-apartment/" },
    notice: { text: "KKV: terminating a lease", url: "https://www.kkv.fi/en/consumer-affairs/housing/rental-apartments/terminating-a-lease/" },
    fine: { text: "FINE: insurance for tenants, owners and housing companies", url: "https://www.fine.fi/oppaat/julkaisu/vuokralaisen-osakkaan-ja-taloyhtion-vakuutukset.html" },
  };

  /* ---------- who pays if something goes wrong ---------- */
  const COVER = {
    car: {
      items: [
        { what: "You crash into another car", who: "Traffic insurance pays for the other car and people", tone: "covered", note: "Every car must have it, by law." },
        { what: "Your own car is damaged in a crash", who: "Covered with full kasko · after your excess", tone: "covered", note: "Partial kasko doesn’t cover crash damage to your own car." },
        { what: "The car is stolen", who: "Covered with kasko · after your excess", tone: "covered" },
        { what: "It breaks down: timing belt, clutch, gearbox", who: "Not covered · you pay", tone: "pay" },
        { what: "It fails the inspection", who: "Not covered · you pay", tone: "pay" },
      ],
      note: "Car insurance pays for accidents and theft, not for wear or breakdowns. That’s why the checks above matter before you buy.",
      sources: ["lvl"],
    },
    home: {
      items: [
        { what: "A leak damages your flat", who: "Covered by insurance · after your excess", tone: "covered", note: "The housing company’s insurance covers the building. Your home insurance covers your things and the parts of the flat you’re responsible for." },
        { what: "A leak you caused damages the flat below", who: "Covered by your liability insurance · after your excess", tone: "covered", note: "When the leak was your fault. Liability cover is usually part of home insurance." },
        { what: "The pipe renovation", who: "Not covered · you pay your share", tone: "pay" },
        { what: "Facade, balcony or roof work", who: "Not covered · you pay your share", tone: "pay" },
      ],
      note: "Insurance pays for damage, not for renovations that are due. Those come out of your pocket, which is why they’re worth asking about now.",
      sources: ["fine"],
    },
    rent: {
      items: [
        { what: "Your things are damaged or stolen", who: "Covered by your home insurance · after your excess", tone: "covered" },
        { what: "A leak you caused damages the flat below", who: "Covered by your liability insurance · after your excess", tone: "covered", note: "When the leak was your fault. Liability cover is usually part of home insurance. Without it, you pay." },
        { what: "The building and the landlord’s fittings", who: "The landlord’s insurance", tone: "other" },
        { what: "Normal wear in the flat", who: "Not your cost · it’s the landlord’s", tone: "other" },
      ],
      note: "The landlord’s insurance doesn’t cover your things or damage you cause.",
      sources: ["fine", "lease"],
    },
  };

  /* ---------- numbers as written in Finnish and English ads ---------- */
  // "176 412,30", "13900", "312,000", "4.20", "1.090". Spaces of every kind are already plain spaces.
  const NUM = String.raw`\d{1,3}(?:[ .,]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d+)?`;
  function toNum(s) {
    s = s.replace(/ /g, "");
    const c = s.lastIndexOf(","), d = s.lastIndexOf(".");
    if (c >= 0 && d >= 0) {
      const dec = c > d ? "," : ".";
      s = s.split(dec === "," ? "." : ",").join("").replace(dec, ".");
    } else if (c >= 0 || d >= 0) {
      const parts = s.split(c >= 0 ? "," : ".");
      const thousands = parts.length > 2 || (parts[1].length === 3 && parts[0] !== "0");
      s = thousands ? parts.join("") : parts.join(".");
    }
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  }

  // Euro amounts with what they are per: "298,00 € / kk", "€4.20/m²/month", "22e/kk/henkilö", "offer 98.52 €/m".
  const MONEY = new RegExp(String.raw`(?:€|eur(?!\p{L}))[ ]?(${NUM})|(${NUM})[ ]?(?:€|euroa?(?!\p{L})|eur(?!\p{L})|e(?!\p{L}))`, "giu");
  function monies(s) {
    const out = [];
    for (const m of s.matchAll(MONEY)) {
      const v = toNum(m[1] ?? m[2]);
      if (v == null) continue;
      const after = s.slice(m.index + m[0].length, m.index + m[0].length + 24).toLowerCase();
      const before = s.slice(Math.max(0, m.index - 14), m.index).toLowerCase();
      let per = null;
      if (/^\s*\/\s*(m²|m2|neliö)/.test(after)) per = "m2";
      else if (/^\s*\/\s*(hlö|henk|person)|^\s*\/\s*(kk|kuukausi|month|mo)\s*\/\s*(hlö|henk|person)/.test(after)) per = "person";
      else if (/^\s*\/\s*(kk|kuuk|month|mo\b|m\b)|^\s*(kuukaudessa|per month|a month)/.test(after)) per = "month";
      else if (/^\s*\/\s*(v\b|vuosi|vuodessa|year|yr)/.test(after)) per = "year";
      const finance = /(alk\.?|alkaen|from|offer|rahoitus\w*|financing)\s*$/.test(before);
      out.push({ v, per, finance });
    }
    return out;
  }
  const pMoney = (s) => monies(s).find((m) => !m.finance && m.per !== "m2" && m.per !== "person")?.v ?? null;
  const pMonthly = (s) => monies(s).find((m) => !m.finance && (m.per === "month" || m.per === null))?.v ?? null;
  const pPerM2 = (s) => monies(s).find((m) => m.per === "m2")?.v ?? null;
  const pYear = (s) => {
    const m = s.match(/(?<![\d.\/-])(18[5-9]\d|19\d\d|20[0-4]\d)(?![\d.\/])/);
    return m && +m[1] <= YEAR + 1 ? +m[1] : null;
  };
  const YEARS = (s) => [...s.matchAll(/(?<![\d.\/])(19[5-9]\d|20[0-4]\d)(?![\d.\/])/g)].map((m) => +m[1]);
  const AREA = new RegExp(String.raw`(${NUM})[ ]?(?:\/[ ]?(?:${NUM})[ ]?)?(?:m²|m2|neliötä|neliöt|sqm)(?![\p{L}\d])`, "u");
  const pArea = (s) => {
    const m = s.match(AREA);
    const v = m ? toNum(m[1]) : null;
    return v && v >= 8 && v <= 1000 ? v : null;
  };
  const KM = new RegExp(String.raw`(${NUM})[ ]?(tkm|t\.km|km)(?![\p{L}\/])`, "iu");
  const pKm = (s) => {
    const m = s.match(KM);
    if (!m) return null;
    const v = toNum(m[1]) * (/^t/i.test(m[2]) ? 1000 : 1);
    return v >= 100 && v <= 2000000 ? v : null;
  };
  const pad = (n) => String(n).padStart(2, "0");
  function pDate(s) {
    let m = s.match(/(?<!\d)(\d{1,2})\.(\d{1,2})\.(20\d\d)(?!\d)/);
    if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    m = s.match(/(?<!\d)(\d{1,2})\/(\d{1,2})\/(20\d\d)(?!\d)/);
    if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    m = s.match(/(?<![\d.\/])(\d{1,2})[\/.-](20\d\d)(?!\d)/);
    if (m && +m[1] >= 1 && +m[1] <= 12) return `${m[2]}-${pad(m[1])}`;
    m = s.match(/(?<!\d)(20\d\d)-(\d{2})(?:-(\d{2}))?(?!\d)/);
    if (m) return m[3] ? `${m[1]}-${m[2]}-${m[3]}` : `${m[1]}-${m[2]}`;
    return null;
  }

  /* ---------- the text, as lines ---------- */
  function prep(raw) {
    let t = String(raw ?? "").normalize("NFC").replace(/\r\n?/g, "\n")
      .replace(/[    ]/g, " ").replace(/[​-‏﻿]/g, "").replace(/[ \t]+/g, " ");
    t = t.replace(/(\d) ?\n ?€ ?(?=\n|$)/g, "$1 €"); // Autotalli prints "13 900" and "€" on separate lines
    const lines = t.split("\n").map((l) => l.trim().replace(/^[*•·–-]\s*(?=\p{L})/u, "")).filter(Boolean);
    return { lines, text: lines.join("\n"), low: lines.join("\n").toLowerCase() };
  }

  // "Label\nvalue" (most sites) or "Label: value" on one line.
  const label = (src) => new RegExp(String.raw`^(?:${src})(?![\p{L}\d-])[ ]*[:.]?[ ]*`, "iu");
  function field(P, src, parse) {
    const re = label(src);
    for (let i = 0; i < P.lines.length; i++) {
      const m = re.exec(P.lines[i]);
      if (!m) continue;
      const rest = P.lines[i].slice(m[0].length);
      let v = rest ? parse(rest) : null;
      if (v == null && rest.length <= 14 && i + 1 < P.lines.length) v = parse(P.lines[i + 1]);
      if (v != null) return v;
    }
    return null;
  }
  // A label anywhere in free text: "Selling price 159 000 €, debt-free price 168 000 €".
  function inline(P, src, parse) {
    const re = new RegExp(String.raw`(?<![\p{L}\d])(?:${src})(?![\p{L}\d])`, "giu");
    for (const m of P.text.matchAll(re)) {
      const v = parse(P.text.slice(m.index + m[0].length).split("\n")[0].slice(0, 70));
      if (v != null) return v;
    }
    return null;
  }
  const either = (P, src, parse) => field(P, src, parse) ?? inline(P, src, parse);

  /* ---------- place ---------- */
  const CITIES = ("Helsinki Espoo Tampere Vantaa Oulu Turku Jyväskylä Kuopio Lahti Pori Kouvola Joensuu Lappeenranta Hämeenlinna " +
    "Vaasa Seinäjoki Rovaniemi Mikkeli Kotka Salo Porvoo Kokkola Lohja Hyvinkää Nurmijärvi Järvenpää Rauma Kirkkonummi Tuusula " +
    "Kajaani Kerava Savonlinna Nokia Kangasala Ylöjärvi Kaarina Vihti Riihimäki Raisio Imatra Raahe Lempäälä Iisalmi Sastamala " +
    "Hollola Siilinjärvi Kemi Tornio Valkeakoski Mäntsälä Kuusamo Varkaus Pirkkala Äänekoski Jämsä Forssa Hamina Heinola Lieto " +
    "Pieksämäki Uusikaupunki Kauniainen Sipoo Naantali Ylivieska Pietarsaari Lapua Kurikka Kankaanpää Loviisa Kauhava Laukaa " +
    "Orimattila Paimio Huittinen Ulvila Kontiolahti Kempele Liminka Muhos Pudasjärvi Sotkamo Kitee Lieksa Nurmes Outokumpu Liperi " +
    "Suonenjoki Kiuruvesi Nivala Kalajoki Oulainen Alavus Ähtäri Kauhajoki Närpiö Kristiinankaupunki Mustasaari Pedersöre Kemijärvi " +
    "Sodankylä Kittilä Inari Keuruu Mänttä-Vilppula Orivesi Akaa Hämeenkyrö Ikaalinen Parkano Virrat Loimaa Somero Mynämäki Masku " +
    "Parainen Eura Eurajoki Harjavalta Kokemäki Janakkala Hattula Loppi Karkkila Raasepori Hanko Inkoo Siuntio Pyhtää Luumäki " +
    "Ruokolahti Juva Mäntyharju Joroinen Leppävirta Lapinlahti Haapajärvi Saarijärvi Viitasaari Kannus Kaskinen Lapinjärvi").split(" ");
  const CITY_ALIAS = { Helsingfors: "Helsinki", Esbo: "Espoo", Vanda: "Vantaa", Åbo: "Turku", Tammerfors: "Tampere", Grankulla: "Kauniainen", Borgå: "Porvoo", Vasa: "Vaasa", Uleåborg: "Oulu", Jakobstad: "Pietarsaari", Karleby: "Kokkola" };
  const CITY_RE = new RegExp(String.raw`(?<![\p{L}\d-])(${[...CITIES, ...Object.keys(CITY_ALIAS)].join("|")})(?![\p{L}\d])`, "u");
  const CAPITAL = ["Helsinki", "Espoo", "Vantaa", "Kauniainen"];
  function city(P) {

  // Make and model: the first make in the ad that is followed by a model Traficom knows.

  const ACRONYM = new Set(["gti", "glc", "gla", "glb", "gle", "glk", "cla", "clk", "cls", "slk", "eqa", "eqc", "rcz"]);

  function readCar(P) {

  /* ---------- homes and rentals ---------- */
  const PIPE = /putki(?:remont|saneera)|linjasaneera|lvis?-(?:saneera|remont)|käyttövesi- ja viemäriputk|viemäriputk|käyttövesiputk|pipe (?:renovation|replacement|repair)|plumbing (?:renovation|replacement)|pipes (?:were |have been )?(?:renewed|replaced)/i;

      ?? pYear(P.text.match(/(?:kerrostalo|rivitalo|paritalo|luhtitalo|block of flats|terraced house)[^\n\d]{0,12}((?:19|20)\d\d)(?!\d)/i)?.[1] ?? "");

  function readHome(P) {
    const h = {};
    h.debtFreePrice = either(P, "velaton hinta|debt[- ]free price|velaton myyntihinta", pMoney);
