      if (table1) {
        if (co2 == null) need.push("co2");
        else {
          const at = (t) => (co2 >= 400 ? T.over400 : t[co2]);
          // A car from before 2017 can only have an NEDC value: WLTP for tax is the procedure of Regulation (EU) 2017/1151.
          const nedcOnly = (fu && fu.y < T.nedcBefore) || (year && year < T.nedcBefore);
          if (co2Method === "NEDC" || (!co2Method && nedcOnly)) base = { one: at(T.nedc), method: co2Method ? null : "NEDC" };
          else if (co2Method === "WLTP") base = { one: at(T.wltp) };
          else base = at(T.nedc) === at(T.wltp) ? { one: at(T.nedc) } : { NEDC: at(T.nedc), WLTP: at(T.wltp) };
        }
      } else if (table2) {
        if (totalMassKg == null) { if (!need.includes("mass")) need.push("mass"); } else base = byMass();
      } else need.push(from == null ? "firstUse" : fu?.y === 2001 ? "mass" : "firstUse");
    }
    if (need.length) return { need: uniq(need) };
    // Whole tenths of a cent, so the sum and the rounding down are exact.
    const motiveTenths = motiveRate ? Math.round(motiveRate * 10) * Math.ceil(totalMassKg / 100) : 0;
    const year365 = (cents) => Math.floor(((Math.round(cents * 10) + motiveTenths) * 365) / 10) / 100;
    const motive = motiveTenths > 0;
    if (base.one != null) return { eur: year365(base.one), motive, inferred: base.method ?? null };
    return { byMethod: { NEDC: year365(base.NEDC), WLTP: year365(base.WLTP) }, motive };
  }

  /* ---------- running a used car (data/car-running-costs.json) ----------
     Energy for two years, an electric car's services, battery test and warranty, Toyota-group hybrid battery cover and
     Traficom's recall search. Every figure keeps its source; secondary ones say "estimate". */
  const R = F.run ?? null;
  for (const [id, s] of Object.entries(R?.sources ?? {})) SRC[`c-${id}`] = s;
  const cSrc = (...ids) => ids.flat().filter(Boolean).map((id) => `c-${id}`).filter((id) => SRC[id]);
  const monthName = (ym) => `${MONTH_NAMES[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
  const dec = (v) => v.toLocaleString("en-GB", { maximumFractionDigits: 2 });
  const normModel = (s) => fold(s ?? "").replace(/[^a-z0-9]/g, "");

  // Whether a car is within a warranty of `years` or `km`, whichever comes first: "in", "out" or "maybe". It counts from
  // the date of first use when the ad gives one. Otherwise from the year, which may be a model year: first used a year
  // before at the earliest, and taken as first used by the year after at the latest. An unknown km is never "in".
  function warrantyState(c, years, km) {
    let time = "maybe";
    if (c.firstUse) {
      const [y, m] = c.firstUse.split("-").map(Number);
      time = NOW < new Date(y + years, m - 1, 1) ? "in" : NOW >= new Date(y + years, m, 1) ? "out" : "maybe";
    } else if (c.year) {
      time = NOW < new Date(c.year - 1 + years, 0, 1) ? "in" : NOW >= new Date(c.year + 1 + years, 0, 1) ? "out" : "maybe";
    }
    const dist = c.km == null ? "maybe" : c.km < km ? "in" : "out";
    const why = [dist === "out" && `it has ${grp(c.km)} km`, time === "out" && (c.firstUse ? `it was first used in ${monthName(c.firstUse)}` : `it is from ${c.year}`)].filter(Boolean);
    return { state: why.length ? "out" : time === "in" && dist === "in" ? "in" : "maybe", why };
  }

  // The maker's battery warranty rows for this electric car: by model where the maker's terms differ by model, by
  // version ("Long Range", "60 Ah") when the ad says it, by model year for Kia. Several rows when the ad doesn't say.
  function batteryWarranty(c) {
    const rows = (R?.warranty ?? []).filter((w) => w.make === fold(c.make ?? ""));
    const title = fold([c.model, c.modelKey?.split("|")[1]].filter(Boolean).join(" "));
    const text = c.adText ?? title;
    let hit = rows.filter((w) => (!w.base || new RegExp(w.base, "u").test(title))
      && (!w.my || !c.year || ((w.my[0] == null || c.year >= w.my[0]) && (w.my[1] == null || c.year <= w.my[1]))));
    const specific = hit.find((w) => w.variant && new RegExp(w.variant, "u").test(text));
    if (specific) return [specific];
    const plain = hit.filter((w) => !w.variant);
    return plain.length ? plain : hit;
  }
  function warrantyText(c, rows) {
    const w = rows[0];
    const several = (R.warranty.filter((x) => x.make === w.make).length > 1);
    const limit = (x) => `${x.years} years or ${grp(x.km)} km`;
    const same = rows.every((x) => x.years === w.years && x.km === w.km && x.soh === w.soh && x.defectOnly === w.defectOnly && x.start === w.start);
    const terms = same
      ? `${esc(w.maker)}’s battery warranty${several ? ` for the ${esc(w.models)}` : ""} is ${limit(w)}`
      : `${esc(w.maker)}’s battery warranty depends on the version: ${rows.map((x) => `${limit(x)} for the ${esc(x.models)}`).join("; ")}`;
    const soh = w.soh == null ? `. Its Finnish page states no minimum capacity`
      : w.defectOnly ? `. It covers a drop below ${w.soh}% of the capacity only when a manufacturing or material defect causes it`
      : `, and covers the battery falling below ${w.soh}% of its capacity`;
    const states = rows.map((x) => warrantyState(c, x.years, x.km));
    const st = states.every((s) => s.state === states[0].state) ? states[0] : { state: "maybe", why: [] };
    const by = c.firstUse ? `first use (${monthName(c.firstUse)})` : `year (${c.year})`;
    const status = st.state === "in" ? `By its ${by} and km (${grp(c.km)}), this car is within it.`
      : st.state === "out" ? `This car is past it: ${and(st.why)}.`
      : `This car may still be within it: check that date in its papers${c.km == null ? ", and the km" : ""}.`;
    return `${terms}, whichever comes first, counted ${w.start}${soh}. ${status}`;
  }

  // Toyota's, Lexus's and Suzuki's (Across, Swace) hybrid battery cover, renewed yearly with servicing, as each maker
  // states it. Not for Toyota or Lexus plug-in hybrids: no separate term was found for them.
  function hybridCover(c) {
    const H = R?.hybrid, mk = fold(c.make ?? ""), plugIn = c.fuel === "plug-in hybrid";
    if (!H) return null;
    let h = null, text = "";
    if (mk === "toyota" && !plugIn) {
      h = H.toyota;
      text = `Toyota’s hybrid battery cover (hybridiakkuturva) is renewed at each yearly service at an authorised Toyota workshop, up to ${h.years} years or ${grp(h.km)} km. A missed service ends it until a later service with a passed check, and it passes to the next owner. It covers cars imported by Toyota Auto Finland.`;
    } else if (mk === "lexus" && !plugIn) {
      h = H.lexus;
      text = `Lexus’s hybrid battery cover is renewed for a year at each scheduled Lexus service with a hybrid health check${h.freeCheck ? ", which is free" : ""}, up to ${h.years} years or ${grp(h.km)} km from first registration.`;
    } else if (mk === "suzuki" && /^(?:across|swace)/.test(normModel(c.model))) {
      h = H.suzuki;
      text = `Suzuki’s hybrid battery cover for the Across and Swace, which Toyota builds, is renewed at each service after a yearly battery check, up to ${h.years} years or ${grp(h.km)} km.`;
    }
    if (!h) return null;
    const st = warrantyState(c, h.years, h.km);
    return { text: `${text} ${st.state === "out" ? `This car is past it: ${and(st.why)}.` : "Ask for the service book: it shows whether it was serviced there every year."}`,
      tag: `${MAKE_BY_FOLD[mk] ?? esc(c.make)}’s hybrid battery cover`, src: cSrc(h.src) };
  }

  // Energy for two years: Finland's km a year × the ad's own combined consumption × the latest month's price.
  // Never adjusted and never guessed: no combined figure, a plug-in hybrid or a fuel without a price gives no number.
  function energyRow(c, electric) {
    if (!R) return null;
    const fuel = electric ? "electric" : c.fuel ?? null;
    const what = fuel === "electric" ? "Electricity" : fuel === "plug-in hybrid" ? "Fuel and electricity" : "Fuel";
    const none = (note, src = []) => ({ row: { what, note, eur: null, none: "Not worked out", seg: "run", open: fuel === "electric" ? "electricity" : "fuel" }, src });
    if (fuel === "plug-in hybrid") {
      const g = c.plugInOf === "diesel" ? R.gap.phevDiesel : c.plugInOf === "petrol" ? R.gap.phevPetrol : null;
      return none("A plug-in hybrid runs on fuel and electricity, and how much of each depends on how often it’s charged, so we don’t work it out."
        + (g ? ` In the EU’s measurements, ${c.plugInOf} plug-in hybrids used ${Math.round(g)}% more fuel than their official figure.` : ""), g ? cSrc(R.gap.src) : []);
    }
    const P = fuel === "electric" ? { c: R.elec.c, unit: "kWh", per: "c/kWh", month: R.elec.month, src: R.elec.src,
        label: `household electricity at ${R.elec.band} with transfer and taxes, the band Statistics Finland gives for home charging` }
      : /petrol/.test(fuel ?? "") ? { c: R.fuel.petrol, unit: "l", per: "c/l", month: R.fuel.month, src: R.fuel.src, label: "petrol 95E10", gap: R.gap.petrol, kind: "petrol" }
      : /diesel/.test(fuel ?? "") ? { c: R.fuel.diesel, unit: "l", per: "c/l", month: R.fuel.month, src: R.fuel.src, label: "diesel", gap: R.gap.diesel, kind: "diesel" } : null;
    if (!P) return none(fuel ? "Our price data covers petrol, diesel and electricity, not this fuel, so we don’t work it out." : "The ad doesn’t say what fuel it uses, so we don’t work it out.");
    const k = c.consumption?.unit === P.unit ? c.consumption : null;
    if (!k) {
      const only = (c.consumptionOnly ?? []).filter((x) => x.unit === P.unit);
      const named = only.filter((x) => x.kind !== "unnamed");
      const u = `${P.unit}/100 km`;
      return none(named.length ? `The ad gives only ${named.length > 1 ? `${and(named.map((x) => x.kind))} figures` : `a ${named[0].kind} figure`} (${and(named.map((x) => dec(x.v)))} ${u}), not a combined one, so we don’t work it out.`
        : only.length ? `The ad gives ${dec(only[0].v)} ${u} but doesn’t say it’s the combined figure, so we don’t work it out.`
        : `The ad doesn’t give its combined consumption in ${u}, so we don’t work it out.`);
    }
    const nedc = c.co2Method === "NEDC" || (c.co2Method !== "WLTP" && !(c.year >= 2019));
    const gap = P.gap ? ` Real use is usually higher: +${Math.round(P.gap)}% for ${P.kind} cars’ WLTP figures in the EU’s measurements${nedc ? `, and around ${R.gap.nedc}% for older NEDC figures by ${R.gap.nedcYear}` : ""}. Not added here.`
      : " The EU’s measurements of real use cover petrol and diesel cars, not electric ones. Public charging is priced by each operator, so it isn’t included.";
    return { row: { what, eur: 2 * R.km.v * (k.v / 100) * (P.c / 100), seg: "run",
      note: `The ad’s combined ${dec(k.v)} ${P.unit}/100 km × ${grp(R.km.v)} km a year (Finland’s ${R.km.year} average, an estimate) × ${dec(P.c)} ${P.per}, ${P.label}, ${monthName(P.month)} · Statistics Finland.${gap}` },
      src: cSrc(R.km.src, P.src, P.gap ? R.gap.src : null) };
  }

  /* ---------- timing belt or chain (data/timing-drive.json) ----------
     The engine's timing drive from its Traficom model key, year, fuel and the engine the ad names: an engine code, a
     badge as a whole ("1.6 TDI", "320d", "D-4D"), a badge's name with the same litres ("TDI" and "Moottori 1,6 l"),
     or a bare litre badge ("1.6"). A bare litre figure counts only when the ad names no other engine word, so "1.4 TSI"
     never matches a "1.4" petrol entry, and a name alone never matches a badge with litres ("T6" isn't "3.0 T6", whose
     litres tell two engines apart). A claim is made only when every matching entry gives the same drive; the interval
     only when they all give the same one and none is marked as not for Finland or as not from the cited source.
     Otherwise null, and the general belt question stays. */
  const TD = F.td ?? null;
  const TD_BADGES = TD ? TD.badges.split("|") : [], TD_CODES = TD ? TD.codes.split("|") : [];
  if (TD) TD.src.forEach((s, i) => {
    const [name, url] = s.replace(/^~/, "").split("|");
    const p = url.match(/^(\d+)\^/);
    SRC[`t-${i}`] = { text: name + (s.startsWith("~") ? " (estimate)" : ""), url: p ? TD.prefixes[+p[1]] + url.slice(p[0].length) : url, name, secondary: s.startsWith("~") };
  });
  const b36 = (s) => parseInt(s, 36);
  // Engine words as tokens ("1,6 TDI" → 1.6 tdi; "D-4D" → d 4d). Matching joins whole tokens, so "D-4D", "D4-D" and
  // "1.6TDI" all match their badge, but "D4" doesn't match inside "D4-D".
  const engTokens = (s) => fold(s).replace(/(\d),(\d)/g, "$1.$2").replace(/[^a-z0-9.+]+/g, " ").split(" ").map((t) => t.replace(/^\.+|\.+$/g, "")).filter(Boolean);
  const squash = (s) => engTokens(s).join("");
  const hasRun = (tokens, want) => {
    if (!want) return false;
    for (let i = 0; i < tokens.length; i++) {
      let acc = "";
      for (let j = i; j < tokens.length && acc.length < want.length; j++) { acc += tokens[j]; if (acc === want) return true; }
    }
    return false;
  };
  const BADGE = new Map();
  const badgeParts = (b) => {
    if (!BADGE.has(b)) {
      const t = fold(b).replace(/(\d),(\d)/g, "$1.$2");
      const d = t.match(/(?<![\d.])(\d\.\d{1,2})(?!\d)/);
      const rest = squash(t.replace(/^\s*\d\.\d{1,2}(?!\d)/, ""));
      // `word`: a name that can stand on its own ("TDI", "D-4D"), not a letter such as the T of "2.0 T".
      BADGE.set(b, { full: squash(t), disp: d ? +d[1] : null, rest, bare: !rest, word: rest.length >= 2 && /[a-z]/.test(rest) });
    }
    return BADGE.get(b);
  };
  // Engine words a bare litre figure must not come with: every badge's name, but not words for the fuel or the drive.
  let vocab = null;
  const engineWords = () => (vocab ??= uniq(TD_BADGES.map((b) => badgeParts(b)).filter((x) => x.word).map((x) => x.rest))
    .filter((w) => !/^(?:diesel|petrol|hybrid|phev|awd|4wd|2wd|4x4)$/.test(w)));
  const tdEntry = (s) => {
    const [head, codes = ""] = s.split("/");
    const pairs = (t) => (t.match(/../g) ?? []).map((x) => b36(x));
    const e = { y0: 2000 + b36(head[0]), y1: 2000 + b36(head[1]), fuel: TD.fuels[+head[2]], drive: TD.drives[+head[3]], secondary: (+head[4] & 1) > 0,
      hideInterval: (+head[4] & 2) > 0, src: b36(head.slice(5, 7)), km: b36(head.slice(7, 9)) * 1000, years: b36(head[9]), litres: b36(head.slice(10, 12)) / 100,
      badges: pairs(head.slice(12)).map((i) => TD_BADGES[i]), codes: pairs(codes).map((i) => TD_CODES[i]) };
    e.disps = uniq([e.litres, ...e.badges.map((b) => badgeParts(b).disp)].filter((x) => x > 0));
    return e;
  };
  const TD_FUEL = { petrol: ["petrol"], diesel: ["diesel"], "hybrid-petrol": ["hybrid", "petrol"], "hybrid-diesel": ["diesel"], "plug-in hybrid": ["plug-in hybrid"], gas: ["CNG"] };
  function timingDrive(c) {
    const rows = TD?.m[c.modelKey ?? ""];
    const eng = c.engine;
    if (!rows || !c.year || !eng) return null;
    const fuels = c.fuel == null ? null : TD_FUEL[c.fuel];
    if (fuels === undefined) return null;
    const tokens = engTokens(eng.text ?? "");
    const L = eng.litres;
    const near = (a, b) => Math.abs(a - b) < 0.06;
    const fitsLitres = (e) => L == null || !e.disps.length || e.disps.some((d) => near(d, L));
    const entries = rows.split(" ").map(tdEntry).filter((e) => e.y0 <= c.year && c.year <= e.y1 && (!fuels || fuels.includes(e.fuel)));
    // An engine code the ad writes ("CAYC"; ADAC gives some codes as their first three letters).
    const codeIn = (k) => {
      const q = squash(k);
      return q.length >= 3 && (hasRun(tokens, q) || (/^[a-z]{3}$/.test(q) && tokens.some((t) => /^[a-z]{4}$/.test(t) && t.startsWith(q))));
    };
    const byCode = entries.filter((e) => e.codes.some(codeIn));
    let hit;
    if (byCode.length) hit = byCode.filter(fitsLitres);
    else {
      const bareOk = L != null && !engineWords().some((w) => hasRun(tokens, w));
      hit = entries.filter((e) => fitsLitres(e) && e.badges.some((b) => {
        const B = badgeParts(b);
        if (B.bare) return bareOk && B.disp != null && near(B.disp, L);
        return hasRun(tokens, B.full) || (B.word && B.disp != null && L != null && near(B.disp, L) && hasRun(tokens, B.rest));
      }));
    }
    if (!hit.length || hit.some((e) => e.drive !== hit[0].drive)) return null;
    const one = hit[0];
    const interval = one.drive !== "chain" && (one.km || one.years) && hit.every((e) => e.km === one.km && e.years === one.years && !e.hideInterval)
      ? { km: one.km || null, years: one.years || null } : null;
    const src = uniq(hit.map((e) => `t-${e.src}`)).filter((id) => SRC[id]);
    // "Haynes: Volvo V70/XC70 2008-2016" reads as Haynes's maintenance plan for that car.
    const names = src.slice(0, 2).map((id) => esc(SRC[id].name.replace(/^Haynes: (.*)$/, "Haynes’s maintenance plan for the $1")));
    const who = and(src.length > 2 ? [...names, `${src.length - 2} more`] : names);
    const est = hit.some((e) => e.secondary);
    return { drive: one.drive, interval, src, paren: `${who}${est ? ", estimate" : ""}`, says: `${who}${est ? " (estimate)" : ""}` };
  }

  // An electric car's periodic service from AutoJerry's price guide: its model, else its make, else none.
  function evService(c) {
    const rows = (R?.service ?? []).filter((r) => r.make === fold(c.make ?? ""));
    const mine = [normModel(c.modelKey?.split("|")[1]), normModel(c.model)].filter(Boolean);
    return rows.find((r) => r.model && mine.some((m) => m.startsWith(normModel(r.model)))) ?? rows.find((r) => !r.model) ?? null;
  }

  function carResult(c) {
    const name = esc([c.make, c.model].filter(Boolean).join(" ") || "Used car");
    // Traficom counts BMWs by series and Mercedes by class: "BMW 3 Series", not "BMW 320d".
    const statName = c.modelKey && fold(c.model ?? "") !== c.modelKey.split("|")[1] ? carName(c.modelKey) : name;
    const age = c.year ? YEAR - c.year : null;
    const I = inspectionFor(c);
    const causes = uniq((I.row ?? I.avg ?? []).slice(3).map((i) => DATA.areas[i]));
    const sources = ["trafi"];
    const asks = [];

    // 1. Inspections: this model against every car of the same age.
    const a1 = { q: "“Can I see the last inspection report?”", who: "you", real: true, link: { href: SRC.lookup.url, text: "Look up its details at Traficom" } };
    if (I.row && I.avg) {
      const [p, n, mkm] = I.row, avg = I.avg[0], diff = p - avg;
      const verdict = diff >= 8 ? "That’s much worse than average." : diff >= 2 ? "That’s worse than average." : diff <= -8 ? "That’s much better than average." : diff <= -2 ? "That’s better than average." : "That’s about average.";
      const nearYear = I.ry !== c.year ? ` (Traficom has too few ${c.year} cars of this model, so these are the ${I.ry} ones.)` : "";
      // Under half the median km of the same model and year is a prompt to check the readings, not a statistic about
      // this car: low km is often genuine. Only the car's own year counts, as km grow with every year of age.
      const lowKm = mkm && c.km && I.ry === c.year && c.km < (mkm * 1000) / 2;
      a1.why = `In ${DATA.trafi.year}, ${p.toFixed(1)}% of ${I.ry} ${statName} cars failed their inspection, out of ${grp(n)} inspections. For all cars from ${I.ry} it was ${I.avg[0].toFixed(1)}%. ${verdict}${nearYear}`
        + (mkm && c.km ? ` Those cars had a median of ${grp(mkm * 1000)} km; this one has ${grp(c.km)} km.` : "")
        + (lowKm ? " That’s under half the median, which is worth checking: the km is recorded at every inspection, so compare the readings in Traficom’s vehicle lookup." : "")
        + (c.badge ? ` Traficom counts all ${statName} cars together, not only the ${esc(c.badge)}.` : "");
      a1.bars = [
        { label: `${statName}, ${I.ry}`, pct: p, tone: diff >= 2 ? "bad" : diff <= -2 ? "good" : "", me: true },
        { label: `All cars from ${I.ry}`, pct: avg, tone: "" },
      ];
      a1.whatif = causes.length ? `What if it fails next time? For this model the usual reasons are ${and(causes)}.` : "What if it fails next time? You pay for the repairs before you can drive it.";
      a1.tag = `Traficom inspection statistics ${DATA.trafi.year}`;
    } else if (I.make && I.avg) {
      a1.why = `Traficom lists models only when they had at least 100 inspections, and the ${name} from ${c.year} isn’t one of them. All ${esc(c.make)} cars from ${c.year}: ${I.make[0].toFixed(1)}% failed. All cars from ${c.year}: ${I.avg[0].toFixed(1)}%.`;
      a1.bars = [{ label: `All ${esc(c.make)} cars, ${c.year}`, pct: I.make[0], tone: I.make[0] - I.avg[0] >= 2 ? "bad" : I.avg[0] - I.make[0] >= 2 ? "good" : "", me: true }, { label: `All cars from ${c.year}`, pct: I.avg[0], tone: "" }];
      a1.whatif = causes.length ? `What if it fails next time? For cars this age the usual reasons are ${and(causes)}.` : "What if it fails next time? You pay for the repairs before you can drive it.";
      a1.tag = `Traficom inspection statistics ${DATA.trafi.year}`;
    } else if (I.avg) {
      a1.why = `We couldn’t find this model in Traficom’s statistics, so here is the average: ${I.avg[0].toFixed(1)}% of cars from ${c.year} failed their inspection in ${DATA.trafi.year}.`;
      a1.bars = [{ label: `All cars from ${c.year}`, pct: I.avg[0], tone: "", me: true }];
      a1.whatif = causes.length ? `What if it fails next time? For cars this age the usual reasons are ${and(causes)}.` : "What if it fails next time? You pay for the repairs before you can drive it.";
      a1.tag = `Traficom inspection statistics ${DATA.trafi.year}`;
    } else if (c.year && c.year > 2021) {
      a1.q = "“When is its first inspection due?”";
      a1.why = `A car from ${c.year} is too new for Traficom’s statistics. Its first inspection is due four years after it was first registered.`;
      a1.whatif = "What if something is wrong when it’s inspected? A newer car is often still under the maker’s warranty: ask for it in writing.";
      a1.tag = "Vehicles Act 82/2021";
      sources.push("ajl");
    } else {
      a1.why = `${c.year ? `Traficom’s statistics by year start from 2005.` : "We couldn’t read the year from the ad."} In ${DATA.trafi.year}, ${DATA.trafi.national[0]}% of all car inspections in Finland ended in a fail.`;
      a1.whatif = "What if it fails next time? You pay for the repairs before you can drive it.";
      a1.tag = `Traficom inspection statistics ${DATA.trafi.year}`;
    }
    // The next inspection after the ad's last one (the rule "After you buy" uses too). Overdue once its month is over:
    // then the first ask is why, and the statistics become what to expect when it is inspected.
    let nextDue = null;
    if (c.lastInspection && c.year) {
      const [ly, lm] = c.lastInspection.split("-").map(Number);
      let due = ly + (ly - c.year >= 9 ? 1 : 2);
      if (ly - c.year < 9 && due - c.year > 10) due = c.year + 10;
      const m = (lm || 1) - 1;
      nextDue = { y: due, m, last: `${MONTH_NAMES[m]} ${ly}`, by: `${MONTH_NAMES[m]} ${due}`, overdue: new Date(due, m + 1, 1) <= NOW };
    }
    if (nextDue?.overdue) {
      const stats = a1.why ? ` When it’s inspected, here is how cars like it do. ${a1.why}` : "";
      a1.q = `“Why hasn’t it been inspected since ${nextDue.last}?”`;
      a1.why = `The ad says it was last inspected in ${nextDue.last}, so its next inspection was due by ${nextDue.by}. It may have failed, or been taken out of road use, or the ad may be out of date. Traficom’s vehicle lookup shows whether it’s in road use${c.plate ? `: the ad gives its plate, ${esc(c.plate)}` : ""}. Until it passes, it may be driven only to the inspection.${stats}`;
      a1.whatif = a1.whatif.replace("What if it fails next time?", "What if it fails when it’s inspected?");
      a1.tag = `${a1.tag} · Vehicles Act 82/2021, section 151`;
      sources.push("useban");
    }
    asks.push(a1);

    // Only ask about parts the car has: an electric car has no timing belt or clutch, an automatic no clutch to wear out.
    // An unknown fuel or gearbox counts as having them, so nothing is left out by a guess. A model that is electric only
    // (data/powertrain-models.json, from the makers' pages) is electric even when the ad doesn't say so.
    const f = c.flags;
    const electric = c.fuel === "electric" || (c.fuel == null && EV_KEYS.has(c.modelKey));
    const hybrid = /hybrid/.test(c.fuel ?? "");
    const clutch = !electric && c.gearbox !== "automatic";
    const motor = electric ? "the electric motor" : "the gearbox";
    // The breakdown a private-seller what-if names, and its price when we have a sourced one (clutches only).
    const fault = clutch
      ? { goes: "the clutch goes", cost: `€${F.clutch.low}–${grp(F.clutch.high)}`, tag: " · clutch prices AutoJerry 2026", src: ["clutch"] }
      : { goes: `${motor} fails`, cost: "", tag: "", src: [] };

    // 2–3. The other two asks, in this order of priority: a timing belt that may be due (an electric car's battery
    // instead), an imported car's history, a hybrid's battery, who you're buying from, then a belt receipt, rust and
    // the service history to fill a free place. Each comes with its sources.
    // The engine's timing drive from the data, unless the ad says it has a chain, or speaks of a belt where the data says
    // chain: then the ad's words stand and the data claims nothing.
    const tdAll = electric || f.timingChain ? null : timingDrive(c);
    const td = tdAll && !(tdAll.drive === "chain" && f.timingBeltReplaced !== undefined) ? tdAll : null;
    const chain = f.timingChain || td?.drive === "chain";
    const iv = td?.interval ?? null;
    const ivText = iv ? `every ${[iv.km && `${grp(iv.km)} km`, iv.years && `${iv.years} years`].filter(Boolean).join(" or ")}${iv.km && iv.years ? ", whichever comes first" : ""}` : "";
    // With the engine's own interval, the belt is due once the car is past it by km or by age; otherwise the general rule.
    const ivCheck = iv && ((c.km != null && iv.km) || (age != null && iv.years));
    const pastIv = !!iv && ((c.km != null && iv.km > 0 && c.km >= iv.km) || (age != null && iv.years > 0 && age >= iv.years));
    const beltDue = !electric && !chain && f.timingBeltReplaced === undefined && (ivCheck ? pastIv : c.km ? c.km >= 80000 : age != null && age >= 8);
    const beltNotDone = !electric && f.timingBeltReplaced === false;
    const beltTag = `AutoJerry 2026: changing a timing belt costs €${F.belt.low}–${F.belt.high}, typically €${F.belt.typical}${td ? ` · ${td.says}` : ""}`;
    const wet = td?.drive === "wet belt";
    const beltFact = !td || chain ? ""
      : iv ? (wet ? `This engine’s timing belt runs in engine oil (a wet belt) and is changed ${ivText}, says ${td.says}.` : `This engine’s belt is changed ${ivText}, says ${td.says}.`)
      : wet ? `This engine has a wet belt, a timing belt that runs in engine oil (${td.paren}).` : `This engine has a timing belt (${td.paren}).`;
    const general = `Belts are usually changed around every ${grp(F.belt.km)} km (${grp(F.belt.kmRange[0])}–${grp(F.belt.kmRange[1])} km, depending on the engine).`;
    const have = [c.km != null && `has driven ${grp(c.km)} km`, age != null && `is about ${age} years old`].filter(Boolean);
    const vsIv = !iv ? (c.km ? ` This one has driven ${grp(c.km)} km.` : "")
      : !have.length ? " The ad doesn’t give its km or year."
      : ` This one ${and(have)}${pastIv ? ", so it is past that: its belt should have been changed at least once." : ivCheck ? ", so by that it isn’t due yet." : "."}`;
    const more = [];
    if (beltDue || beltNotDone) {
      more.push([{ q: beltNotDone ? "“Will you lower the price for the timing belt?”" : td ? "“Has the timing belt been changed?”" : "“Has the timing belt been changed? Or does it have a chain?”",
        why: (beltNotDone ? "The ad says the timing belt hasn’t been changed. " : "")
          + (td ? `${beltFact}${iv ? "" : ` ${general}`}` : `Many engines have a timing belt that must be changed around every ${grp(F.belt.km)} km (${grp(F.belt.kmRange[0])}–${grp(F.belt.kmRange[1])} km, depending on the engine).`) + vsIv,
        whatif: "What if it’s overdue and snaps? It can wreck the engine.", cost: "",
        tip: `If it’s due, ask for about ${eur(F.belt.typical)} off. That’s a typical garage price.`, who: "you", tag: beltTag, real: true }, ["belt", ...(td?.src ?? [])]]);
    }
    if (electric) {
      // The maker's battery warranty when we have its terms, and what a test costs when the seller has no report.
      const T = R?.test, W = R ? batteryWarranty(c) : [];
      more.push([{ q: "“Can I see a report on the battery’s health?”",
        why: `${c.batterySoh ? `The ad says the battery is at ${c.batterySoh}%. ` : ""}An electric car’s battery holds less charge as it ages, and its range drops with it. A garage or the maker can read the battery’s state of health (SoH): ask for the report`
          + (W.length ? `. ${warrantyText(c, W)}` : ", and whether the maker’s battery warranty is still valid."),
        whatif: "What if the battery has worn more than you thought? The range stays shorter.", cost: T ? `Test ≈ ${eur(T.avg)}` : "", who: "you",
        tip: T ? `With no report, a garage test costs ${eur(T.avg)} on average (${eur(T.low)}–${T.high}), an estimate from AutoJerry. An ${T.aviloo.what} cost ${eur(T.aviloo.eur)} at one garage in ${monthName(T.aviloo.date)}, Moottori reported.` : "",
        tag: [W.length && `${esc(W[0].maker)}’s battery warranty terms`, T && "AutoJerry 2026 and Moottori test prices, estimates"].filter(Boolean).join(" · ") || "Ask the seller", real: W.length > 0 },
        [...cSrc(W.flatMap((w) => w.src)), ...cSrc(T?.src, T?.aviloo.src)]]);
    }
    const mods = c.modifications ?? [];
    if (mods.length || f.modInspected) {
      const risk = M.riskIncrease;
      more.push([{ q: f.modInspected ? "“What was changed, and can I see the modification inspection papers?”" : "“What was changed, and is it in the registration?”",
        why: `The ad ${mods.length ? `mentions ${and(mods)}` : "says the car was changed"}${f.modInspected ? ", and that the changes were inspected" : ""}. A change with more than a minor effect on safety or emissions, or on the details in the register, needs a modification inspection (muutoskatsastus), Traficom says.${risk ? ` ${risk.rule}` : ""}`,
        whatif: "What if you crash and the insurer wasn’t told about a change? A kasko payout can be cut or refused.", cost: "", who: "you",
        tag: "Traficom: modification inspection · Insurance Contracts Act 543/1994", real: true }, mSrc("traficom-modification", risk?.source)]);
    }
    if (f.imported) {
      more.push([{ q: "“What is its history from before it came to Finland?”",
        why: "The ad says the car is imported. Ask for its service records, km readings and any accident history from abroad: Finland’s register may not have them. In KKV’s study of complaints about used cars bought from dealers, finding out afterwards that a car had been crashed or imported was a frequent surprise.",
        whatif: "What if it was damaged abroad, or its km readings don’t add up? You find out when something goes wrong.", cost: "", who: "you",
        link: { href: SRC.lookup.url, text: "Look up what Finland has recorded at Traficom" }, tag: "From the ad · KKV 2024", real: true }, ["kkv", "lookup"]]);
    }
    if (hybrid) {
      // Toyota's, Lexus's and Suzuki's cover replaces the general "ask whether the warranty is still valid".
      const hc = hybridCover(c);
      const withCover = ([ask, src]) => (hc ? [{ ...ask, why: ask.why.replace(" Ask too whether the maker’s hybrid battery warranty is still valid.", "").replace(", and whether the maker’s hybrid battery warranty is still valid.", ".") + ` ${hc.text}`,
        tag: `${ask.tag} · ${hc.tag}`, real: true }, [...src, ...hc.src]] : [ask, src]);
      more.push(withCover([f.hybridBatteryChecked
        ? { q: "“Can I see the report from the hybrid battery check?”",
          why: "The ad says the hybrid battery was checked. The report shows what was measured and when. Ask too whether the maker’s hybrid battery warranty is still valid.",
          whatif: "What if the battery has worn more than you thought? It’s wear, so you pay for it.", cost: "", who: "you", tag: "From the ad" }
        : { q: "“Has the hybrid battery’s condition been checked?”",
          why: "A hybrid’s drive battery wears with age and use, like an electric car’s. A garage or the maker’s dealer can test it: ask for the report, and whether the maker’s hybrid battery warranty is still valid.",
          whatif: "What if the battery has worn more than you thought? It’s wear, so you pay for it.", cost: "", who: "you", tag: "Ask the seller" }, []]));
    }

    // Who you are buying from changes your rights.
    if (c.sellerType === "dealer") {
      more.push([{ q: "“What do you promise about its condition, in writing?”",
        why: "You’re buying from a business, so consumer law covers you. If a fault shows up within a year, it’s presumed to have been there when you bought it, unless it’s normal wear for the car’s age and km. A general “sold as is” line doesn’t change that.",
        whatif: `What if ${motor} fails in month three?`, cost: "", who: "The dealer answers for it, unless it’s normal wear",
        tip: f.dealerWarranty ? `The ad mentions a warranty (${esc(f.dealerWarranty)}). It comes on top of your rights, not instead of them.` : "",
        tag: "Consumer Protection Act 38/1978, chapter 5", real: true }, ["ksl"]]);
    } else if (c.sellerType === "private") {
      more.push([{ q: "“Can I take it to a garage before I buy?”",
        why: `You’re buying from a private person. If a fault shows up next month, it’s mostly your problem: a dealer would have to answer for it for a year, a private seller doesn’t. Used-car faults are the biggest car complaint in Finland: ${Math.round(F.disputes.defectShare * 100)}% of used-car cases at consumer advice were about defects.`,
        whatif: `What if ${fault.goes} next month?`, cost: fault.cost, who: "you",
        tag: `Sale of Goods Act 355/1987 · KKV 2024${fault.tag}`, real: true }, ["kl", "kkv", ...fault.src]]);
    } else {
      more.push([{ q: "“Are you a dealer or a private seller?”",
        why: "It changes your rights. A dealer must answer for faults that show up within a year, unless they’re normal wear. With a private seller, a fault that shows up later is mostly your problem.",
        whatif: `What if ${fault.goes} next month and the seller was private?`, cost: fault.cost, who: "you",
        tag: `Consumer Protection Act, chapter 5 · Sale of Goods Act${fault.tag}`, real: true }, ["ksl", "kl", ...fault.src]]);
    }

    if (!electric && f.timingBeltReplaced) {
      const when = c.beltKm ? ` at ${grp(c.beltKm)} km` : c.beltYear ? ` in ${c.beltYear}` : "";
      more.push([{ q: "“Can I see the receipt for the timing belt?”",
        why: `The ad says the timing belt was changed${when}. A receipt proves it.${c.beltKm && c.km && c.km > c.beltKm ? ` That was ${grp(c.km - c.beltKm)} km ago.` : ""} ${td ? beltFact : `Belts are usually changed around every ${grp(F.belt.km)} km, depending on the engine.`}`,
        whatif: "What if it was never done and the belt snaps? It can wreck the engine.", cost: "", who: "you", tag: beltTag, real: true }, ["belt", ...(td?.src ?? [])]]);
    }
    if (f.rustMentioned) {
      const modelRust = causes.includes("rust under the car");
      more.push([{ q: "“Where is the rust, and how bad is it?”",
        why: "The ad mentions rust." + (modelRust ? " Rust under the car is one of the most common reasons this model fails its inspection." : " Ask to see it, and have a garage look underneath."),
        whatif: "What if it fails the inspection on rust? You pay for the repair before you can drive it.", cost: "", who: "you",
        tag: modelRust ? `Traficom inspection statistics ${DATA.trafi.year}` : "From the ad", real: modelRust }, []]);
    }
    more.push([{ q: "“Can I see the service history?”",
      why: `${f.serviceBook ? "The ad mentions a service book. " : ""}Stamped services and receipts show the car was looked after. A regular service costs €${F.service.low}–${F.service.high} at a garage.`,
      whatif: "What if services were skipped? Worn parts show up later as bigger repairs.", cost: "", who: "you",
      tag: "AutoJerry 2026 service prices", real: true }, ["service"]]);
    // Recalls: always worth checking, so it goes last, under the three. Traficom's search by the ad's model name.
    const recallKw = c.model ?? c.make;
    if (R?.recall && recallKw) {
      more.push([{ q: "“Has its recall work been done?”",
        why: `Makers report their recall campaigns to Traficom, which lists them, active and closed. Minor service campaigns needn’t be reported, so they aren’t there. Search for the ${esc(recallKw)}, then ask the seller or a ${esc(c.make ?? "brand")} garage whether this car’s recall work was done.`,
        whatif: "What if a recall was never done? The fault it was meant to fix may still be there.", cost: "", who: "Check before you buy",
        link: { href: R.recall.url.replace("{model}", encodeURIComponent(recallKw)), text: `Search Traficom’s recalls for “${esc(recallKw)}”` },
        tag: "Traficom recall database", real: true }, cSrc(R.recall.src)]);
    }
    for (const [ask, src] of more.slice(0, 2)) { asks.push(ask); sources.push(...src); }
    // Everything else that fired goes under them, collapsed, in the same order.
    const extra = more.slice(2).map(([ask, src]) => { sources.push(...src); return ask; });

    // Costs over two years: only numbers from the ad or with a source.
    const costs = [];
    if (c.price != null) costs.push({ what: "Asking price", note: c.previousPrice ? `From the ad · down from ${eur(c.previousPrice)}` : "From the ad", eur: c.price, seg: "price" });
    if (c.officeFee) costs.push({ what: "Office fee", note: "The dealer adds it on top · from the ad", eur: c.officeFee, seg: "price" });
    if (beltDue || beltNotDone) costs.push({ what: "Timing belt, if due", note: `Typical garage price · AutoJerry 2026`, eur: F.belt.typical, seg: "fix" });
    const inspections = age == null ? 1 : age >= 9 ? 2 : age >= 2 ? 1 : 0;
    if (inspections) costs.push({ what: nextDue?.overdue ? (inspections === 2 ? "Inspection now, and one more" : "Inspection now") : inspections === 2 ? "Two inspections" : "One inspection", note: `About ${eur(F.inspectionFee.walkIn)} each · Traficom ${F.inspectionFee.year} average price`, eur: inspections * F.inspectionFee.walkIn, seg: "run" });
    // An electric car's service price is AutoJerry's for its model or make, where it has one.
    const evSvc = electric ? evService(c) : null;
    if (evSvc) {
      costs.push({ what: "Two services", note: `${eur(evSvc.avg)} each on average (${eur(evSvc.low)}–${evSvc.high}) for the ${esc(c.make)}${evSvc.model ? ` ${esc(evSvc.model)}` : ""} · AutoJerry 2026 · estimate: depends on your km`, eur: 2 * evSvc.avg, seg: "run" });
      sources.push(...cSrc(evSvc.src));
    } else {
      costs.push({ what: "Two services", note: electric
        ? `Typical garage price ${eur(F.service.typical)} each for all makes: AutoJerry has no electric-car price for this model · AutoJerry 2026 · estimate`
        : `Typical garage price ${eur(F.service.typical)} each · AutoJerry 2026 · estimate: depends on your km`, eur: 2 * F.service.typical, seg: "run" });
    }
    const energy = energyRow(c, electric);
    if (energy) { costs.push(energy.row); sources.push(...energy.src); }
    // Vehicle tax for the two years, from the ad's CO2, first use and total mass. Without them: Traficom's calculator.
    const tax = vehicleTax({ fuel: electric ? "electric" : c.fuel, co2: c.co2 ?? null, co2Method: c.co2Method ?? null, firstUse: c.firstUse ?? null,
      year: c.year ?? null, totalMassKg: c.totalMassKg ?? null, plugInOf: c.plugInOf ?? null });
    const calc = { href: SRC.taxcalc.url, text: "Traficom’s tax calculator" };
    const TAX_NEEDS = { fuel: "the fuel", co2: "the CO2 figure", firstUse: "the date of first use", mass: "the total mass (kokonaismassa)" };
    const taxFuel = electric ? "electric-car" : c.fuel === "plug-in hybrid" ? "plug-in hybrid" : c.fuel;
    const taxWhat = (electric ? "basic tax for an electric car" : c.co2 != null ? `basic tax for ${c.co2} g/km${c.co2Method ? ` (${c.co2Method})` : tax.inferred ? ` (${tax.inferred}, as for every car from before ${F.tax.nedcBefore})` : ""}` : "basic tax by total mass")
      + (tax.motive ? ` plus the ${taxFuel} motive-power tax on ${grp(c.totalMassKg)} kg total mass` : "");
    if (tax.eur != null) {
      costs.push({ what: "Vehicle tax", note: `${eurc(tax.eur)} a year: ${taxWhat} · Vehicle Tax Act 1281/2003, 2026 rates`, eur: 2 * tax.eur, seg: "run" });
      sources.push("tax");
    } else if (tax.byMethod) {
      costs.push({ what: "Vehicle tax", note: `${eurc(2 * tax.byMethod.NEDC)} if its CO2 figure is NEDC, ${eurc(2 * tax.byMethod.WLTP)} if WLTP: the ad doesn’t say which · Vehicle Tax Act 1281/2003, 2026 rates`,
        eur: null, seg: "run", open: "vehicle tax", link: calc });
      sources.push("tax", "taxcalc");
    } else {
      costs.push({ what: "Vehicle tax", note: tax.uncovered ? "Our tax tables don’t cover this fuel. The calculator works it out from the car’s registration details"
        : `The ad doesn’t give ${and(tax.need.map((k) => TAX_NEEDS[k]))}. The calculator works it out from the car’s registration details`, eur: null, seg: "run", open: "vehicle tax", link: calc });
      sources.push("taxcalc");
    }
    costs.push({ what: "Insurance", note: "Depends on you and the car", eur: null, seg: "ins" });
    if (inspections) sources.push("fee");
    if (!evSvc) sources.push("service");

    // Is there a safer choice? Common cars of the same year that failed least; for an electric car, electric ones only.
    // Not for a performance or variant badge: Traficom counts it with its everyday model, and an everyday car
    // that failed less is no answer to a WRX.
    let safer = null;
    if (c.year && DATA.avg[c.year] && !c.badge) {
      const kind = electric ? "electric cars" : "cars";
      const pool = Object.entries(DATA.m).filter(([k, ys]) => ys[c.year] && ys[c.year][1] >= 800 && k !== c.modelKey && (!electric || EV_KEYS.has(k)))
        .sort((a, b) => a[1][c.year][0] - b[1][c.year][0]).slice(0, 3);
      const mine = I.row && I.ry === c.year ? [{ label: `${statName} (this ad)`, pct: I.row[0], tone: !pool.length ? "" : I.row[0] <= pool[pool.length - 1][1][c.year][0] ? "good" : "bad", me: true }] : [];
      const all = { label: `All cars from ${c.year}`, pct: DATA.avg[c.year][0], tone: "" };
      const tag = `Traficom inspection statistics ${DATA.trafi.year} · models with at least 800 inspections`;
      if (pool.length) {
        safer = { label: "Is there a safer choice?", title: `Common ${kind} from ${c.year} that failed least`,
          bars: [...pool.map(([k, ys]) => ({ label: carName(k), pct: ys[c.year][0], tone: mine.length && ys[c.year][0] > I.row[0] ? "" : "good" })), ...mine, all],
          note: `Same age${electric ? ", also electric" : ""}, fewer failed inspections. Mileage differs between models, so compare the km too.`
            + (electric && pool.length < 3 ? ` Only ${pool.length === 1 ? "one other electric model" : `${pool.length} other electric models`} from ${c.year} had at least 800 inspections.` : ""), tag };
        if (mine.length && I.row[0] <= pool[pool.length - 1][1][c.year][0]) safer.title = `This one is among the ${kind} from ${c.year} that failed least`;
      } else if (electric) {
        // Too few electric models of this year to compare with: say so, rather than suggest a petrol car.
        safer = { label: "Is there a safer choice?", title: `Too few electric cars from ${c.year} to compare`,
          bars: [...mine, all],
          note: `We compare only with models that had at least 800 inspections, and no other electric model from ${c.year} had that many. All cars from ${c.year} include petrol and diesel cars.`, tag };
      }
    }

    // After you buy: reminders that need the car's details, for If customers.
    const later = [{ when: "Within 7 days", text: "Register yourself as the new owner. The seller hands over the papers." }];
    if (nextDue?.overdue) later.push({ when: "Now", text: `Its inspection was due by ${nextDue.by}, by the ad’s date. Check before you buy.` });
    else if (nextDue) later.push({ when: `${MONTHS[nextDue.m]} ${nextDue.y}`, text: `Inspection due.${causes.length ? ` Its usual weak spots: ${causes.slice(0, 2).join(", ")}.` : ""}` });
    later.push({ when: "Nov–Mar", text: "Winter tyres whenever the weather or roads call for them, with at least 3 mm of tread." });
    later.push({ when: "Icy days", text: "A heads-up the evening before, for your own route." });
    sources.push("ajl", "tll", "lookup", "lvl");
    if (td) sources.push(...td.src); // the readout names the timing drive's source even when no belt question is asked

    const specs = [c.year, c.km ? `${grp(c.km)} km` : null, FUEL_WORDS[c.fuel] ?? c.fuel, c.gearbox, c.sellerType === "dealer" ? "dealer" : c.sellerType === "private" ? "private seller" : null, c.city ? esc(c.city) : null].filter(Boolean).join(" · ");
    const parts = electric ? ["battery", "electric motor", "charger"]
      : [chain ? "engine" : "timing belt", clutch && "clutch", "gearbox", hybrid && "hybrid battery"].filter(Boolean);
    const cover = { ...COVER.car, items: COVER.car.items.map((i) => (i.breakdown ? { ...i, what: `It breaks down: ${parts.join(", ")}` } : i)) };
    const beltAd = f.timingBeltReplaced ? `changed${c.beltKm ? ` at ${grp(c.beltKm)} km` : c.beltYear ? ` in ${c.beltYear}` : ""}, says the ad` : f.timingBeltReplaced === false ? "not changed, says the ad" : null;
    const tdSaid = td && `${td.drive === "chain" ? "Timing chain" : wet ? "Wet belt, in engine oil" : "Timing belt"}${iv ? `, ${ivText}` : ""} (${td.paren})`;
    const belt = f.timingChain ? "timing chain, says the ad" : td ? [tdSaid, beltAd].filter(Boolean).join("; ") : beltAd ?? nf;
    return {
      kind: "car", stamp: "Used car", name, specs, price: c.price, priceLabel: "Asking price",
      steps: ["Reading the ad", c.year ? `Finding inspection results for ${c.year} ${name}` : `Finding inspection results for ${name}`,
        c.km ? `Checking what usually needs doing at ${grp(c.km)} km` : "Checking what usually needs doing", "Checking who pays if something goes wrong"],
      asks: asks.slice(0, 3), more: extra, period: "Over two years", costs,
      costNote: "Only numbers from the ad or with a source. Insurance depends on you, so get your own price below.",
      safer, cover,
      later: { label: "After you buy", notif: { meta: "Tue 20:12", title: "Frost on your route tomorrow", text: "Black ice likely around 6:40. Leave ten minutes early and keep your distance." }, list: later },
      insure: { label: "Drive it home", title: "Get reminders for this car.", text: "They come with If car insurance. Traffic insurance is required by law from the moment the car is yours.",
        details: [["Car", c.year ? `${name}, ${c.year}` : name], c.km ? ["Km", grp(c.km)] : null, c.city ? ["Area", esc(c.city)] : null].filter(Boolean) },
      readout: [["Car", name], ["Year", shown(c.year)], ["Km", shown(c.km, grp)], ["Price", shown(c.price, eur)], ["Seller", shown(c.sellerType)], ["Fuel", shown(c.fuel)],
        ["Gearbox", shown(c.gearbox)],
        ["Consumption", c.consumption ? `${dec(c.consumption.v)} ${c.consumption.unit}/100 km combined, says the ad`
          : c.consumptionOnly ? `${and(c.consumptionOnly.map((x) => `${x.kind === "unnamed" ? "" : `${x.kind} `}${dec(x.v)} ${x.unit}/100 km`))}, says the ad` : nf],
        ["Last inspection", shown(c.lastInspection)], ["Area", shown(c.city, esc)],
        electric ? ["Battery", c.batterySoh ? `${c.batterySoh}% health, says the ad` : nf] : [td ? "Timing drive" : "Timing belt", belt],
        ...(mods.length || f.modInspected ? [["Changes", `${mods.length ? esc(and(mods)) : "changed"}${f.modInspected ? ", inspected, says the ad" : ", says the ad"}`]] : [])],
      sources: uniq(sources),
    };
  }

  /* ---------- flats: the area's prices and rents ---------- */
  // Statistics Finland's prices of old flats by postcode (libs/listing, table 13mu) and average rents of privately
  // financed flats (data/rent-areas.json, tables 13eb and 15fa). The facts behind the questions an ad's own words
  // raise are in data/flat-checks.json, each with its source.
  const qText = (q) => String(q).replace(/^(\d{4})Q(\d)$/, "$1 Q$2");
  const pdate = (d) => { const [y, m] = String(d).split("-"); return m ? `${MONTH_NAMES[+m - 1]} ${y}` : y; };
  const urls = new Set(Object.values(SRC).map((s) => s.url));
  for (const [id, s] of Object.entries(F.flat?.src ?? {})) if (!urls.has(s.url)) SRC[`f-${id}`] = { text: s.secondary ? `${s.text} · secondary source` : s.text, url: s.url };
  if (F.areaPrices) SRC.areaprice = { text: `Statistics Finland: prices of old flats by postal code area, ${F.areaPrices.year} (table 13mu)`, url: F.areaPrices.url };
  if (F.rents) {
    SRC.rentpost = { text: `Statistics Finland: average rents of privately financed flats by postal code area, ${qText(F.rents.postPeriod)} (table 13eb)`, url: F.rents.postUrl };
    SRC.rentmuni = { text: `Statistics Finland: average rents of privately financed flats, ${qText(F.rents.muniPeriod)} (table 15fa)`, url: F.rents.muniUrl };
  }
  const SMALL_SAMPLE = 20; // fewer sales than this and the result says the average is a small sample
  const saleName = (pc) => F.areaPrices?.by[pc]?.[0] ?? null;
  const rentName = (pc) => F.rents?.post[pc]?.[0] || saleName(pc);
  // Only the ad's own postcode. A district's name doesn't map to one postal area (Tampere's Kaleva district straddles
  // 33500 and 33540, and the postal area named Kaleva is 33540), so without a postcode nothing is compared.
  const areaCode = (f, table) => (f.postcode && table[f.postcode] ? { pc: f.postcode } : null);
  const times = (n) => ({ 2: "twofold", 3: "threefold", 4: "fourfold", 5: "fivefold", 6: "sixfold", 10: "tenfold" })[n] ?? `${n}-fold`;
  const vs = (d) => (d === 0 ? "the same as that" : `${Math.abs(d)}% ${d > 0 ? "above" : "below"} that`);
  const SALE_KIND = ["studios", "two-room flats", "flats with three rooms or more", "flats in terraced houses"];
  // The ad's debt-free price per m² against old flats of the same kind in its postcode. Only for a block of flats with
  // a known number of rooms, or a terraced house: that is how Statistics Finland groups them.
  function salePrice(h) {
    const by = F.areaPrices?.by;
    if (!by || !h.debtFreePrice || !h.livingAreaM2) return null;
    const i = h.buildingType === "terraced house" ? 3 : h.buildingType !== "block of flats" ? -1 : h.rooms === 1 ? 0 : h.rooms === 2 ? 1 : h.rooms >= 3 ? 2 : -1;
    if (i < 0) return null;
    const at = areaCode(h, by);
    const row = at && by[at.pc][1 + i];
    if (!row) return null;
    const ad = h.debtFreePrice / h.livingAreaM2;
    return { ...at, name: by[at.pc][0], kind: SALE_KIND[i], avg: row[0], sales: row[1], ad, diff: Math.round(((ad - row[0]) / row[0]) * 100), year: F.areaPrices.year, small: row[1] < SMALL_SAMPLE };
  }
  const RENT_KIND = ["studios", "two-room flats", "flats with three rooms or more"];
  const m2 = (n) => eurc(Math.round(n * 100) / 100);
  // The ad's rent per m² against the same number of rooms in its postcode, or else new leases in its municipality.
  function rentArea(r) {
    const R = F.rents;
    if (!R || !r.rent || !r.livingAreaM2) return null;
    const k = r.rooms === 1 ? 0 : r.rooms === 2 ? 1 : r.rooms >= 3 ? 2 : -1;
    const at = k >= 0 ? areaCode(r, R.post) : null;
    const pRow = at && R.post[at.pc][1 + k];
    const muni = r.city === "Espoo" || r.city === "Kauniainen" ? "Espoo-Kauniainen" : r.city;
    const mRow = muni && R.muni[muni] ? R.muni[muni][k >= 0 ? k : 3] : null;
    const kind = k >= 0 ? `privately financed ${RENT_KIND[k]}` : "privately financed flats of every size";
    let main = null, second = "";
    if (pRow) {
      main = { avg: pRow[0], obs: pRow[1], src: "rentpost", period: R.postPeriod,
        text: `The average rent for ${kind} in postal area ${at.pc} ${esc(rentName(at.pc))} was ${m2(pRow[0])} per m² in ${qText(R.postPeriod)}${pRow[1] ? ` (${grp(pRow[1])} rents)` : ""}` };
      if (mRow?.[2] != null) second = `New leases for ${RENT_KIND[k]} in ${esc(muni)} averaged ${m2(mRow[2])} per m² in ${qText(R.muniPeriod)}.`;
    } else if (mRow) {
      const isNew = mRow[2] != null;
      main = { avg: isNew ? mRow[2] : mRow[0], obs: isNew ? mRow[3] : mRow[1], src: "rentmuni", period: R.muniPeriod,
        text: `${isNew ? "New leases" : "The average rent"} for ${kind} in ${esc(muni)} ${isNew ? "averaged" : "was"} ${m2(isNew ? mRow[2] : mRow[0])} per m² in ${qText(R.muniPeriod)}${(isNew ? mRow[3] : mRow[1]) ? ` (${grp(isNew ? mRow[3] : mRow[1])} leases)` : ""}` };
    }
    if (!main) return null;
    const ad = r.rent / r.livingAreaM2;
    return { main, second, ad, diff: Math.round(((ad - main.avg) / main.avg) * 100), muniSrc: second ? "rentmuni" : null };
  }
  // Ranked asks: the three with the lowest rank are shown, the rest go under "N more things to check", in order.
  function ranked() {
    const list = [];
    return {
      add: (rank, ask, src = []) => list.push({ rank, ask, src, i: list.length }),
      done: () => list.sort((a, b) => a.rank - b.rank || a.i - b.i),
    };
  }

  function homeResult(h) {
    const y = h.buildingYear, age = y ? YEAR - y : null, a = h.livingAreaM2;
    const capital = CAPITAL.includes(h.city);
    const rate = capital ? F.pipes.capital : F.pipes.median;
    const share = a ? near(a * rate, 100) : null;
    const rateText = `${eur(rate)} per m²${capital ? " in the capital region" : ""}`;
    const pipeTag = `Isännöintiliitto ${F.pipes.year}${a ? ` · your share: ${sq(a)} × ${eur(rate)}` : ""}`;
    const pp = h.pipeRenovation;
    const span = pp.years.length ? (pp.years.length > 1 ? `${pp.years[0]}–${pp.years[pp.years.length - 1]}` : String(pp.years[0])) : "";
    const S = h.says ?? {};
    const company = h.buildingType !== "detached house";
    const sources = ["aoyl"];
    const R = ranked();

    // Pipes first: the biggest bill a flat buyer can meet.
    let pipeDue = false;
    if (pp.status === "planned") {
      pipeDue = true;
