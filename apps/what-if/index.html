    h.debtShare = either(P, "velkaosuus|lainaosuus|yhtiölainaosuus|housing company loan share|loan share|debt share", pMoney);
    if (h.debtFreePrice == null) h.debtFreePrice = field(P, "hinta|price", pMoney); // Etuovi's header price is the debt-free price
    if (h.debtShare == null && h.debtFreePrice != null && h.sellingPrice != null) h.debtShare = Math.round((h.debtFreePrice - h.sellingPrice) * 100) / 100;
    if (h.sellingPrice == null && h.debtFreePrice != null && h.debtShare != null) h.sellingPrice = h.debtFreePrice - h.debtShare;
    if (h.debtFreePrice == null && h.sellingPrice != null) h.debtFreePrice = h.sellingPrice + (h.debtShare ?? 0);
    h.maintenanceCharge = either(P, "hoitovastike|maintenance charge|maintenance fee", pMonthly);
    h.maintenanceChargePerM2 = either(P, "hoitovastike|maintenance charge|maintenance fee", pPerM2);
    h.financingCharge = either(P, "pääomavastike|rahoitusvastike|capital charge|financing charge", pMonthly);
    h.plotRentCharge = either(P, "tontin vuokravastike|tonttivuokra|plot rent", pMonthly);
    h.totalCharge = field(P, "yhtiövastike yhteensä|vastikkeet yhteensä|vastike yhteensä|total charges?", pMonthly);
    h.livingAreaM2 = livingArea(P);
    h.buildingYear = builtIn(P);
    h.buildingType = buildingType(P);
    h.rooms = rooms(P);
    h.city = city(P);
    h.district = district(P, h.city);
    const r = renovations(P);
    h.pipeRenovation = r.pipe;
    h.renovationsPlanned = r.planned;
    h.renovationsDone = r.done;
    h.plotLeased = /tontin omistus\s*\n?\s*vuokra|plot is leased|leased plot|vuokratontti/i.test(P.text);
    return h;
  }

  function readRent(P) {
    const r = {};
    r.rent = either(P, "vuokra\\/kk|vuokra|kuukausivuokra|monthly rent|rent per month|rent", pMonthly)
      ?? P.lines.slice(0, 12).map((l) => monies(l).find((m) => m.per === "month" && !m.finance)?.v).find((v) => v >= 100) ?? null;
    const months = (s) => {
      const m = s.match(/(?<!\d)(\d(?:[.,]\d)?)\s*(?:kk|kuukauden|kuukautta|months?|month['’]s|x\s*vuokra)/i);
      return m ? toNum(m[1]) : null;
    };
    r.deposit = either(P, "vakuus|vuokravakuus|takuuvuokra|security deposit|deposit", pMoney);
    r.depositMonths = either(P, "vakuus|vuokravakuus|takuuvuokra|lisätietoa vakuudesta|security deposit|deposit", months);
    r.noDeposit = /ei vakuutta|no deposit|vakuudeton|without a deposit/i.test(P.text);
    if (r.deposit == null && r.depositMonths != null && r.rent) r.deposit = r.depositMonths * r.rent;
    if (r.depositMonths == null && r.deposit != null && r.rent) r.depositMonths = Math.round((r.deposit / r.rent) * 10) / 10;
    r.homeInsuranceRequired = /kotivakuutus(?:\s+on)?\s+(?:vaaditaan|vaadittava|pakollinen|edellytetään|edellytys)|(?:vaaditaan|edellytetään)\s+kotivakuutus|home insurance (?:is )?(?:required|mandatory|compulsory)|requires? (?:a )?home insurance/i.test(P.text) || null;
    const water = [];
    for (const src of ["vesimaksun lisätiedot", "vesimaksu|water fee|water charge|water"]) {
      const v = either(P, src, (s) => {
        if (/sisältyy|included/i.test(s)) return { included: true };
        const m = monies(s)[0];
        return m ? { amount: m.v, perPerson: m.per === "person" } : null;
      });
      if (v) water.push(v);
    }
    r.waterIncluded = water.some((w) => w.included) || /(?:rent includes|vuokraan sisältyy|sisältyy vuokraan)[^.\n]{0,20}(?:water|vesi)/i.test(P.text);
    r.waterFee = r.waterIncluded ? null : water.find((w) => w.perPerson) ?? water.find((w) => w.amount) ?? null;
    r.fixedTerm = /määräaikai|fixed[- ]term/i.test(P.text);
    r.livingAreaM2 = livingArea(P);
    r.buildingYear = builtIn(P);
    r.buildingType = buildingType(P);
    r.rooms = rooms(P);
    r.city = city(P);
    r.district = district(P, r.city);
    r.pipeRenovation = renovations(P).pipe;
    return r;
  }

  /* ---------- motorcycles ---------- */
  // Makes that build two-wheelers; Honda, Suzuki, BMW and Peugeot build cars too.
  const BIKE_ONLY = ["Yamaha", "Kawasaki", "Ducati", "KTM", "Harley-Davidson", "Triumph", "Aprilia", "Husqvarna", "Royal Enfield", "Moto Guzzi", "MV Agusta",
    "Benelli", "CFMoto", "Piaggio", "Vespa", "Kymco", "SYM", "Hyosung", "Keeway", "Rieju", "Derbi", "Husaberg", "Junak", "Tunturi", "Solifer", "Baotian"];
  const BIKE_BOTH = ["Honda", "Suzuki", "BMW", "Peugeot"];
  const BIKE_NAMES = { ...Object.fromEntries([...BIKE_ONLY, ...BIKE_BOTH].map((m) => [fold(m), m])), harley: "Harley-Davidson", "harley davidson": "Harley-Davidson", "cf moto": "CFMoto" };
  const BIKE_RE = new RegExp(String.raw`(?<![a-z0-9])(${Object.keys(BIKE_NAMES).sort((a, b) => b.length - a.length).map(reEsc).join("|")})(?![a-z0-9])`, "g");
  const ccOf = (P) => { const m = P.text.match(/(?<![\d.,])(\d{2,4}) ?(?:cc|cm³|cm3|ccm|kuutiota)(?![\p{L}\d])/iu); return m ? +m[1] : null; };

  // Motorcycle, moped, snowmobile or ATV. The ad's own class field decides first. Otherwise only singular
  // words in the title area count: Nettimoto's menu lists every class in the plural ("Mopot", "Mönkijät").
  function vehicleClass(P, car) {
    if (car.modelKey) return null;
    const cls = field(P, "ajoneuvolaji|ajoneuvoluokka|vehicle class|vehicle category", (s) => {
      const t = s.toLowerCase();
      return /moottoripyörä|motorcycle|motorbike/.test(t) ? "moto" : /mopo|moped/.test(t) ? "moped"
        : /moottorikelkka|snowmobile/.test(t) ? "snowmobile" : /mönkijä|atv|quad/.test(t) ? "atv" : null;
    });
    if (cls) return cls;
    const head = P.lines.slice(0, 8).join("\n").toLowerCase();
    if (/(?<!\p{L})(?:moottorikelkka|snowmobile|ski-doo|lynx)(?!\p{L})/u.test(head)) return "snowmobile";
    if (/(?<!\p{L})(?:mönkijä|atv|quad)(?!\p{L})/u.test(head)) return "atv";
    const cc = ccOf(P);
    const make = [...fold(P.text).matchAll(BIKE_RE)][0]?.[1];
    const onlyBikes = make && !BIKE_BOTH.map(fold).includes(make);
    const words = /(?<!\p{L})(?:moottoripyörä|motorcycle|motorbike|skootteri|scooter|katupyörä|kevari|enduro)(?!\p{L})/u.test(head);
    if (/(?<!\p{L})(?:mopo|mopedi|moped|mopoauto)(?!\p{L})/u.test(head) || /(?<!\p{L})am[- ]?(?:kortti|ajokortti|licen[cs]e)/u.test(P.low)
      || ((onlyBikes || words) && cc != null && cc <= 50)) return "moped";
    if (onlyBikes || words || (make && cc != null)) return "moto";
    return null;
  }

  const MODS = [["lowered suspension", /madallet|madallus|lowered|lowering|lyhennetyt jouset|matalammat jouset/],
    ["aftermarket exhaust", /akrapovic|yoshimura|termignoni|leovince|sc-project|tehoputki|aftermarket exhaust|sport exhaust|race exhaust/],
    ["engine changes", /viritetty|viritys|(?<!\p{L})tuned|derestrict|rajoitin poistettu|rajoittimet poistettu/u]];
  // Licence class as a fact about the bike: up to 125 cm³ and 11 kW is A1; up to 35 kW is A2; more is A.
  function licenceOf(cc, kw, hp) {
    const k = kw ?? (hp ? Math.round(hp * 0.7457) : null);
    if (cc == null && k == null) return null;
    if (cc != null && cc <= 125 && (k == null || k <= 11)) return "A1";
    return k != null ? (k <= 35 ? "A2" : "A") : null;
  }

  function readMoto(P) {
    const c = readCar(P); // year, km, price, seller, place and inspection are read the same way as for cars
    const hit = [...fold(P.text).matchAll(BIKE_RE)][0];
    let model = null;
    if (hit) {
      const end = P.text.indexOf("\n", hit.index);
      let rest = P.text.slice(hit.index + hit[0].length, end < 0 ? undefined : end).trim();
      if (!rest && end >= 0) rest = P.text.slice(end + 1).split("\n")[0].trim(); // Nettimoto puts the model on the next line
      rest = rest.split(/[,(|•●;:]| [-–] |\s(?:19|20)\d\d(?!\d)|\s\d{2,4} ?(?:cc|cm³|cm3|ccm)(?![\p{L}\d])|\s\d[\d ]* ?km(?!\p{L})/u)[0].trim();
      if (rest && rest.length <= 30 && !/^(?:ilmoitus|myydään|for sale)$/i.test(rest)) model = rest;
    }
    const m = { make: hit ? BIKE_NAMES[hit[1]] : null, model, year: c.year, km: c.km, price: c.price, previousPrice: c.previousPrice,
      officeFee: either(P, "toimistomaksu|office fee|toimituskulut", pMoney), city: c.city, lastInspection: c.lastInspection, flags: { serviceBook: c.flags.serviceBook } };
    m.engineCc = ccOf(P);
    m.powerKw = c.powerKw;
    m.powerHp = c.powerHp;
    m.sellerType = c.sellerType ?? (/(?:moottoripyörä|moto|mp)[- ]?liike|(?<!\p{L})dealer(?!\p{L})|(?<!\p{L})(?:liike|kauppa)(?!\p{L})/u.test(P.low) ? "dealer" : null);
    m.licence = licenceOf(m.engineCc, m.powerKw, m.powerHp);
    m.abs = /(?:ei|ilman|no|without) abs/i.test(P.text) ? false : /(?<!\p{L})abs(?!\p{L})/iu.test(P.text) ? true : null;
    m.modifications = MODS.filter(([, re]) => re.test(P.low)).map(([w]) => w);
    m.modified = m.modifications.length ? true : null;
    return m;
  }

  /* ---------- what kind of ad is this ---------- */
  function kindOf(P, car) {
    const t = P.low;
    const count = (res) => res.reduce((n, re) => n + (re.test(t) ? 1 : 0), 0);
    const home = count([/velaton hinta|debt[- ]free price/, /myyntihinta|selling price/, /velkaosuus|lainaosuus|loan share|debt share/,
      /hoitovastike|maintenance charge/, /yhtiövastike|rahoitusvastike|pääomavastike|capital charge|financing charge/, /myytävät asunnot|omistusasunto|osakehuoneisto|for sale/]);
    const rent = count([/vuokra\s*\/\s*kk|(?:^|\n)vuokra(?:\n|\s+\d)|kuukausivuokra|monthly rent|(?:^|\n)rent(?:\n|:|\s+\d|\s+€)/, /vuokrataan|vuokra-asunnot|for rent|to rent|to let(?!\p{L})/u,
      /(?:^|\n)vakuus(?!\p{L})|vuokravakuus|takuuvuokra|(?<!\p{L})deposit(?!\p{L})/u, /vuokranantaja|lessor|landlord|vuokralainen|tenant/, /vuokrasopimus|vuokranmaksupäivä|rent payment|(?<!\p{L})lease(?!\p{L})|rental (?:number|agreement|contract)/u]);
    const carish = count([/mittarilukema|mileage|ajettu|\d\s?(?:km|tkm)(?![\p{L}\/])/u, /vuosimalli|year model|model year|ensirek|first reg/, /vaihteisto|gearbox|automaatti|manuaali|automatic|manual/,
      /katsastettu|inspected|inspection date|katsastus/, /diesel|bensiini|petrol|hybrid|polttoaine|käyttövoima|fuel/, /rekisterinumero|registration number|vetotapa|drive type|korimalli|henkilöauto/]);
    if (home >= 2 && home >= rent) return "home";
    if (rent >= 2 && rent > home) return "rent";
    if (vehicleClass(P, car) === "moto") return "moto";
    if (car.make && carish >= 2) return "car";
    if (carish >= 4) return "car";
    if (home >= 1 && home > rent) return "home";
    if (rent >= 1) return "rent";
    return null;
  }
  function unsupported(P, car) {
    const head = P.lines.slice(0, 6).join("\n").toLowerCase();
    const hasCharges = /hoitovastike|yhtiövastike|maintenance charge/.test(P.low);
    if (car.modelKey) return null; // a known car model wins over a stray "moottoripyörät" in the site's menu
    const cls = vehicleClass(P, car);
    if (cls === "moped") return "a moped, and mopeds";
    if (cls === "snowmobile") return "a snowmobile, and snowmobiles";
    if (cls === "atv") return "an ATV, and ATVs";
    if (/(?<!\p{L})(?:vene|veneet|purjevene|moottorivene|perämoottori|boat|sailboat|outboard)(?!\p{L})/u.test(head)) return "a boat, and boats";
    if (/matkailuauto|asuntovaunu|asuntoauto|caravan|motorhome|camper/.test(head)) return "a motorhome or caravan, and those";
    // A house sold as real estate has no housing company: no charges, no company repairs, the buyer owns it all.
    const house = /omakotitalo|erillistalo|detached house|kesämökki|(?<!\p{L})(?:mökki|huvila)(?!\p{L})|vapaa-ajan asunto|cottage|summer house|(?<!\p{L})tontti(?!\p{L})|building plot/u.test(head)
      || buildingType(P) === "detached house" || /kohde on\s*\n?\s*kiinteistö|omistusmuoto\s*\n?\s*kiinteistö/.test(P.low);
    if (house && !hasCharges && !/vuokra|for rent|(?<!\p{L})rent(?!\p{L})/u.test(head)) return "a house or cottage sold as real estate, and houses";
    return null;
  }
  const SITES = [[/nettiauto/i, "Nettiauto"], [/autotalli/i, "Autotalli"], [/etuovi/i, "Etuovi"], [/oikotie/i, "Oikotie"], [/vuokraovi/i, "Vuokraovi"],
    [/nettimoto/i, "Nettimoto"], [/nettivene/i, "Nettivene"], [/tori\.fi/i, "Tori"]];

  /* ---------- the rules: what to ask, what it costs, who pays ---------- */
  const READS = "This version reads used cars and motorcycles (Nettiauto, Autotalli, Nettimoto), flats for sale (Etuovi, Oikotie) and flats to rent (Vuokraovi, Oikotie).";
  const nf = "<i>not in the ad</i>";
  const shown = (v, f = (x) => x) => (v == null || v === "" ? nf : f(v));

  function inspectionFor(c) {
    const y = c.year;
    const rows = c.modelKey ? DATA.m[c.modelKey] : null;
    let row = null, ry = null;
    if (rows && y) for (const d of [0, -1, 1, -2, 2]) if (rows[y + d]) { row = rows[y + d]; ry = y + d; break; }
    const avgYear = ry ?? y;
    return { row, ry, avg: avgYear ? DATA.avg[avgYear] ?? null : null, avgYear, make: !row && y && c.make ? DATA.mk[fold(c.make)]?.[y] ?? null : null };
  }

  const FUEL_WORDS = { "hybrid-petrol": "petrol hybrid", "hybrid-diesel": "diesel hybrid" };

  function carResult(c) {
    const name = esc([c.make, c.model].filter(Boolean).join(" ") || "Used car");
    // Traficom counts BMWs by series and Mercedes by class: "BMW 3 Series", not "BMW 320d".
    const statName = c.modelKey && fold(c.model ?? "") !== c.modelKey.split("|")[1] ? carName(c.modelKey) : name;
    const age = c.year ? YEAR - c.year : null;
    const I = inspectionFor(c);
    const causes = uniq((I.row ?? I.avg ?? []).slice(3).map((i) => DATA.areas[i]));
    const sources = ["trafi"];
    const asks = [];

    // 1. Inspections: this model against every car of the same age.
    const a1 = { q: "“Can I see the last inspection report?”", who: "you", real: true, link: { href: SRC.lookup.url, text: "Look up its details at Traficom" } };
    if (I.row && I.avg) {
      const [p, n, mkm] = I.row, avg = I.avg[0], diff = p - avg;
      const verdict = diff >= 8 ? "That’s much worse than average." : diff >= 2 ? "That’s worse than average." : diff <= -8 ? "That’s much better than average." : diff <= -2 ? "That’s better than average." : "That’s about average.";
      const nearYear = I.ry !== c.year ? ` (Traficom has too few ${c.year} cars of this model, so these are the ${I.ry} ones.)` : "";
      a1.why = `In ${DATA.trafi.year}, ${p.toFixed(1)}% of ${I.ry} ${statName} cars failed their inspection, out of ${grp(n)} inspections. For all cars from ${I.ry} it was ${I.avg[0].toFixed(1)}%. ${verdict}${nearYear}`
        + (mkm && c.km ? ` Those cars had a median of ${grp(mkm * 1000)} km; this one has ${grp(c.km)} km.` : "");
      a1.bars = [
        { label: `${statName}, ${I.ry}`, pct: p, tone: diff >= 2 ? "bad" : diff <= -2 ? "good" : "", me: true },
        { label: `All cars from ${I.ry}`, pct: avg, tone: "" },
      ];
      a1.whatif = causes.length ? `What if it fails next time? For this model the usual reasons are ${and(causes)}.` : "What if it fails next time? You pay for the repairs before you can drive it.";
      a1.tag = `Traficom inspection statistics ${DATA.trafi.year}`;
    } else if (I.make && I.avg) {
      a1.why = `Traficom lists models only when they had at least 100 inspections, and the ${name} from ${c.year} isn’t one of them. All ${esc(c.make)} cars from ${c.year}: ${I.make[0].toFixed(1)}% failed. All cars from ${c.year}: ${I.avg[0].toFixed(1)}%.`;
      a1.bars = [{ label: `All ${esc(c.make)} cars, ${c.year}`, pct: I.make[0], tone: I.make[0] - I.avg[0] >= 2 ? "bad" : I.avg[0] - I.make[0] >= 2 ? "good" : "", me: true }, { label: `All cars from ${c.year}`, pct: I.avg[0], tone: "" }];
      a1.whatif = causes.length ? `What if it fails next time? For cars this age the usual reasons are ${and(causes)}.` : "What if it fails next time? You pay for the repairs before you can drive it.";
      a1.tag = `Traficom inspection statistics ${DATA.trafi.year}`;
    } else if (I.avg) {
      a1.why = `We couldn’t find this model in Traficom’s statistics, so here is the average: ${I.avg[0].toFixed(1)}% of cars from ${c.year} failed their inspection in ${DATA.trafi.year}.`;
      a1.bars = [{ label: `All cars from ${c.year}`, pct: I.avg[0], tone: "", me: true }];
      a1.whatif = causes.length ? `What if it fails next time? For cars this age the usual reasons are ${and(causes)}.` : "What if it fails next time? You pay for the repairs before you can drive it.";
      a1.tag = `Traficom inspection statistics ${DATA.trafi.year}`;
    } else if (c.year && c.year > 2021) {
      a1.q = "“When is its first inspection due?”";
      a1.why = `A car from ${c.year} is too new for Traficom’s statistics. Its first inspection is due four years after it was first registered.`;
      a1.whatif = "What if something is wrong when it’s inspected? A newer car is often still under the maker’s warranty: ask for it in writing.";
      a1.tag = "Vehicles Act 82/2021";
      sources.push("ajl");
    } else {
      a1.why = `${c.year ? `Traficom’s statistics by year start from 2005.` : "We couldn’t read the year from the ad."} In ${DATA.trafi.year}, ${DATA.trafi.national[0]}% of all car inspections in Finland ended in a fail.`;
      a1.whatif = "What if it fails next time? You pay for the repairs before you can drive it.";
      a1.tag = `Traficom inspection statistics ${DATA.trafi.year}`;
    }
    asks.push(a1);

    // 2. The timing belt, when it matters.
    const f = c.flags;
    const beltDue = !f.timingChain && f.timingBeltReplaced === undefined && (c.km ? c.km >= 80000 : age != null && age >= 8);
    const beltNotDone = f.timingBeltReplaced === false;
    const beltTag = `AutoJerry 2026: changing a timing belt costs €${F.belt.low}–${F.belt.high}, typically €${F.belt.typical}`;
    if (f.timingBeltReplaced) {
      const when = c.beltKm ? ` at ${grp(c.beltKm)} km` : c.beltYear ? ` in ${c.beltYear}` : "";
      asks.push({ q: "“Can I see the receipt for the timing belt?”",
        why: `The ad says the timing belt was changed${when}. A receipt proves it.${c.beltKm && c.km && c.km > c.beltKm ? ` That was ${grp(c.km - c.beltKm)} km ago.` : ""} Belts are usually changed around every ${grp(F.belt.km)} km, depending on the engine.`,
        whatif: "What if it was never done and the belt snaps? It can wreck the engine.", cost: "", who: "you", tag: beltTag, real: true });
      sources.push("belt");
    } else if (beltDue || beltNotDone) {
      asks.push({ q: beltNotDone ? "“Will you lower the price for the timing belt?”" : "“Has the timing belt been changed? Or does it have a chain?”",
        why: (beltNotDone ? "The ad says the timing belt hasn’t been changed. " : "") + `Many engines have a timing belt that must be changed around every ${grp(F.belt.km)} km (${grp(F.belt.kmRange[0])}–${grp(F.belt.kmRange[1])} km, depending on the engine).${c.km ? ` This one has driven ${grp(c.km)} km.` : ""}`,
        whatif: "What if it’s overdue and snaps? It can wreck the engine.", cost: "",
        tip: `If it’s due, ask for about ${eur(F.belt.typical)} off. That’s a typical garage price.`, who: "you", tag: beltTag, real: true });
      sources.push("belt");
    }

    // 3. Who you are buying from changes your rights.
    if (c.sellerType === "dealer") {
      asks.push({ q: "“What do you promise about its condition, in writing?”",
        why: "You’re buying from a business, so consumer law covers you. If a fault shows up within a year, it’s presumed to have been there when you bought it, unless it’s normal wear for the car’s age and km. A general “sold as is” line doesn’t change that.",
        whatif: "What if the gearbox fails in month three?", cost: "", who: "The dealer answers for it, unless it’s normal wear",
        tip: f.dealerWarranty ? `The ad mentions a warranty (${esc(f.dealerWarranty)}). It comes on top of your rights, not instead of them.` : "",
        tag: "Consumer Protection Act 38/1978, chapter 5", real: true });
      sources.push("ksl");
    } else if (c.sellerType === "private") {
      asks.push({ q: "“Can I take it to a garage before I buy?”",
        why: `You’re buying from a private person. If a fault shows up next month, it’s mostly your problem: a dealer would have to answer for it for a year, a private seller doesn’t. Used-car faults are the biggest car complaint in Finland: ${Math.round(F.disputes.defectShare * 100)}% of used-car cases at consumer advice were about defects.`,
        whatif: "What if the clutch goes next month?", cost: `€${F.clutch.low}–${grp(F.clutch.high)}`, who: "you",
        tag: "Sale of Goods Act 355/1987 · KKV 2024 · clutch prices AutoJerry 2026", real: true });
      sources.push("kl", "kkv", "clutch");
    } else {
      asks.push({ q: "“Are you a dealer or a private seller?”",
        why: "It changes your rights. A dealer must answer for faults that show up within a year, unless they’re normal wear. With a private seller, a fault that shows up later is mostly your problem.",
        whatif: "What if the clutch goes next month and the seller was private?", cost: `€${F.clutch.low}–${grp(F.clutch.high)}`, who: "you",
        tag: "Consumer Protection Act, chapter 5 · Sale of Goods Act · clutch prices AutoJerry 2026", real: true });
      sources.push("ksl", "kl", "clutch");
    }

    if (asks.length < 3 && f.rustMentioned) {
      const modelRust = causes.includes("rust under the car");
      asks.splice(2, 0, { q: "“Where is the rust, and how bad is it?”",
        why: "The ad mentions rust." + (modelRust ? " Rust under the car is one of the most common reasons this model fails its inspection." : " Ask to see it, and have a garage look underneath."),
        whatif: "What if it fails the inspection on rust? You pay for the repair before you can drive it.", cost: "", who: "you",
        tag: modelRust ? `Traficom inspection statistics ${DATA.trafi.year}` : "From the ad", real: modelRust });
    }
    if (asks.length < 3) {
      asks.splice(2, 0, { q: "“Can I see the service history?”",
        why: `${f.serviceBook ? "The ad mentions a service book. " : ""}Stamped services and receipts show the car was looked after. A regular service costs €${F.service.low}–${F.service.high} at a garage.`,
        whatif: "What if services were skipped? Worn parts show up later as bigger repairs.", cost: "", who: "you",
        tag: "AutoJerry 2026 service prices", real: true });
      sources.push("service");
    }

    // Costs over two years: only numbers from the ad or with a source.
    const costs = [];
    if (c.price != null) costs.push({ what: "Asking price", note: c.previousPrice ? `From the ad · down from ${eur(c.previousPrice)}` : "From the ad", eur: c.price, seg: "price" });
    if (c.officeFee) costs.push({ what: "Office fee", note: "The dealer adds it on top · from the ad", eur: c.officeFee, seg: "price" });
    if (beltDue || beltNotDone) costs.push({ what: "Timing belt, if due", note: `Typical garage price · AutoJerry 2026`, eur: F.belt.typical, seg: "fix" });
    const inspections = age == null ? 1 : age >= 9 ? 2 : age >= 2 ? 1 : 0;
    if (inspections) costs.push({ what: inspections === 2 ? "Two inspections" : "One inspection", note: `About ${eur(F.inspectionFee.walkIn)} each · Traficom ${F.inspectionFee.year} average price`, eur: inspections * F.inspectionFee.walkIn, seg: "run" });
    costs.push({ what: "Two services", note: `Typical garage price ${eur(F.service.typical)} each · AutoJerry 2026 · estimate: depends on your km`, eur: 2 * F.service.typical, seg: "run" });
    costs.push({ what: "Insurance", note: "Depends on you and the car", eur: null, seg: "ins" });
    if (inspections) sources.push("fee");
    sources.push("service");

    // Is there a safer choice? Common cars of the same year that failed least.
    let safer = null;
    if (c.year && DATA.avg[c.year]) {
      const pool = Object.entries(DATA.m).filter(([k, ys]) => ys[c.year] && ys[c.year][1] >= 800 && k !== c.modelKey)
        .sort((a, b) => a[1][c.year][0] - b[1][c.year][0]).slice(0, 3);
      if (pool.length) {
        const mine = I.row && I.ry === c.year ? [{ label: `${statName} (this ad)`, pct: I.row[0], tone: "bad", me: true }] : [];
        safer = { label: "Is there a safer choice?", title: `Common cars from ${c.year} that failed least`,
          bars: [...pool.map(([k, ys]) => ({ label: carName(k), pct: ys[c.year][0], tone: "good" })), ...mine, { label: `All cars from ${c.year}`, pct: DATA.avg[c.year][0], tone: "" }],
          note: "Same age, fewer failed inspections. Mileage differs between models, so compare the km too.", tag: `Traficom inspection statistics ${DATA.trafi.year} · models with at least 800 inspections` };
        if (mine.length && I.row[0] <= pool[pool.length - 1][1][c.year][0]) safer.title = `This one is among the cars from ${c.year} that failed least`;
      }
    }

    // After you buy: reminders that need the car's details, for If customers.
    const later = [{ when: "Within 7 days", text: "Register yourself as the new owner. The seller hands over the papers." }];
    if (c.lastInspection && c.year) {
      const [ly, lm] = c.lastInspection.split("-").map(Number);
      let due = ly + (ly - c.year >= 9 ? 1 : 2);
      if (ly - c.year < 9 && due - c.year > 10) due = c.year + 10;
      const dueDate = new Date(due, (lm || 1) - 1, 1);
      if (dueDate < NOW) later.push({ when: "Now", text: "Its next inspection may already be due. Check before you buy." });
      else later.push({ when: `${MONTHS[(lm || 1) - 1]} ${due}`, text: `Inspection due.${causes.length ? ` Its usual weak spots: ${causes.slice(0, 2).join(", ")}.` : ""}` });
    }
    later.push({ when: "Nov–Mar", text: "Winter tyres whenever the weather or roads call for them, with at least 3 mm of tread." });
    later.push({ when: "Icy days", text: "A heads-up the evening before, for your own route." });
    sources.push("ajl", "tll", "lookup", "lvl");

    const specs = [c.year, c.km ? `${grp(c.km)} km` : null, FUEL_WORDS[c.fuel] ?? c.fuel, c.gearbox, c.sellerType === "dealer" ? "dealer" : c.sellerType === "private" ? "private seller" : null, c.city ? esc(c.city) : null].filter(Boolean).join(" · ");
    const belt = f.timingChain ? "timing chain, says the ad" : f.timingBeltReplaced ? `changed${c.beltKm ? ` at ${grp(c.beltKm)} km` : c.beltYear ? ` in ${c.beltYear}` : ""}, says the ad` : f.timingBeltReplaced === false ? "not changed, says the ad" : nf;
    return {
      kind: "car", stamp: "Used car", name, specs, price: c.price, priceLabel: "Asking price",
      steps: ["Reading the ad", c.year ? `Finding inspection results for ${c.year} ${name}` : `Finding inspection results for ${name}`,
        c.km ? `Checking what usually needs doing at ${grp(c.km)} km` : "Checking what usually needs doing", "Checking who pays if something goes wrong"],
      asks: asks.slice(0, 3), period: "Over two years", costs,
      costNote: "Only numbers from the ad or with a source. Insurance depends on you, so get your own price below.",
      safer, cover: COVER.car,
      later: { label: "After you buy", notif: { meta: "Tue 20:12", title: "Frost on your route tomorrow", text: "Black ice likely around 6:40. Leave ten minutes early and keep your distance." }, list: later },
      insure: { label: "Drive it home", title: "Get reminders for this car.", text: "They come with If car insurance. Traffic insurance is required by law from the moment the car is yours.",
        details: [["Car", c.year ? `${name}, ${c.year}` : name], c.km ? ["Km", grp(c.km)] : null, c.city ? ["Area", esc(c.city)] : null].filter(Boolean) },
      readout: [["Car", name], ["Year", shown(c.year)], ["Km", shown(c.km, grp)], ["Price", shown(c.price, eur)], ["Seller", shown(c.sellerType)], ["Fuel", shown(c.fuel)],
        ["Gearbox", shown(c.gearbox)], ["Last inspection", shown(c.lastInspection)], ["Area", shown(c.city, esc)], ["Timing belt", belt]],
      sources: uniq(sources),
    };
  }

  function homeResult(h) {
    const y = h.buildingYear, age = y ? YEAR - y : null, a = h.livingAreaM2;
    const capital = CAPITAL.includes(h.city);
    const rate = capital ? F.pipes.capital : F.pipes.median;
    const share = a ? near(a * rate, 100) : null;
    const rateText = `${eur(rate)} per m²${capital ? " in the capital region" : ""}`;
    const pipeTag = `Isännöintiliitto ${F.pipes.year}${a ? ` · your share: ${sq(a)} × ${eur(rate)}` : ""}`;
    const pp = h.pipeRenovation;
    const span = pp.years.length ? (pp.years.length > 1 ? `${pp.years[0]}–${pp.years[pp.years.length - 1]}` : String(pp.years[0])) : "";
    const sources = ["aoyl", "leaks"];
    const top = [];

    // Pipes first: the biggest bill a flat buyer can meet.
    let pipeDue = false;
    if (pp.status === "planned") {
      pipeDue = true;
      top.push({ q: "“When does the pipe renovation start, and what’s the estimate?”",
        why: `The ad says a pipe renovation is planned${span ? ` for ${span}` : ""}. A ${F.pipes.year} survey put the median cost at ${rateText}. In 2025, half of all projects cost between €${F.pipes.low} and ${eur(F.pipes.high)} per m².`,
        whatif: a ? `What if it goes ahead as planned? Your share for ${sq(a)} is about ${eur(share)}.` : `What if it goes ahead as planned? At ${eur(rate)} per m², ask the size of your share.`,
        cost: a ? `≈ ${eur(share)}` : "", tip: "Check whether the price already counts it. If not, bid with that number in mind.", who: "you", tag: pipeTag, real: true });
    } else if (pp.status === "mentioned") {
      pipeDue = !!(age && age >= 30);
      top.push({ q: "“Is the pipe renovation done, or still coming?”",
        why: `The ad mentions a pipe renovation but not clearly whether it’s done. A ${F.pipes.year} survey put the median cost at ${rateText}.`,
        whatif: a ? `What if it’s still coming? Your share for ${sq(a)} would be about ${eur(share)}.` : "What if it’s still coming? Ask the size of your share.",
        cost: a ? `≈ ${eur(share)}` : "", who: "you", tag: pipeTag, real: true });
    } else if (pp.status === "not-mentioned" && age != null && age >= 40) {
      pipeDue = true;
      top.push({ q: "“Has the pipe renovation been done?”",
        why: `The building is from ${y}, and the ad doesn’t mention a pipe renovation. Pipes usually last about ${F.pipes.life} years. A ${F.pipes.year} survey put the median cost at ${rateText}.`,
        whatif: a ? `What if it starts in the next few years? Your share for ${sq(a)} is about ${eur(share)}.` : "What if it starts in the next few years? Ask the size of your share.",
        cost: a ? `≈ ${eur(share)}` : "", tip: "If it isn’t done, the price should show it. Bid with that number in mind.", who: "you", tag: pipeTag, real: true });
    } else if (pp.status === "not-mentioned" && age != null && age >= 30) {
      top.push({ q: "“Is there a pipe condition survey?”",
        why: `The building is from ${y}. Experts advise a first pipe condition survey at ${F.pipes.survey[0]}–${F.pipes.survey[1]} years and a new one every ${F.pipes.resurvey[0]}–${F.pipes.resurvey[1]} years. It tells you when the pipe renovation is coming.`,
        whatif: a ? `What if the survey says the pipes are due? At ${eur(rate)} per m², your share for ${sq(a)} would be about ${eur(share)}.` : `What if the survey says the pipes are due? At ${eur(rate)} per m², ask the size of your share.`,
        cost: a ? `≈ ${eur(share)}` : "", who: "you", tag: `Kiinteistöliitto via Finanssiala · Isännöintiliitto ${F.pipes.year}`, real: true });
      sources.push("survey");
    }
    if (top.length) sources.push("pipes");

    // A big housing-company loan.
    const bigLoan = (h.financingCharge && h.financingCharge >= 150) || (h.debtShare && h.debtFreePrice && h.debtShare >= 0.3 * h.debtFreePrice);
    if (bigLoan && h.debtShare) {
      top.push({ q: "“Can I pay off the loan share, and what’s the interest?”",
        why: `The flat carries ${eur(h.debtShare)} of the housing company’s loan.${h.financingCharge ? ` You pay it off through a capital charge of ${eurc(h.financingCharge)} a month, on top of the maintenance charge.` : ""}`,
        whatif: "What if interest rates go up? The capital charge usually goes up with them.", cost: "", who: "you", tag: "Numbers from the ad" });
    }

    // The 5-year plan, with what the ad already says.
    const yearsOf = (p) => (p.years.length > 1 ? `${p.years[0]}–${p.years[p.years.length - 1]}` : p.years[0]);
    const planned = h.renovationsPlanned.filter((p) => p.years.length).slice(0, 3);
    const doneShell = h.renovationsDone.find((d) => d.years.length && /facade|balcony(?! door)/.test(d.en));
    const plannedShell = planned.some((p) => /facade|balcony(?! door)/.test(p.en));
    const concrete = h.buildingType === "block of flats" && y && y < 1990 && age >= 40 && !doneShell;
    let why = "Every housing company must list the repairs it expects in the next five years.";
    if (planned.length) why += ` The ad already lists: ${planned.map((p) => `${p.en} (${yearsOf(p)})`).join("; ")}.`;
    if (pp.status === "done") why += ` The pipe renovation was done${span ? ` in ${span}` : ""}.`;
    if (doneShell) why += ` Done already, says the ad: ${doneShell.en} (${yearsOf(doneShell)}).`;
    if (concrete) { why += " Concrete facades from before 1990 last about 50 years, and balconies without waterproofing about 40."; sources.push("concrete"); }
    top.push({ q: "“Can I see the manager’s certificate and the 5-year plan?”", why,
      whatif: plannedShell || concrete ? "What if a facade or balcony renovation follows? Ask for the cost estimate before you bid." : "What if a big renovation is on the list? Ask for the cost estimate before you bid.",
      cost: "", who: "you", tag: concrete ? "Limited Liability Housing Companies Act · RT 103765" : "Limited Liability Housing Companies Act", real: true });

    if (y && y < 1994) {
      top.push({ q: "“Has the flat been surveyed for asbestos?”",
        why: `The building is from ${y}. Before you renovate a bathroom or kitchen in a building from before 1994, the materials must be surveyed for asbestos, even inside one flat.`,
        whatif: "What if you plan a new bathroom? Add the survey to the cost and the timetable.", cost: "", who: "you", tag: "Government Decree 798/2015, section 7", real: true, low: true });
    }

    const leak = { q: "“Has the flat had water damage?”",
      why: `Leaks are the most expensive common home damage in Finland: ${grp(F.leaks.count)} leaks and €${Math.round(F.leaks.paid / 1e6)} million paid in ${F.leaks.year}. Ask for the flat’s renovation history and any damage reports.`,
      whatif: `What if the dishwasher leaks next winter? An average leak costs about ${eur(near(F.leaks.avg, 100))}.`, cost: `≈ ${eur(near(F.leaks.avg, 100))}`,
      who: "covered", tag: `Finanssiala, leak damages ${F.leaks.year}`, real: true };
    const asks = [...top.filter((x) => !x.low).slice(0, 2), ...top.filter((x) => x.low)].slice(0, 2);
    asks.push(leak);
    if (asks.some((x) => /asbestos/.test(x.q))) sources.push("asbestos");

    const costs = [];
    if (h.debtFreePrice) costs.push({ what: "Debt-free price", note: h.sellingPrice != null && h.debtShare ? `Selling price ${eur(h.sellingPrice)} + loan share ${eur(h.debtShare)} · from the ad` : "From the ad", eur: h.debtFreePrice, seg: "price" });
    if (h.maintenanceCharge) costs.push({ what: "Maintenance charge", note: `${eurc(h.maintenanceCharge)} a month × 60 · from the ad`, eur: h.maintenanceCharge * 60, seg: "run" });
    if (h.plotRentCharge) costs.push({ what: "Plot rent", note: `${eurc(h.plotRentCharge)} a month × 60 · from the ad`, eur: h.plotRentCharge * 60, seg: "run" });
    if (pipeDue && share) costs.push({ what: "Pipe renovation, if due", note: `${sq(a)} × ${eur(rate)} · Isännöintiliitto ${F.pipes.year}`, eur: share, seg: "fix" });
    costs.push({ what: "Home insurance", note: "Depends on the flat and you", eur: null, seg: "ins" });
    let costNote = "The renovation share is arithmetic on a real median price. With If’s own claims data the risks would be exact for this building.";
    if (h.financingCharge) costNote += ` The capital charge of ${eurc(h.financingCharge)} a month pays off the loan share, which is already in the debt-free price.`;

    const typeText = h.buildingType ?? "building";
    const place = [h.city, h.district].filter(Boolean).map(esc).join(" · ");
    const name = a ? `${h.rooms ? `${h.rooms} room${h.rooms > 1 ? "s" : ""}` : "Flat"}, ${sq(a)}` : h.rooms ? `${h.rooms}-room flat` : "Flat for sale";
    const pipeText = pp.status === "done" ? `done${span ? ` in ${span}` : ""}` : pp.status === "planned" ? `planned${span ? ` for ${span}` : ""}` : pp.status === "mentioned" ? "mentioned, not clear when" : "not mentioned";
    const notif = pipeDue && share
      ? { meta: "Mon 18:40", title: "Your building’s 5-year plan is out", text: `The pipe renovation is on it. That’s about ${eur(share)} for your flat. Here’s what to do now.` }
      : { meta: "Mon 18:40", title: "Your building’s 5-year plan is out", text: "We read it for you. Here’s what it means for your flat and your charges." };
    return {
      kind: "home", stamp: "Home for sale", name,
      specs: [place, y ? `${typeText} from ${y}` : h.buildingType, h.debtFreePrice ? `debt-free ${eur(h.debtFreePrice)}` : null].filter(Boolean).join(" · "),
      price: h.sellingPrice ?? h.debtFreePrice, priceLabel: h.sellingPrice != null ? "Selling price" : "Debt-free price",
      steps: ["Reading the ad", y ? `Looking up buildings from ${y}` : "Looking up the building", "Checking the renovation risk", "Checking who pays if something goes wrong"],
      asks, period: "Over five years", costs, costNote, cover: COVER.home,
      later: { label: "After you move in", notif, list: [
        { when: "Key day", text: "Your home insurance starts today. The flat’s details are already filled in." },
        { when: "Each spring", text: "We read your building’s 5-year plan when it comes out, and tell you what it means for you." },
        { when: "Away a week", text: "Turn off the water to the dishwasher and washing machine." },
      ] },
      insure: { label: "Before you get the keys", title: "Get reminders for this flat.", text: "They come with If home insurance. It can start on the day the flat becomes yours.",
        details: [["Flat", [a ? sq(a) : null, y ? `${typeText} from ${y}` : null].filter(Boolean).join(", ") || "From the ad"], place ? ["Area", place] : null].filter(Boolean) },
      readout: [["Type", shown(h.buildingType)], ["Size", shown(a, sq)], ["Built", shown(y)], ["Debt-free price", shown(h.debtFreePrice, eurc)], ["Selling price", shown(h.sellingPrice, eurc)],
        ["Loan share", shown(h.debtShare, eurc)], ["Maintenance charge", shown(h.maintenanceCharge, (v) => `${eurc(v)} a month`)], ["Capital charge", shown(h.financingCharge, (v) => `${eurc(v)} a month`)],
        ["Pipe renovation", pipeText], ["Area", place || nf]],
      sources: uniq([...sources, "fine"]),
    };
  }

  function rentResult(r) {
    const y = r.buildingYear, age = y ? YEAR - y : null, a = r.livingAreaM2;
    const pp = r.pipeRenovation;
    const asks = [];
    const sources = ["lease", "leaks", "fine"];

    // 1. The deposit.
    const dep = r.deposit, mo = r.depositMonths;
    if (mo && mo > F.rentDepositMaxMonths) {
      asks.push({ q: "“Why is the deposit more than three months’ rent?”",
        why: `The ad asks for ${dep ? eur(dep) : `${mo} months’ rent`}${dep && mo ? `, which is ${mo} months’ rent` : ""}. By law a deposit can be at most three months’ rent. A term asking for more is void.`,
        whatif: "What if you’ve already paid it? Ask for the extra back. The law is on your side.", cost: "", who: "The law protects you", tag: "Residential Leases Act 481/1995, section 8", real: true });
    } else if (dep || r.noDeposit) {
      asks.push({ q: "“Can we go through the flat’s condition together on move-in day?”",
        why: (dep ? `The deposit is ${eur(dep)}${mo ? ` (${mo} months’ rent)` : ""}. The landlord can keep it only for unpaid rent or damage beyond normal wear, and must return it or explain in writing within 14 days after the lease ends.`
          : "The ad says there’s no deposit. You still answer for damage you cause beyond normal wear."),
        whatif: "What if the landlord blames you for damage that was already there? Your day-one photos are your proof.", cost: "",
        who: dep ? "Without proof, it comes out of your deposit" : "Without proof, you pay", tag: "Residential Leases Act 481/1995, section 8 · KKV", real: true });
      sources.push("deposit");
    } else {
      asks.push({ q: "“How big is the deposit?”",
        why: "The ad doesn’t say. By law a deposit can be at most three months’ rent; landlords usually ask for one to three. It must be returned, or withheld in writing with reasons, within 14 days after the lease ends.",
        whatif: "What if the landlord asks for more than three months’ rent? That term is void.", cost: "", who: "The law protects you", tag: "Residential Leases Act 481/1995, section 8 · KKV", real: true });
      sources.push("deposit");
    }

    // 2. A pipe renovation while you live there, or how you get out.
    const pipeYears = pp.years.length ? ` for ${pp.years.length > 1 ? `${pp.years[0]}–${pp.years[pp.years.length - 1]}` : pp.years[0]}` : "";
    const rights = "The landlord must tell you at least six months before a big renovation starts, and you may then end the lease within 14 days. If it was announced before you move in, you don’t get a new six months.";
    if (pp.status === "planned" || pp.status === "mentioned") {
      asks.push({ q: "“When does the pipe renovation start?”", why: `The ad mentions a pipe renovation${pipeYears}. ${rights}`,
        whatif: "What if it starts while you live there? Weeks without your own bathroom. You pay less rent, or none, while you can’t use the flat.", cost: "",
        who: "Your landlord pays · your rent goes down", tag: "Residential Leases Act 481/1995, sections 21 and 23", real: true });
    } else if (pp.status !== "done" && age != null && age >= 35) {
      asks.push({ q: "“Is a pipe renovation coming?”", why: `The building is from ${y}. Pipes usually last about ${F.pipes.life} years. ${rights}`,
        whatif: "What if it starts while you live there? Weeks without your own bathroom. You pay less rent, or none, while you can’t use the flat.", cost: "",
        who: "Your landlord pays · your rent goes down", tag: "Residential Leases Act 481/1995, sections 21 and 23", real: true });
    } else {
      asks.push({ q: "“Can I leave with one month’s notice?”",
        why: r.fixedTerm ? "The ad mentions a fixed term. Ask whether and how you can leave before it ends. On an open-ended lease you can leave with one month’s notice." : "On an open-ended lease you can leave with one month’s notice. For leases signed from October 2026 the landlord needs three months, or four after two years.",
        whatif: "What if you need to move for a job or studies? Give notice in time and it costs you nothing extra.", cost: "", who: "No cost if you give notice in time", tag: "Residential Leases Act 481/1995, section 52 · KKV", real: true });
      sources.push("notice");
    }

    // 3. Your own home insurance.
    asks.push({ q: "“Do I need my own home insurance?”",
      why: `${r.homeInsuranceRequired ? "The ad says yes: home insurance is required. " : ""}The landlord’s insurance covers the building. It doesn’t cover your things or damage you cause.`,
      whatif: `What if a leak you caused reaches the flat below? An average leak costs about ${eur(near(F.leaks.avg, 100))}.`, cost: `≈ ${eur(near(F.leaks.avg, 100))}`,
      who: "covered", tag: `Finanssiala, leak damages ${F.leaks.year}`, real: true });

    const costs = [];
    if (r.rent) costs.push({ what: "Rent", note: `${eurc(r.rent)} a month × 12 · from the ad`, eur: r.rent * 12, seg: "price" });
    if (r.waterFee?.amount) costs.push({ what: "Water", note: `${eurc(r.waterFee.amount)} a month${r.waterFee.perPerson ? " per person, for one person" : ""} × 12 · from the ad`, eur: r.waterFee.amount * 12, seg: "run" });
    costs.push({ what: "Home insurance", note: "Depends on the flat and you", eur: null, seg: "ins" });
    const place = [r.city, r.district].filter(Boolean).map(esc).join(" · ");
    const typeText = r.buildingType ?? "building";
    return {
      kind: "rent", stamp: "Rental flat",
      name: a ? `${r.rooms ? `${r.rooms} room${r.rooms > 1 ? "s" : ""}` : "Flat"}, ${sq(a)}` : r.rooms ? `${r.rooms}-room flat` : "Flat to rent",
      specs: [place, y ? `${typeText} from ${y}` : r.buildingType, dep ? `deposit ${eur(dep)}` : r.noDeposit ? "no deposit" : null].filter(Boolean).join(" · "),
      price: r.rent, priceLabel: "Rent a month",
      steps: ["Reading the ad", "Checking the deposit and the lease rules", y ? `Looking up buildings from ${y}` : "Looking up the building", "Checking who pays if something goes wrong"],
      asks, period: "Over one year", costs: r.rent ? costs : null,
      costNote: dep ? `Plus the deposit of ${eur(dep)}, which you get back if the flat is in good shape.` : "Only numbers from the ad. Insurance depends on you, so get your own price below.",
      cover: COVER.rent,
      later: { label: "After you move in", notif: { meta: "Thu 19:05", title: "Moving in tomorrow?", text: "Photograph every room before you unpack. It’s your proof for the deposit." }, list: [
        { when: "Day one", text: "Photograph every room before you unpack. It’s your proof for the deposit." },
        { when: "Day one", text: "Find the water shut-off. When a hose bursts, the first minutes decide how big the damage gets." },
        { when: "Away a week", text: "Turn off the water to the dishwasher and washing machine." },
        { when: "Moving out", text: "One month’s notice from you. We remind you what to check for the deposit." },
      ] },
      insure: { label: "Before you move in", title: "Get reminders for this flat.", text: "They come with If home insurance. The landlord’s insurance doesn’t cover your things or damage you cause.",
        details: [["Flat", [a ? sq(a) : null, y ? `${typeText} from ${y}` : null].filter(Boolean).join(", ") || "From the ad"], place ? ["Area", place] : null].filter(Boolean) },
      readout: [["Rent", shown(r.rent, (v) => `${eurc(v)} a month`)], ["Deposit", r.noDeposit && !dep ? "none, says the ad" : shown(dep, eurc)], ["Size", shown(a, sq)], ["Built", shown(y)],
        ["Home insurance required", r.homeInsuranceRequired ? "yes, says the ad" : nf], ["Area", place || nf]],
      sources: uniq(sources),
    };
  }

  /* ---------- motorcycles: the rules ---------- */
  // Every sentence here comes from data/moto-rules.json, with a source. A fact that isn't in the data is left out.
  const M = F.moto ?? {};
  for (const [id, s] of Object.entries(M.sources ?? {})) SRC[`m-${id}`] = { text: s.name, url: s.url };
  const mSrc = (...ids) => ids.flat().filter((id) => id && SRC[`m-${id}`]).map((id) => `m-${id}`);
  const I = M.insurance ?? {};
  COVER.moto = {
    items: [
      I.others && { what: "You crash into someone else", who: "Your traffic insurance pays for their injuries and damage", tone: "covered", note: `Every motorcycle in traffic use must have it, by law. ${I.others.note}` },
      I.ownInjuries && { what: "You’re hurt in a crash, even one you caused", who: "Your bike’s traffic insurance pays for your injuries", tone: "covered", note: I.ownInjuries.note },
      I.gear && { what: "Your riding gear is damaged in a crash", who: I.gear.who, tone: I.gear.tone ?? "covered", note: I.gear.note },
      I.ownDamage && { what: "You drop or crash your own bike", who: I.ownDamage.who, tone: "covered", note: I.ownDamage.note },
      I.theft && { what: "The bike is stolen", who: I.theft.who, tone: "covered", note: I.theft.note },
      I.wear && { what: "The chain, sprockets, tyres or brake pads wear out", who: "Not covered · you pay", tone: "pay" },
    ].filter(Boolean),
    note: "Insurance pays for accidents, injuries and theft, not for wear. That’s why the checks above matter before you buy.",
    sources: mSrc(...["others", "ownInjuries", "gear", "ownDamage", "theft", "wear"].map((k) => I[k]?.source)),
  };

  function motoResult(m) {
    const name = esc([m.make, m.model].filter(Boolean).join(" ") || "Motorcycle");
    const L = M.licences ?? {};
    const absYear = M.abs?.over125From ? +M.abs.over125From.slice(0, 4) : null;
    const sources = [];
    const asks = [];

    // The licence class is a fact about the bike, never about the person.
    let licence = null;
    if (m.licence === "A1" && L.A1) licence = `Needs an A1 licence or higher${m.powerKw == null ? `, if its power is at most ${L.A1.maxKw} kW` : ""}`;
    if (m.licence === "A2" && L.A2) licence = `Needs an A2 licence or higher, if it meets the A2 limits (${L.A2.maxKw} kW, ${L.A2.maxKwPerKg} kW per kg)`;
    if (m.licence === "A" && L.A) licence = "Needs an A licence";
    if (licence) sources.push(...mSrc(L.source));

    // 1. No year: ask for it rather than guess.
    if (!m.year) {
      const abs = absYear ? ` It also tells you whether ABS was required when it was new: since ${absYear}, every new road bike over 125 cm³ has needed ABS, and a 125 ABS or combined brakes.` : "";
      asks.push({ q: "“What year is it, and when was it first registered?”",
        why: `The ad doesn’t say. The registration certificate shows the year, the engine size and the power.${abs}`,
        whatif: "What if it’s older than it looks? The chain, sprockets, tyres and brakes wear with age and use, and wear isn’t insured.", cost: "",
        who: "you", tag: abs ? "EU Regulation 168/2013 · If’s kasko terms" : "If’s kasko terms", real: !!I.wear });
      sources.push(...mSrc(abs ? M.abs.source : null, I.wear?.source));
    }

    // 2. Changes to the bike, and what the inspection in the ad can have been.
    const noPeriodic = M.inspection?.periodic === false;
    const when = m.lastInspection ? m.lastInspection.split("-").reverse().map(Number).join("/") : null;
    const inspectionLine = noPeriodic && when
      ? ` The ad says it was inspected in ${when}, but motorcycles have no periodic inspection: ask which inspection it was. A bike needs a registration inspection, for example, to go back on the register after an insurer had it removed as damaged.`
      : "";
    if (m.modifications.length) {
      const rules = m.modifications.map((x) => [x, M.modification?.[x.replace(/ (\w)/g, (s, c) => c.toUpperCase())]]).filter(([, r]) => r);
      let why = `The ad mentions ${and(m.modifications)}.`;
      for (const [, r] of rules) { why += ` ${r.rule}`; sources.push(...mSrc(r.source)); }
      if (M.riskIncrease) { why += ` ${M.riskIncrease.rule}`; sources.push(...mSrc(M.riskIncrease.source)); }
      why += inspectionLine;
      if (inspectionLine) sources.push(...mSrc(M.inspection.source));
      const lowered = rules.some(([x]) => x === "lowered suspension");
      const exhaust = rules.some(([x]) => x === "aftermarket exhaust");
      asks.push({ q: "“What was changed, with which parts, and who fitted them?”", why,
        whatif: lowered ? "What if you crash it? Kasko doesn’t pay for the lowering springs themselves."
          : exhaust ? "What if the silencer isn’t an approved one made for this bike? It needs a modification inspection before it’s legal."
          : "What if a change wasn’t approved? Ask for the paper before you pay.", cost: "",
        who: "you", tag: [rules.length ? "Traficom" : null, lowered ? "If’s kasko terms" : null, M.riskIncrease ? "Insurance Contracts Act 543/1994" : null].filter(Boolean).join(" · ") || "From the ad",
        real: !!(rules.length || M.riskIncrease) });
    } else if (inspectionLine) {
      asks.push({ q: "“Which inspection was it, and can I see the paper?”",
        why: `Motorcycles have no periodic inspection in Finland, so Traficom has no failure statistics by bike model.${inspectionLine}`,
        whatif: "What if it was off the register as damaged? Ask what happened and what was repaired.", cost: "", who: "you", tag: "Vehicles Act 82/2021 · Traficom", real: true });
      sources.push(...mSrc(M.inspection.source));
    }

    // 3. Who you are buying from changes your rights.
    if (m.sellerType === "dealer") {
      asks.push({ q: "“What do you promise about its condition, in writing?”",
        why: "You’re buying from a business, so consumer law covers you. If a fault shows up within a year, it’s presumed to have been there when you bought it, unless it’s normal wear for the bike’s age and km.",
        whatif: "What if the gearbox fails in month three?", cost: "", who: "The dealer answers for it, unless it’s normal wear", tag: "Consumer Protection Act 38/1978, chapter 5", real: true });
      sources.push("ksl");
    } else {
      asks.push({ q: m.sellerType === "private" ? "“Can I take it to a garage before I buy?”" : "“Are you a dealer or a private seller?”",
        why: m.sellerType === "private" ? "You’re buying from a private person. If a fault shows up next month, it’s mostly your problem: a dealer would have to answer for it for a year, a private seller doesn’t."
          : "It changes your rights. A dealer must answer for faults that show up within a year, unless they’re normal wear. With a private seller, a fault that shows up later is mostly your problem.",
        whatif: "What if the clutch or gearbox fails next month?", cost: "", who: "you", tag: "Sale of Goods Act 355/1987 · Consumer Protection Act, chapter 5", real: true });
      sources.push("kl", "ksl");
    }

    // 4. When there is room: service records, theft, ABS.
    if (asks.length < 3) {
      asks.push({ q: "“Can I see the service records?”",
        why: `${m.flags.serviceBook ? "The ad mentions a service book. " : ""}${m.km ? `The ad says ${grp(m.km)} km. ` : ""}Stamped services and receipts show the bike was looked after.`,
        whatif: "What if the chain, sprockets or tyres are worn out? That’s wear: the owner pays.", cost: "", who: "you",
        tag: I.wear ? "If’s kasko terms: wear isn’t covered" : "From the ad", real: !!I.wear });
      sources.push(...mSrc(I.wear?.source));
    }
    if (asks.length < 3 && I.theft) {
      asks.push({ q: "“Where has it been kept, and does it come with a lock?”",
        why: `Traffic insurance never covers theft. Kasko theft cover does, after your excess${I.theft.lockRequired ? ", and at If only if the bike was locked" : ""}.`,
        whatif: "What if it’s stolen from outside your home?", cost: "", who: I.theft.who, tone: "covered", tag: "If’s motorcycle insurance guide", real: true });
      sources.push(...mSrc(I.theft.source));
    }
    if (asks.length < 3 && absYear && I.ownInjuries && m.abs !== true && (!m.year || m.year < absYear)) {
      asks.push({ q: "“Does it have ABS?”",
        why: `Since ${absYear}, every new road bike over 125 cm³ has needed ABS, and a 125 ABS or combined brakes.${M.abs.effect ? ` ${M.abs.effect.text}` : ""}`,
        whatif: "What if you have to brake hard on a wet road?", cost: "", who: "Your injuries: your bike’s traffic insurance pays", tone: "covered", tag: "EU Regulation 168/2013", real: true });
      sources.push(...mSrc(M.abs.source, M.abs.effect?.source, I.ownInjuries.source));
    }

    // Costs: only the ad's numbers and sourced facts.
    const costs = [];
    if (m.price != null) costs.push({ what: "Asking price", note: m.previousPrice ? `From the ad · down from ${eur(m.previousPrice)}` : "From the ad", eur: m.price, seg: "price" });
    if (m.officeFee) costs.push({ what: "Office fee", note: "The dealer adds it on top · from the ad", eur: m.officeFee, seg: "price" });
    if (M.vehicleTax?.taxed === false) { costs.push({ what: "Vehicle tax", note: M.vehicleTax.note, eur: 0, seg: "run" }); sources.push(...mSrc(M.vehicleTax.source)); }
    costs.push({ what: "Insurance", note: "Traffic insurance is required by law while it’s in traffic use. The price depends on you and the bike", eur: null, seg: "ins" });

    // After you buy: reminders that need the bike's details, for If customers.
    const later = [{ when: "Within 7 days", text: "Register yourself as the new owner. The seller hands over the papers." }];
    if (M.newOwner) { later.push({ when: "Day one", text: M.newOwner.rule }); sources.push(...mSrc(M.newOwner.source)); }
    if (M.outOfUse) {
      later.push({ when: "Autumn", text: M.outOfUse.rule });
      later.push({ when: "Spring", text: `Put it back in traffic use before the first ride. ${M.outOfUse.ridingWhileOut}` });
      sources.push(...mSrc(M.outOfUse.source));
    }
    sources.push("ajl", "lvl");

    // Is there a safer choice? Traficom has no failure statistics for motorcycles, so the sourced pointer is ABS.
    let safer = null;
    if (absYear) {
      safer = { label: "Is there a safer choice?", title: m.abs === true ? "This one has ABS, says the ad" : "A bike with ABS",
        points: [`Since ${absYear}, every new road bike over 125 cm³ has needed ABS, and a 125 ABS or combined brakes. Enduro and trial bikes are exempt.`,
          M.abs.effect ? M.abs.effect.text : null].filter(Boolean),
        note: m.year && m.year < absYear ? `This one is from ${m.year}, before the rule: ask whether it has ABS.` : m.abs === true ? "Check it in the registration papers or on the bike." : "Ask, and check it in the registration papers or on the bike.",
        tag: ["EU Regulation 168/2013", M.abs.effect?.short].filter(Boolean).join(" · ") };
      sources.push(...mSrc(M.abs.source, M.abs.effect?.source));
    }

    const specs = [m.year, m.km ? `${grp(m.km)} km` : null, m.engineCc ? `${m.engineCc} cm³` : null, m.powerKw ? `${m.powerKw} kW` : null,
      m.sellerType === "dealer" ? "dealer" : m.sellerType === "private" ? "private seller" : null, m.city ? esc(m.city) : null].filter(Boolean).join(" · ");
    return {
      kind: "moto", stamp: "Used motorcycle", name, specs: licence ? `${specs}<br>${licence}` : specs, price: m.price, priceLabel: "Asking price",
      steps: ["Reading the ad", m.engineCc ? `Checking the licence class for ${m.engineCc} cm³` : "Checking the licence class",
        m.modifications.length ? "Checking what the changes mean for insurance" : "Checking the seller’s duties", "Checking who pays if something goes wrong"],
      asks: asks.slice(0, 3), period: "Over two years", costs,
      costNote: "Only numbers from the ad or with a source. Insurance depends on you, so get your own price below.",
      safer, cover: COVER.moto,
      later: { label: "After you buy", notif: M.outOfUse ? { meta: "Sun 18:30", title: "Storing the bike for winter?", text: M.outOfUse.rule } : null, list: later },
      insure: { label: "Ride it home", title: "Get reminders for this motorcycle.", text: "They come with If insurance. Traffic insurance is required by law from the moment the bike is yours.",
        details: [["Bike", m.year ? `${name}, ${m.year}` : name], m.engineCc ? ["Engine", `${m.engineCc} cm³`] : null, m.km ? ["Km", grp(m.km)] : null, m.city ? ["Area", esc(m.city)] : null].filter(Boolean) },
      readout: [["Bike", name], ["Year", shown(m.year)], ["Km", shown(m.km, grp)], ["Engine", shown(m.engineCc, (v) => `${v} cm³`)], ["Power", shown(m.powerKw, (v) => `${v} kW`)],
        ["Licence class", shown(m.licence)], ["Price", shown(m.price, eur)], ["Seller", shown(m.sellerType)], ["ABS", m.abs === true ? "yes, says the ad" : m.abs === false ? "no, says the ad" : nf],
        ["Changes", m.modifications.length ? esc(and(m.modifications)) : nf], ["Area", shown(m.city, esc)]],
      sources: uniq(sources),
    };
  }

  /* ---------- entry points ---------- */
  function read(raw) {
    const P = prep(raw);
    const car = readCar(P);
    if (unsupported(P, car)) return { kind: "unsupported" };
    const kind = kindOf(P, car);
    if (kind === "car") return { kind, ...car };
    if (kind === "moto") return { kind, ...readMoto(P) };
    if (kind === "home") return { kind, ...readHome(P) };
    if (kind === "rent") return { kind, ...readRent(P) };
    return { kind: null };
  }

  function analyse(raw) {
    const P = prep(raw);
    if (P.text.length < 30) return { message: "Paste the whole ad: everything from the title down to the seller’s details." };
    const site = SITES.find(([re]) => re.test(P.text))?.[1];
    if (P.lines.length <= 3 && /https?:\/\/|www\./i.test(P.text)) {
      if (site === "Nettivene") return { message: `That’s a link to Nettivene. ${READS} Boats come in the full version.` };
      return { message: `That’s a link${site ? ` to ${site}` : ""}. This page can’t open other websites. Open the ad, select all its text, copy it and paste it here.` };
    }
    const car = readCar(P);
    const odd = unsupported(P, car);
    if (odd) {
      const [what, plural] = odd.split(", and ");
      return { message: `This looks like ${what}. ${READS} ${plural[0].toUpperCase() + plural.slice(1)} come in the full version.` };
    }
    const kind = kindOf(P, car);
    if (kind === "car") return carResult(car);
    if (kind === "moto") return motoResult(readMoto(P));
    if (kind === "home") return homeResult(readHome(P));
    if (kind === "rent") return rentResult(readRent(P));
    return { message: `We couldn’t tell what this ad is for. ${READS} Paste the ad’s text, not the link.` };
  }

  /* ---------- the AI reader, for ads the rules can't read ---------- */
  // Contract with deploy/what-if: POST /api/read {text} → {ok, model, kind, fields, draft}. The rules stay first;
  // the AI is asked only when they can't read the ad. Any failure, or no answer within 12 s, means "no AI".
  const AI_URL = "/api/read";
  const AI_MAX = 12000;
  const AI_TIMEOUT = 12000;

  // Out before an ad goes anywhere: e-mail addresses, phone numbers, and the seller's name where a site's layout shows it.
  const EMAIL = /[\p{L}\d._%+-]+@[\p{L}\d-]+(?:\.[\p{L}\d-]+)*\.\p{L}{2,}/gu;
  const PHONE = /(?:\+|00|\()?\d[\d \t()-]{5,18}\d/g;
  const PERSON = /^[\p{Lu}][\p{Ll}'’-]+(?: [\p{Lu}][\p{Ll}'’-]+){1,3}$/u;
  function stripContacts(raw) {
    let t = String(raw ?? "").replace(EMAIL, "[email removed]");
    t = t.replace(PHONE, (m, at, s) => {
      const digits = m.replace(/\D/g, "");
      const phoneLike = /^(?:\+|00|\(?0)/.test(m);
      const after = s.slice(at + m.length, at + m.length + 8).toLowerCase();
      if (!phoneLike || digits.length < 7 || digits.length > 13) return m;
      if (/^\s?(?:€|e(?!\p{L})|eur|km|kg|m²|m2|cm|kw|hv|hp|%)/u.test(after)) return m;
      return "[phone removed]";
    });
    const lines = t.split(/\r?\n/);
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (/^(?:jäsenenä \d+ vuotta|member for \d+ years?|ota yhteyttä|contact)$/i.test(line) && PERSON.test((lines[i + 1] ?? "").trim())) lines[i + 1] = "[name removed]";
      if (/^(?:näytä numero|show number|lähetä viesti(?: ilmoittajalle)?|send a message)$/i.test(line) && i > 0 && PERSON.test(lines[i - 1].trim())) lines[i - 1] = "[name removed]";
    }
    return lines.join("\n").replace(/[\p{Lu}][\p{Ll}'’-]+ [\p{Lu}][\p{Ll}'’-]+(?=,?\s*(?:puh|p\.|tel|phone|\[phone removed\]|\[email removed\]))/gu, "[name removed]");
  }

  // Ask the AI only when the rules can't give a full result: a car or motorcycle needs make and model,
  // a flat for sale its building year and a price, a rental its rent. Links and scraps never go out.
  function plan(raw) {
    const P = prep(raw);
    if (P.text.length < 30 || (P.lines.length <= 3 && /https?:\/\/|www\./i.test(P.text))) return { callAI: false, read: null };
    const r = read(raw);
    const enough = r.kind === "car" || r.kind === "moto" ? !!(r.make && r.model)
      : r.kind === "home" ? !!(r.buildingYear && (r.debtFreePrice || r.sellingPrice))
      : r.kind === "rent" ? !!r.rent : false;
    return { callAI: !enough, read: r };
  }

  // The AI's fields, checked one by one: wrong types, out-of-range numbers and unknown values become null.
  const fNum = (v, lo, hi) => (typeof v === "number" && Number.isFinite(v) && v >= lo && v <= hi ? v : null);
  const fStr = (v, max = 60) => (typeof v === "string" && v.trim() && v.trim().length <= max ? v.trim() : null);
  const fOne = (v, list) => (list.includes(v) ? v : null);
  const fBool = (v) => (typeof v === "boolean" ? v : null);
  const fDate = (v) => (typeof v === "string" && /^(?:19|20)\d\d-(?:0[1-9]|1[0-2])(?:-\d\d)?$/.test(v) ? v : null);
  const pick = (f, path) => (path in f ? f[path] : path.split(".").reduce((o, k) => (o == null ? o : o[k]), f));
  const ckeys = (f, o) => Object.keys(o).filter((k) => o[k] != null && pick(f, k) != null);
  function aiFields(kind, f) {
    const common = { city: fStr(pick(f, "city"), 40), district: fStr(pick(f, "district"), 40) };
    if (kind === "car") return { make: fStr(pick(f, "make"), 30), model: fStr(pick(f, "model"), 40), year: fNum(pick(f, "year"), 1950, YEAR + 1),
      km: fNum(pick(f, "km"), 0, 2e6), price: fNum(pick(f, "price"), 100, 1e7), previousPrice: fNum(pick(f, "previousPrice"), 100, 1e7), officeFee: fNum(pick(f, "officeFee"), 1, 5000),
      fuel: fOne(pick(f, "fuel"), ["petrol", "diesel", "electric", "gas", "hybrid-petrol", "hybrid-diesel", "plug-in hybrid"]), gearbox: fOne(pick(f, "gearbox"), ["manual", "automatic"]),
      sellerType: fOne(pick(f, "sellerType"), ["private", "dealer"]), city: common.city, lastInspection: fDate(pick(f, "lastInspection")),
      flags: Object.fromEntries(["timingBeltReplaced", "timingChain", "serviceBook", "rustMentioned"].map((k) => [k, fBool(pick(f, `flags.${k}`)) ?? undefined]).filter(([, v]) => v !== undefined)) };
    if (kind === "moto") return { make: fStr(pick(f, "make"), 30), model: fStr(pick(f, "model"), 40), year: fNum(pick(f, "year"), 1950, YEAR + 1),
      km: fNum(pick(f, "km"), 0, 1e6), price: fNum(pick(f, "price"), 50, 1e6), officeFee: fNum(pick(f, "officeFee"), 1, 5000), engineCc: fNum(pick(f, "engineCc"), 30, 3000),
      powerKw: fNum(pick(f, "powerKw"), 1, 300), sellerType: fOne(pick(f, "sellerType"), ["private", "dealer"]), city: common.city, lastInspection: fDate(pick(f, "lastInspection")),
      abs: fBool(pick(f, "abs")), modifications: Array.isArray(pick(f, "modifications")) ? pick(f, "modifications").filter((x) => MODS.some(([w]) => w === x)) : null };
    if (kind === "home") {
      const pr = pick(f, "pipeRenovation") ?? {};
      const status = fOne(pick(f, "pipeRenovation.status") ?? pr.status, ["done", "planned", "mentioned", "not-mentioned"]);
      const years = (pick(f, "pipeRenovation.years") ?? pr.years ?? []).filter?.((y) => fNum(y, 1950, 2050) != null) ?? [];
      return { buildingYear: fNum(pick(f, "buildingYear"), 1800, YEAR + 2), livingAreaM2: fNum(pick(f, "livingAreaM2"), 8, 1000),
        debtFreePrice: fNum(pick(f, "debtFreePrice"), 1000, 1e8), sellingPrice: fNum(pick(f, "sellingPrice"), 1000, 1e8), debtShare: fNum(pick(f, "debtShare"), 0, 1e8),
        maintenanceCharge: fNum(pick(f, "maintenanceCharge"), 0, 10000), financingCharge: fNum(pick(f, "financingCharge"), 0, 10000), plotRentCharge: fNum(pick(f, "plotRentCharge"), 0, 10000),
        rooms: fNum(pick(f, "rooms"), 1, 20), ...common, pipeRenovation: status ? { status, years } : null };
    }
    if (kind === "rent") return { rent: fNum(pick(f, "rent"), 50, 20000), deposit: fNum(pick(f, "deposit"), 0, 100000), depositMonths: fNum(pick(f, "depositMonths"), 0, 12),
      buildingYear: fNum(pick(f, "buildingYear"), 1800, YEAR + 2), livingAreaM2: fNum(pick(f, "livingAreaM2"), 8, 1000), homeInsuranceRequired: fBool(pick(f, "homeInsuranceRequired")),
      rooms: fNum(pick(f, "rooms"), 1, 20), ...common };
    return null;
  }

  // Wherever the rules read a field, the rules' value wins; the AI fills the gaps.
  function fill(rules, ai) {
    const out = { ...rules };
    const used = [];
    for (const [k, v] of Object.entries(ai)) {
      if (v == null || k === "flags") continue;
      if (out[k] == null || (Array.isArray(out[k]) && !out[k].length && Array.isArray(v) && v.length)) { out[k] = v; used.push(k); }
    }
    if (ai.flags) for (const [k, v] of Object.entries(ai.flags)) if (out.flags?.[k] === undefined) { out.flags = { ...(out.flags ?? {}), [k]: v }; used.push(k); }
    return { out, used };
  }
  const WORDS = { make: "make", model: "model", year: "year", km: "km", price: "price", previousPrice: "earlier price", officeFee: "office fee", fuel: "fuel", gearbox: "gearbox",
    sellerType: "seller", city: "place", district: "district", lastInspection: "last inspection", engineCc: "engine size", powerKw: "power", abs: "ABS", modifications: "changes",
    buildingYear: "building year", livingAreaM2: "size", debtFreePrice: "debt-free price", sellingPrice: "selling price", debtShare: "loan share", maintenanceCharge: "maintenance charge",
    financingCharge: "capital charge", plotRentCharge: "plot rent", rooms: "rooms", pipeRenovation: "pipe renovation", rent: "rent", deposit: "deposit", depositMonths: "deposit",
    homeInsuranceRequired: "home insurance", timingBeltReplaced: "timing belt", timingChain: "timing chain", serviceBook: "service book", rustMentioned: "rust" };

  // A full result from the AI's fields, built by the same rules as a rules-read ad.
  function fromAI(kind, fields, raw, model) {
    const ai = aiFields(kind, fields && typeof fields === "object" ? fields : {});
    if (!ai) return null;
    const P = prep(raw ?? "");
    let result, used;
    if (kind === "car") {
      const base = { make: null, model: null, modelKey: null, flags: {}, ...(P.text ? readCar(P) : {}) };
      const filled = fill(base, ai);
      used = filled.used;
      const c = filled.out;
      if (!c.modelKey && c.make) {
        const mm = makeModel(prep(`${c.make} ${c.model ?? ""}`));
        if (mm) { c.make = mm.make; if (mm.key) { c.modelKey = mm.key; c.model = c.model ?? mm.text; } }
      }
      if (!c.make || !c.model) return null;
      result = carResult(c);
    } else if (kind === "moto") {
      const base = { make: null, model: null, modifications: [], flags: {}, ...(P.text ? readMoto(P) : {}) };
      const { out, used: u } = fill(base, ai);
      used = u;
      out.licence = licenceOf(out.engineCc, out.powerKw, out.powerHp);
      out.modifications = out.modifications ?? [];
      out.modified = out.modifications.length ? true : null;
      if (!out.make) return null;
      result = motoResult(out);
    } else if (kind === "home") {
      const base = { renovationsPlanned: [], renovationsDone: [], pipeRenovation: null, ...(P.text ? readHome(P) : {}) };
      if (base.pipeRenovation?.status === "not-mentioned" && ai.pipeRenovation) base.pipeRenovation = null;
      const { out, used: u } = fill(base, ai);
      used = u;
      out.pipeRenovation = out.pipeRenovation ?? { status: "not-mentioned", years: [] };
      if (out.debtFreePrice == null && out.sellingPrice != null) out.debtFreePrice = out.sellingPrice + (out.debtShare ?? 0);
      if (!out.buildingYear && !out.debtFreePrice) return null;
      result = homeResult(out);
    } else if (kind === "rent") {
      const base = { pipeRenovation: { status: "not-mentioned", years: [] }, noDeposit: false, fixedTerm: false, waterFee: null, ...(P.text ? readRent(P) : {}) };
      const { out, used: u } = fill(base, ai);
      used = u;
      if (out.deposit == null && out.depositMonths && out.rent) out.deposit = out.depositMonths * out.rent;
      if (!out.rent) return null;
      result = rentResult(out);
    }
    if (!result) return null;
    const words = uniq(used.map((k) => WORDS[k]).filter(Boolean));
    result.ai = { model: esc(String(model ?? "AI model").slice(0, 80)), fields: words };
    if (words.length) result.aiNote = `An AI model read these details from the ad: ${esc(and(words))}. Check them against the ad.`;
    return result;
  }

  // A draft for anything we have no facts for: written by the AI, shown as such, with no figures.
  const WHO_AI = { you: ["pay", "Not covered · you pay"], insurance: ["covered", "Covered by insurance · after your excess"], check: ["other", "Depends on the policy · check before you sign"] };
  const noFigures = (s) => !/€|%|(?<!\p{L})euro/iu.test(s);
  function draftResult(draft, model) {
    if (!draft || typeof draft !== "object") return null;
    const item = fStr(draft.item, 80);
    const asks = (Array.isArray(draft.asks) ? draft.asks : []).map((a) => fStr(a, 220)).filter((a) => a && noFigures(a)).slice(0, 3);
    const whatIfs = (Array.isArray(draft.whatIfs) ? draft.whatIfs : []).filter((w) => w && fStr(w.text, 220) && noFigures(w.text) && WHO_AI[w.whoPays]).slice(0, 4)
      .map((w) => ({ text: esc(w.text.trim()), who: WHO_AI[w.whoPays][1], tone: WHO_AI[w.whoPays][0] }));
    if (!item || !asks.length || !whatIfs.length) return null;
    // Asks are things to say to the seller, in quotes, unless they already quote the ad ("The ad says “…”").
    const quote = (q) => (/[“”"]/.test(q) ? q : `“${q}”`);
    return {
      kind: "draft", item: esc(item), model: esc(String(model ?? "AI model").slice(0, 80)),
      asks: asks.map((q) => esc(quote(q))), whatIfs,
      disclaimer: "First draft. An AI model read the ad and wrote the questions that quote it. The rest are general questions and what-ifs for this kind of item. None of it is checked like our car, motorcycle and flat results.",
      insure: { label: "Before you sign", title: "Ask If about cover for it.", text: "The item from the ad is already filled in, so you don’t have to type it again.", details: [["Item", esc(item)]] },
    };
  }

  // One POST to /api/read with a time limit. Any failure or a late answer is null: the caller then does what it did before.
  async function ask(body, fetchImpl, url, timeoutMs) {
    const ctrl = typeof AbortController === "function" ? new AbortController() : null;
    let timer;
    const timeout = new Promise((_, no) => { timer = setTimeout(() => { ctrl?.abort(); no(new Error("timeout")); }, timeoutMs); });
    const work = (async () => {
      const res = await fetchImpl(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), signal: ctrl?.signal });
      return res && res.ok ? res.json() : null;
    })();
    work.catch(() => {}); // a late failure after the time limit is not an error
    try {
      const answer = await Promise.race([work, timeout]);
      return answer && answer.ok === true ? answer : null;
    } catch {
      return null;
    } finally {
      clearTimeout(timer);
    }
  }

  // Rules first; the AI only when needed; today's behaviour whenever the AI can't help.
  async function analyseWithAI(raw, { fetch: fetchImpl, url = AI_URL, timeoutMs = AI_TIMEOUT } = {}) {
    const p = plan(raw);
    if (!p.callAI || typeof fetchImpl !== "function") return analyse(raw);
    const answer = await ask({ text: stripContacts(raw).slice(0, AI_MAX) }, fetchImpl, url, timeoutMs);
    if (!answer) return analyse(raw);
    if (["car", "moto", "home", "rent"].includes(answer.kind)) return fromAI(answer.kind, answer.fields, raw, answer.model) ?? analyse(raw);
    if (answer.kind === "other") return draftResult(answer.draft, answer.model) ?? analyse(raw);
    return analyse(raw);
  }

  /* ---------- screenshots ---------- */
  // Contract: POST /api/read {image: "data:image/jpeg;base64,…"} (PNG, JPEG or WebP, at most 8,000,000 characters),
  // never text and image together. The answer is as for text, plus "transcript": the text read off the picture.
  // The transcript goes through the rules like pasted text, so wherever the rules read a field, their value wins.
  // A long ad takes several screenshots: up to SHOTS_MAX go one by one (each is one request, so each counts as one ad
  // on the reader), their transcripts are joined in order, and the rules read the whole ad from that. The AI's fields
  // from every screenshot fill what the rules miss, the first screenshot that names a field winning.
  const IMAGE_MAX = 8000000;
  const IMAGE_TIMEOUT = 30000;
  const SHOTS_MAX = 4;
  const SHOT_FAIL = "We couldn’t read an ad from that screenshot. Try one that shows the whole ad, or paste the ad’s text.";
  const SHOT_NOTE = "Read from your screenshot by an AI model on our team’s own computer.";
  const READ_KINDS = ["car", "moto", "home", "rent"];
  const isImage = (image) => typeof image === "string" && image.length <= IMAGE_MAX && /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/]+=*$/.test(image);
  const shotNote = (read, sent) => (sent === 1 ? SHOT_NOTE
    : read === sent ? `Read from your ${sent} screenshots by an AI model on our team’s own computer.`
    : `Read from ${read} of your ${sent} screenshots by an AI model on our team’s own computer; the other${sent - read > 1 ? "s" : ""} couldn’t be read.`);
  // The most common kind among the answers; on a tie, the first screenshot's.
  const shotKind = (answers) => {
    const kinds = answers.map((a) => a.kind).filter((k) => [...READ_KINDS, "other"].includes(k));
    return kinds.reduce((best, k) => (kinds.filter((x) => x === k).length > kinds.filter((x) => x === best).length ? k : best), kinds[0]);
  };
  // First non-empty value per field across the screenshots; flags and other small objects are merged the same way.
  const empty = (x) => x == null || (Array.isArray(x) && !x.length);
  const mergeFields = (list) => {
    const out = {};
    for (const fields of list) {
      if (!fields || typeof fields !== "object") continue;
      for (const [k, v] of Object.entries(fields)) {
        if (v && typeof v === "object" && !Array.isArray(v)) out[k] = { ...v, ...Object.fromEntries(Object.entries(out[k] ?? {}).filter(([, x]) => !empty(x))) };
        else if (empty(out[k]) && !empty(v)) out[k] = v;
      }
    }
    return out;
  };
  async function analyseImages(images, { fetch: fetchImpl, url = AI_URL, timeoutMs = IMAGE_TIMEOUT } = {}) {
    const fail = { message: SHOT_FAIL };
    const list = (Array.isArray(images) ? images : [images]).slice(0, SHOTS_MAX);
    if (typeof fetchImpl !== "function" || !list.length || !list.every(isImage)) return fail;
    const answers = (await Promise.all(list.map((image) => ask({ image }, fetchImpl, url, timeoutMs)))).filter(Boolean);
    if (!answers.length) return fail;
    const texts = answers.map((a) => (typeof a.transcript === "string" ? a.transcript.trim() : "")).filter(Boolean);
    const transcript = texts.length ? texts.join("\n\n").slice(0, 20000) : null;
    const kind = shotKind(answers);
    const same = answers.filter((a) => a.kind === kind);
    const r = READ_KINDS.includes(kind) ? fromAI(kind, mergeFields(same.map((a) => a.fields)), transcript ?? "", same[0].model)
      : kind === "other" ? draftResult(same.find((a) => a.draft)?.draft, same[0].model) : null;
    if (!r) return fail;
    return { ...r, fromScreenshot: true, shotNote: shotNote(answers.length, list.length), transcript };
  }
  const analyseImage = (image, opts) => analyseImages([image], opts);

  // The check before screenshots leave the phone: confirm(images) shows them and answers false (send nothing), true
  // (send them all) or the list the person kept after removing some.
  async function sendScreenshots(images, confirm, opts = {}) {
    const list = (Array.isArray(images) ? images : [images]).slice(0, SHOTS_MAX);
    const chosen = await confirm(list);
    const send = Array.isArray(chosen) ? chosen.slice(0, SHOTS_MAX) : chosen ? list : [];
    if (!send.length) return { cancelled: true };
    return analyseImages(send, opts);
  }
  const sendScreenshot = (image, confirm, opts) => sendScreenshots([image], (list) => confirm(list[0]), opts);

  return { read, analyse, plan, stripContacts, fromAI, draftResult, analyseWithAI, analyseImage, analyseImages, sendScreenshot, sendScreenshots, SHOTS_MAX, SHOT_FAIL, SRC, COVER, esc };
}
